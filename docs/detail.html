<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영화 상세 정보</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="ctrls" style="margin-bottom: 20px;">
    <a href="javascript:history.back()" class="btn">← 뒤로</a>
  </div>
  
  <div id="movieInfo" class="box" style="padding: 20px;">
      <h1 id="mTitle" style="margin-top:0; color:#111827;">로딩 중...</h1>
      <ul style="list-style:none; padding:0; line-height:1.8; color:#374151;">
          <li><b>개봉일:</b> <span id="mDate"></span></li>
          <li><b>등급:</b> <span id="mGrade"></span></li>
          <li><b>국가:</b> <span id="mNation"></span></li>
          <li><b>누적 관객수:</b> <span id="mAudience" style="color:#d97706; font-weight:bold;"></span></li>
          <!-- 🌟 개봉 첫 주 관객수 영역 추가 -->
          <li><b>개봉 첫 주 관객수:</b> <span id="mOpeningWeek" style="color:#2563eb; font-weight:bold;">데이터 집계 중...</span></li>
          <li style="margin-top: 10px;"><b>감독:</b> <span id="mDirectors"></span></li>
          <li><b>배우:</b> <span id="mActors"></span></li>
          <li><b>제작사:</b> <span id="mCompanys"></span></li>
      </ul>
  </div>
</div>

<script>
async function loadMovieDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const movieCd = urlParams.get('movieCd');
    if (!movieCd) { document.getElementById('mTitle').innerText = '잘못된 접근입니다.'; return; }

    try {
        // 영화 인덱스 및 첫 주 관객수 데이터 동시 로드
        const [indexRes, openingRes] = await Promise.all([
            fetch('data/search_index.json'),
            fetch('data/opening_week.json').catch(() => ({ ok: false })) // 파일이 없을 경우 예외 처리
        ]);

        const movies = await indexRes.json();
        let openingData = {};
        if (openingRes.ok) { openingData = await openingRes.json(); }

        const movie = movies.find(m => m.movieCd === movieCd);
        if (!movie) { document.getElementById('mTitle').innerText = '영화를 찾을 수 없습니다.'; return; }

        document.getElementById('mTitle').innerText = movie.movieNm;
        document.getElementById('mDate').innerText = movie.openDt;
        document.getElementById('mGrade').innerText = movie.grade || '미상';
        document.getElementById('mNation').innerText = movie.nation || '미상';
        document.getElementById('mAudience').innerText = parseInt(movie.audiAcc || 0).toLocaleString() + '명';
        
        // 🌟 개봉 첫 주 관객수 매핑
        if (openingData[movieCd]) {
            document.getElementById('mOpeningWeek').innerText = openingData[movieCd].toLocaleString() + '명';
        } else {
            document.getElementById('mOpeningWeek').innerText = '집계되지 않음';
        }

        // 🌟 감독 이름 링크 클릭 연동 (Task 3)
        const dirs = (movie.directors || []).map(d => {
            const finalId = d.id ? d.id : `name:${d.name}`;
            return `<a href="person.html?id=${encodeURIComponent(finalId)}&name=${encodeURIComponent(d.name)}" target="_blank" style="color:#2563eb; text-decoration:none; font-weight:bold;">${d.name}</a>`;
        });
        document.getElementById('mDirectors').innerHTML = dirs.length > 0 ? dirs.join(', ') : '정보 없음';

        const acts = (movie.actors || []).map(a => {
            const finalId = a.id ? a.id : `name:${a.name}`;
            return `<a href="person.html?id=${encodeURIComponent(finalId)}&name=${encodeURIComponent(a.name)}" target="_blank" style="color:#333; text-decoration:none;">${a.name}</a>`;
        });
        document.getElementById('mActors').innerHTML = acts.length > 0 ? acts.join(', ') : '정보 없음';
        
        document.getElementById('mCompanys').innerText = (movie.companys || []).map(c => c.companyNm).join(', ') || '정보 없음';

    } catch(e) {
        document.getElementById('mTitle').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
    }
}
loadMovieDetail();
</script>
</body>
</html>
