<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title data-i18n-key="movieDetailTitle">영화 상세 – K-Movie A Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/translator.js" defer></script>
  <style>
    .actor-link { margin-right:6px; }
    .muted { color:#666; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 data-i18n-key="movieDetailTitle">영화 상세 정보</h1>
    <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <div id="movieDetail" class="grid"></div>
  <div style="margin-top:12px; display:flex; gap:8px;">
    <button class="btn" onclick="smartBack()" data-i18n-key="btnBack">🔙 뒤로</button>
  </div>
</div>

<script>
function smartBack() {
    if (window.history.length <= 1) {
        window.close();
    } else {
        window.history.back();
    }
}

const params = new URLSearchParams(location.search);
const movieCd = params.get('movieCd') || '';
const box = document.getElementById('movieDetail');

const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const INDEX_URL = 'data/search/movies.json';
const YEARS_MANIFEST = 'data/years/_manifest.json';

async function tryFetchJson(url){
  try{
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  }catch{ return null; }
}

async function guessDetailJsonPaths(cd, indexEntry){
  const paths = new Set();
  const yCandidate = (indexEntry?.openDt || '').slice(0,4) || indexEntry?.prdtYear || '';
  if (yCandidate) paths.add(`data/movies/${yCandidate}/${cd}.json`);

  const manifest = await tryFetchJson(YEARS_MANIFEST);
  if (manifest && manifest.years && Array.isArray(manifest.years)){
    manifest.years.forEach(y => paths.add(`data/movies/${y}/${cd}.json`));
  } else {
    const nowY = new Date().getFullYear();
    for (let y = nowY+1; y >= 2003; y--){
      paths.add(`data/movies/${y}/${cd}.json`);
    }
  }
  paths.add(`data/movies/${cd}.json`);
  return Array.from(paths);
}

function pickMovieInfo(json){
  if (!json) return null;
  if (json.movieInfoResult?.movieInfo) return json.movieInfoResult.movieInfo;
  if (json.movieInfo) return json.movieInfo;
  const keys = ['movieCd','movieNm','openDt','showTm','genres','directors','companys','actors','audits','audiAcc'];
  const ok = keys.some(k => k in json);
  return ok ? json : null;
}

(async function main(){
  if (!movieCd){
    box.textContent = '영화 코드가 없습니다.'; return;
  }

  const index = await tryFetchJson(INDEX_URL);
  const list = index?.movies || [];
  const idxEntry = list.find(m => m.movieCd === movieCd);

  const candidates = await guessDetailJsonPaths(movieCd, idxEntry);
  let raw = null, usedUrl = '';
  for (const u of candidates){
    const j = await tryFetchJson(u);
    const info = pickMovieInfo(j);
    if (info) { raw = info; usedUrl = u; break; }
  }

  if (!raw){
    box.innerHTML = `
      <div style="padding:12px; border:1px solid #f3c2c2; background:#fff5f5; border-radius:8px;">
        캐시된 상세 정보를 찾지 못했습니다.<br/>
        <span class="muted">movieCd=${movieCd}</span>
      </div>`;
    return;
  }

  // 🌟 외부 개봉 첫 주 관객수 데이터 로드
  const openingData = await tryFetchJson('data/opening_week.json') || {};

  const title = raw.movieNm || idxEntry?.movieNm || '';
  const prdtYear = raw.prdtYear || idxEntry?.prdtYear || '';
  
  const openDtRaw = (raw.openDt || idxEntry?.openDt || '').replace(/-/g, '');
  const openFmt = openDtRaw.length === 8
    ? `${openDtRaw.slice(0,4)}-${openDtRaw.slice(4,6)}-${openDtRaw.slice(6,8)}`
    : '정보 없음';

  const showTm = raw.showTm ? `${raw.showTm}분` : '';
  const genres = (raw.genres || idxEntry?.genres || []).map(g => g.genreNm || g).join(', ') || '정보 없음';
  const companies = (raw.companys || []).map(c => c.companyNm).join(', ') || '정보 없음';

  // 🌟 직업(job) 파라미터를 추가하여 person.html로 넘김
  const getPersonLink = (cd, nm, job) => {
    const pid = cd ? cd : `name:${nm}`;
    const href = `person.html?id=${encodeURIComponent(pid)}&name=${encodeURIComponent(nm)}&job=${job}`;
    return `<a href="${href}" class="actor-link" target="_blank">${nm}</a>`;
  };

  // 🌟 감독 링크 적용 (job='director' 전달)
  const dirs = (raw.directors || []).map(d => getPersonLink(d.peopleCd, d.peopleNm, 'director')).join(', ') || '정보 없음';

  const actorArr = (raw.actors || []).map(a => ({
    cd: a.peopleCd || '',
    nm: a.peopleNm || '',
  }));

  // 🌟 배우 링크 적용 (job='actor' 전달)
  const actorLinksShort = actorArr.slice(0,5).map(a => getPersonLink(a.cd, a.nm, 'actor')).join(', ');
  const actorLinksAll = actorArr.map(a => getPersonLink(a.cd, a.nm, 'actor')).join(', ');

  const audiAcc = (raw.audiAcc != null ? raw.audiAcc : idxEntry?.audiAcc);
  const audiText = (audiAcc != null) ? `${fmtNum(audiAcc)}명` : '집계 데이터 없음';

  // 🌟 개봉 첫 주 관객수 병합 로직
  const extAudiWeek1 = openingData[movieCd];
  const audiWeek1 = raw.audiWeek1 || extAudiWeek1;
  const audiWeek1Text = (audiWeek1 != null && audiWeek1 > 0) ? `${fmtNum(audiWeek1)}명` : '<span class="muted" style="font-size:12px;">데이터 없음 (Top 10 미진입 등)</span>';

  box.innerHTML = `
    <div><strong data-i18n-key="titleLabel">제목:</strong> ${title} ${prdtYear?`<span class="muted">(${prdtYear})</span>`:''}</div>
    <div>
      <strong data-i18n-key="openDtLabel">개봉일:</strong> ${openFmt}
      ${showTm?` · <strong data-i18n-key="showTmLabel">상영시간:</strong> ${showTm}`:''}
    </div>
    <div><strong data-i18n-key="genreLabel">장르:</strong> ${genres}</div>
    <div><strong data-i18n-key="directorLabel">감독:</strong> ${dirs}</div>
    <div><strong data-i18n-key="companyLabel">제작사:</strong> ${companies}</div>
    <div><strong data-i18n-key="actorLabel">배우:</strong>
      <span id="actorsShort">${actorLinksShort || '정보 없음'}</span>
      ${actorArr.length>5 ? ` <a href="#" id="actorsMore" data-i18n-key="btnMore">더보기</a>
      <span id="actorsAll" style="display:none">${actorLinksAll}</span>` : ''}
    </div>
    <div><strong style="color:#2563eb;">개봉 첫 주 관객수:</strong> <span style="font-weight:bold; color:#111827;">${audiWeek1Text}</span></div>
    <div><strong data-i18n-key="audiAccLabel">관객수(누적):</strong> <span id="audiAccText">${audiText}</span></div>
    
    <div class="muted" style="margin-top:10px;">영화코드: ${movieCd} · <span title="사용한 캐시 경로">${usedUrl || '캐시'}</span></div>
  `;

  if (actorArr.length>5){
    document.getElementById('actorsMore').addEventListener('click', (e)=>{
      e.preventDefault();
      document.getElementById('actorsAll').style.display='inline';
      document.getElementById('actorsShort').style.display='none';
      e.target.style.display='none';
    });
  }
  
  if (window.translatePage && typeof window.translatePage === 'function') {
      window.translatePage(window.getCurrentLang ? window.getCurrentLang() : 'ko');
  }
})();
</script>
</body>
</html>
