<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`]; 
const PATHS_SENTIMENT = [`docs/data/sentiment/`, `data/sentiment/`];

let MOVIES = [];
let PEOPLE_MAP = {}; 
let GLOBAL_RANKS = new Map(); 
let myChart = null;
let sentimentCompareChart = null;

// ===== Directed Synergy Index용 Star Power 계산 설정 =====
// experiment.html의 temporal validation 결과에 따라 확정된 λ
const HISTORY_LAMBDA = 14;

// 시너지 계산에는 국내 영화만 사용
const DOMESTIC_NATIONS = new Set(['한국', '대한민국']);

// 배우별 영화 단위 Final Star Power 기록
let SYNERGY_SP_BY_ACTOR = new Map();
let SYNERGY_READY = false;

function parseSafeDate(str) {
    if (!str) return moment().toDate();
    const numStr = String(str).replace(/[^0-9]/g, '');
    if (numStr.length >= 8) {
        return moment(numStr.substring(0,8), "YYYYMMDD").toDate();
    }
    return moment().toDate();
}

function ISOWeekToDate(weekStr) {
    const parts = weekStr.split('-W');
    const year = parseInt(parts[0], 10);
    const week = parseInt(parts[1], 10);
    return moment().year(year).isoWeek(week).startOf('isoWeek').toDate();
}

const safeParseInt = (v) => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

const ACTOR_COLORS = [
    { pos: '#3b82f6', neg: '#ef4444' }, 
    { pos: '#14b8a6', neg: '#f97316' }, 
    { pos: '#8b5cf6', neg: '#eab308' }, 
    { pos: '#22c55e', neg: '#ec4899' }  
];

async function loadIndex(){
  for (const p of PATHS_INDEX) {
      try { const r = await fetch(p); if(r.ok) {
          MOVIES = await r.json();
          buildPeopleMap();
          calculateGlobalRankings();

          // 시너지 지수 계산용 Final Star Power 사전 계산
          // 기존 검색/UI/순위 기능은 그대로 두고, 시너지 기능만 별도로 추가합니다.
          buildSynergyStarPowerModel();
          return;
      }} catch(e){}
  }
}

function calculateGlobalRankings() {
    const YEAR_TOTALS = {};
    const ACTOR_SCORES = new Map();

    MOVIES.forEach(m => {
        const audi = safeParseInt(m.audiAcc);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (year && audi > 0) YEAR_TOTALS[year] = (YEAR_TOTALS[year] || 0) + audi;
    });

    MOVIES.forEach(m => {
        const A_i = safeParseInt(m.audiAcc);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (!year || A_i <= 0) return;
        
        const Total_Y = YEAR_TOTALS[year];
        const W_time = Math.max(0.1, (parseInt(year) - 2000) / 10);
        const C_i = Math.max(1, (m.actors || []).length);

        (m.actors || []).forEach((a, idx) => {
            if (!a.id) return;
            const W_role = (idx < Math.ceil(C_i / 3)) ? 1.0 : 0.5;
            const score_i = (A_i / Total_Y) * (W_role / Math.sqrt(C_i)) * W_time * 10000;
            
            if (!ACTOR_SCORES.has(a.id)) ACTOR_SCORES.set(a.id, 0);
            ACTOR_SCORES.set(a.id, ACTOR_SCORES.get(a.id) + score_i);
        });
    });

    const rankedArray = Array.from(ACTOR_SCORES.entries()).sort((a,b) => b[1] - a[1]);
    rankedArray.forEach((item, index) => {
        GLOBAL_RANKS.set(item[0], { score: Math.round(item[1]), rank: index + 1 });
    });
}


function isDomesticMovie(movie) {
    const nation = String(movie?.nation || '').trim();
    return DOMESTIC_NATIONS.has(nation);
}

function normalizeOpenDateKey(value) {
    if (!value) return "";
    const s = String(value).replace(/[^0-9]/g, '');
    return s.length >= 8 ? s.slice(0, 8) : "";
}

function actorKey(actor) {
    if (!actor) return "";
    const id = (actor.id || '').trim();
    const name = (actor.name || '').trim();
    return id ? `id:${id}` : (name ? `name:${name}` : "");
}

function targetKeyFromResolved(id, name) {
    if (id && !id.startsWith('name:')) return `id:${id}`;
    return `name:${name}`;
}

function actorMatchesTarget(actor, targetId, targetName) {
    if (!actor) return false;

    const actorId = (actor.id || '').trim();
    const actorName = (actor.name || '').trim();

    if (targetId && !targetId.startsWith('name:')) {
        return actorId === targetId;
    }
    return actorName === targetName;
}

/**
 * 시너지 계산용 영화-배우 단위 Final Star Power를 미리 계산합니다.
 *
 * Base Star Performance:
 *   B_im = W_market,m × W_role,im
 *
 * W_market,m:
 *   A_m / Total_Ym
 *
 * W_role,im:
 *   1 / log2(k_im + 1)
 *
 * History shrinkage:
 *   B^_history,im(λ)
 *     = (Σ B_ij,past + λ·μ_B,<t_m) / (n_im + λ)
 *
 *   W_history,im(λ)
 *     = sqrt(B^_history,im(λ) / μ_B,<t_m)
 *
 * Final SP:
 *   SP_im = 10,000 × B_im × W_history,im
 *
 * 중요:
 * - 국내 영화만 사용합니다.
 * - 현재 영화보다 '엄격히 이전 날짜'의 정보만 history와 μ_B에 사용합니다.
 * - 같은 개봉일의 관측치는 서로의 과거가 되지 않도록 날짜 단위로 묶어서 처리합니다.
 */
function buildSynergyStarPowerModel() {
    SYNERGY_SP_BY_ACTOR = new Map();
    SYNERGY_READY = false;

    const domesticMovies = MOVIES.filter(isDomesticMovie);

    // 1) 국내 유효 영화만 추출
    const validMovies = domesticMovies
        .map(m => {
            const dateKey = normalizeOpenDateKey(m.openDt);
            const year = dateKey ? dateKey.slice(0, 4) : "";
            const audi = safeParseInt(m.audiAcc);
            return { ...m, __dateKey: dateKey, __year: year, __audi: audi };
        })
        .filter(m =>
            m.__dateKey &&
            m.__year &&
            m.__audi > 0 &&
            Array.isArray(m.actors) &&
            m.actors.length > 0
        );

    // 2) 연도별 국내 유효 영화 관객수 합
    const yearTotals = {};
    validMovies.forEach(m => {
        yearTotals[m.__year] = (yearTotals[m.__year] || 0) + m.__audi;
    });

    // 3) 영화-배우 Base SP 관측치 생성
    const observations = [];

    validMovies.forEach(m => {
        const totalY = yearTotals[m.__year] || 0;
        if (totalY <= 0) return;

        const wMarket = m.__audi / totalY;

        m.actors.forEach((a, idx) => {
            const key = actorKey(a);
            if (!key) return;

            const creditRank = idx + 1;
            const wRole = 1 / Math.log2(creditRank + 1);
            const baseSP = wMarket * wRole;

            observations.push({
                actorKey: key,
                actorId: (a.id || '').trim(),
                actorName: (a.name || '').trim(),
                movieCd: m.movieCd,
                movieNm: m.movieNm,
                openDt: m.openDt,
                dateKey: m.__dateKey,
                baseSP,
                finalSP: 0
            });
        });
    });

    observations.sort((a, b) =>
        a.dateKey.localeCompare(b.dateKey) ||
        String(a.movieCd || '').localeCompare(String(b.movieCd || '')) ||
        a.actorKey.localeCompare(b.actorKey)
    );

    // 4) strict temporal history 계산
    const actorHistory = new Map(); // key -> {sum, n}
    let globalPastSum = 0;
    let globalPastN = 0;

    let pos = 0;
    while (pos < observations.length) {
        const currentDate = observations[pos].dateKey;
        let end = pos;

        while (end < observations.length && observations[end].dateKey === currentDate) {
            end++;
        }

        // 현재 날짜 그룹은 아직 과거에 넣지 않은 상태에서 계산
        const muPast = globalPastN > 0 ? globalPastSum / globalPastN : null;

        for (let i = pos; i < end; i++) {
            const obs = observations[i];
            const h = actorHistory.get(obs.actorKey) || { sum: 0, n: 0 };

            let wHistory = 1;

            if (muPast !== null && muPast > 0) {
                const historyEstimate =
                    (h.sum + HISTORY_LAMBDA * muPast) /
                    (h.n + HISTORY_LAMBDA);

                if (historyEstimate > 0) {
                    wHistory = Math.sqrt(historyEstimate / muPast);
                }
            }

            obs.finalSP = 10000 * obs.baseSP * wHistory;
        }

        // 계산이 끝난 뒤에만 현재 날짜 관측치를 future history에 편입
        for (let i = pos; i < end; i++) {
            const obs = observations[i];
            const h = actorHistory.get(obs.actorKey) || { sum: 0, n: 0 };

            h.sum += obs.baseSP;
            h.n += 1;
            actorHistory.set(obs.actorKey, h);

            globalPastSum += obs.baseSP;
            globalPastN += 1;
        }

        pos = end;
    }

    // 5) 배우별 SP 기록 저장
    observations.forEach(obs => {
        if (!SYNERGY_SP_BY_ACTOR.has(obs.actorKey)) {
            SYNERGY_SP_BY_ACTOR.set(obs.actorKey, []);
        }
        SYNERGY_SP_BY_ACTOR.get(obs.actorKey).push(obs);
    });

    SYNERGY_READY = true;
}

function movieContainsTarget(movie, targetId, targetName) {
    return (movie.actors || []).some(a =>
        actorMatchesTarget(a, targetId, targetName)
    );
}

/**
 * Directed Synergy Index: A → B
 *
 * S_A→B = 100 × [ mean(SP_B | A와 공동출연)
 *                  / mean(SP_B | A와 비공동출연) - 1 ]
 *
 * 반환:
 * - value: 시너지 지수(%)
 * - withCount: B가 A와 함께 출연한 국내 유효 작품 수
 * - withoutCount: B가 A 없이 출연한 국내 유효 작품 수
 * - withMean / withoutMean: 각 평균 Final SP
 *
 * 이 값은 '인과효과'가 아니라 공동출연 관계에 따른 방향성 있는 상대 성과 지수입니다.
 */
function calculateDirectedSynergy(targetId, targetName, otherActor) {
    if (!SYNERGY_READY || !otherActor) return null;

    if (actorMatchesTarget(otherActor, targetId, targetName)) {
        return { isReference: true };
    }

    const bKey = actorKey(otherActor);
    if (!bKey) return null;

    const records = SYNERGY_SP_BY_ACTOR.get(bKey) || [];
    if (records.length === 0) return null;

    const withA = [];
    const withoutA = [];

    records.forEach(rec => {
        const movie = MOVIES.find(m => m.movieCd === rec.movieCd);
        if (!movie || !isDomesticMovie(movie)) return;

        if (movieContainsTarget(movie, targetId, targetName)) {
            withA.push(rec.finalSP);
        } else {
            withoutA.push(rec.finalSP);
        }
    });

    if (withA.length === 0 || withoutA.length === 0) {
        return {
            value: null,
            withCount: withA.length,
            withoutCount: withoutA.length,
            withMean: withA.length ? withA.reduce((s, v) => s + v, 0) / withA.length : null,
            withoutMean: withoutA.length ? withoutA.reduce((s, v) => s + v, 0) / withoutA.length : null
        };
    }

    const withMean = withA.reduce((s, v) => s + v, 0) / withA.length;
    const withoutMean = withoutA.reduce((s, v) => s + v, 0) / withoutA.length;

    if (!(withoutMean > 0)) {
        return {
            value: null,
            withCount: withA.length,
            withoutCount: withoutA.length,
            withMean,
            withoutMean
        };
    }

    return {
        value: 100 * ((withMean / withoutMean) - 1),
        withCount: withA.length,
        withoutCount: withoutA.length,
        withMean,
        withoutMean
    };
}

function buildSynergyBadge(targetId, targetName, actor) {
    const result = calculateDirectedSynergy(targetId, targetName, actor);

    if (!result) return "";

    if (result.isReference) {
        return ` <span style="font-size:11px; color:#6b7280; font-weight:bold;" title="첫 번째로 입력한 기준 배우입니다.">[기준]</span>`;
    }

    if (result.value === null || !Number.isFinite(result.value)) {
        const reason =
            `Directed Synergy ${targetName}→${actor.name}: 계산 불가 | ` +
            `공동출연 유효작 ${result.withCount || 0}편 / 비공동출연 유효작 ${result.withoutCount || 0}편`;

        return ` <span style="font-size:11px; color:#9ca3af; font-weight:bold; cursor:help;" title="${reason}">[시너지 N/A]</span>`;
    }

    const value = result.value;
    const sign = value > 0 ? "+" : "";
    const color = value > 0 ? "#059669" : (value < 0 ? "#dc2626" : "#6b7280");

    const sampleWarning =
        (result.withCount < 2 || result.withoutCount < 3)
            ? " / 표본 주의: 권장 기준은 공동출연 ≥2편, 비공동출연 ≥3편"
            : "";

    const title =
        `Directed Synergy ${targetName}→${actor.name}: ${sign}${value.toFixed(1)}% | ` +
        `공동출연 평균 SP ${result.withMean.toFixed(2)} (${result.withCount}편) / ` +
        `비공동출연 평균 SP ${result.withoutMean.toFixed(2)} (${result.withoutCount}편)` +
        sampleWarning;

    return ` <span style="font-size:11px; color:${color}; font-weight:bold; cursor:help;" title="${title}">[시너지 ${sign}${value.toFixed(1)}%]</span>`;
}

function buildPeopleMap() {
    MOVIES.forEach(m => {
        const list = [...(m.actors||[]), ...(m.directors||[])];
        list.forEach(p => {
            const id = (p.id && p.id.trim()) ? p.id : `name:${p.name}`;
            if (!PEOPLE_MAP[p.name]) PEOPLE_MAP[p.name] = [];
            
            if (!PEOPLE_MAP[p.name].some(x => x.id === id)) {
                PEOPLE_MAP[p.name].push({ id: id, count: 0 });
            }
            const entry = PEOPLE_MAP[p.name].find(x => x.id === id);
            entry.count++;
        });
    });
    for (const k in PEOPLE_MAP) {
        PEOPLE_MAP[k].sort((a,b) => b.count - a.count);
    }
}

async function fetchPersonFilmos(id) {
    if (!id || id.startsWith('name:')) return null;
    const fname = `${id}.json?v=${TS}`;
    for (const prefix of PATHS_DETAILS) {
        try { 
            const r = await fetch(prefix + fname); 
            if(r.ok) {
                const data = await r.json();
                const info = (data.peopleInfoResult && data.peopleInfoResult.peopleInfo) ? data.peopleInfoResult.peopleInfo : data;
                return info.filmos || []; 
            }
        } catch(e){}
    }
    return null;
}

async function fetchSentimentData(name) {
    for (const prefix of PATHS_SENTIMENT) {
        try {
            const r = await fetch(prefix + `${name}.json?v=${TS}`);
            if (r.ok) return await r.json();
        } catch(e) {}
    }
    return null;
}

const inputEl = document.getElementById('actorInput');
const dropdownEl = document.getElementById('autocompleteList');
let currentFocus = -1;

inputEl.addEventListener('input', function() {
    const rawVal = this.value;
    const parts = rawVal.split(',').map(s => s.trim());
    let currentTyping = parts.pop();
    let lockedActors = parts.filter(s => s.length > 0);

    if (lockedActors.length === 0 && currentTyping.length > 0) {
        if (PEOPLE_MAP[currentTyping]) {
            lockedActors.push(currentTyping);
            currentTyping = ""; 
        }
    }

    closeDropdown();
    if (!currentTyping && lockedActors.length === 0) return;

    let candidatesMap = new Map();

    if (lockedActors.length === 0) {
        MOVIES.forEach(m => {
            (m.actors || []).forEach(a => {
                if (a.name.includes(currentTyping)) {
                    candidatesMap.set(a.name, (candidatesMap.get(a.name) || 0) + 1);
                }
            });
        });
    } else {
        const coMovies = MOVIES.filter(m => {
            const movieActors = (m.actors || []).map(a => a.name);
            return lockedActors.every(locked => movieActors.includes(locked));
        });

        coMovies.forEach(m => {
            (m.actors || []).forEach(a => {
                if (!lockedActors.includes(a.name) && a.name.includes(currentTyping)) {
                    candidatesMap.set(a.name, (candidatesMap.get(a.name) || 0) + 1);
                }
            });
        });
    }

    const sortedCandidates = Array.from(candidatesMap.entries())
                                  .sort((a, b) => b[1] - a[1])
                                  .slice(0, 10);

    if (sortedCandidates.length === 0) return;

    currentFocus = -1;
    dropdownEl.style.display = 'block';
    dropdownEl.innerHTML = '';

    sortedCandidates.forEach(cand => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${cand[0]}</span> <span class="cnt">같이 한 작품: ${cand[1]}편</span>`;
        li.addEventListener('click', function() {
            addActorToInput(cand[0], lockedActors);
        });
        dropdownEl.appendChild(li);
    });
});

function addActorToInput(selectedName, lockedActors) {
    lockedActors.push(selectedName);
    inputEl.value = lockedActors.join(', ') + ', ';
    closeDropdown();
    inputEl.focus();
}

inputEl.addEventListener('keydown', function(e) {
    let items = dropdownEl.getElementsByTagName('li');
    if (e.key === "ArrowDown") {
        currentFocus++;
        addActive(items);
    } else if (e.key === "ArrowUp") {
        currentFocus--;
        addActive(items);
    } else if (e.key === "Enter") {
        if (dropdownEl.style.display === 'block') {
            e.preventDefault();
            if (currentFocus > -1 && items.length > 0) {
                items[currentFocus].click();
            }
        }
    }
});

function addActive(items) {
    if (!items || items.length === 0) return;
    removeActive(items);
    if (currentFocus >= items.length) currentFocus = 0;
    if (currentFocus < 0) currentFocus = items.length - 1;
    items[currentFocus].classList.add("active");
    items[currentFocus].scrollIntoView({ block: 'nearest' });
}

function removeActive(items) {
    for (let i = 0; i < items.length; i++) items[i].classList.remove("active");
}

function closeDropdown() { dropdownEl.style.display = 'none'; }
document.addEventListener('click', function(e) { if (e.target !== inputEl) closeDropdown(); });

async function search(){
  const f = new FormData(document.getElementById('f'));
  const qRaw = f.get('q');
  if (!qRaw) return;

  const names = qRaw.split(',').map(s => s.trim()).filter(s => s);
  if (names.length < 2) {
      document.getElementById('msg').textContent = "두 명 이상의 배우 이름을 입력해주세요.";
      return;
  }

  if (MOVIES.length === 0) await loadIndex();

  const targetIds = [];
  const displayNames = [];
  
  for (const name of names) {
      const candidates = PEOPLE_MAP[name];
      if (!candidates || candidates.length === 0) {
          document.getElementById('msg').textContent = `'${name}' 배우를 찾을 수 없습니다.`;
          return;
      }
      targetIds.push(candidates[0].id);
      displayNames.push(name);
  }

  // 첫 번째로 입력된 배우를 Directed Synergy의 기준 배우(A)로 사용
  const referenceId = targetIds[0];
  const referenceName = displayNames[0];

  let commonMovies = MOVIES.filter(m => {
      const cast = [...(m.actors||[]), ...(m.directors||[])];
      return targetIds.every(tid => {
          if (tid.startsWith('name:')) {
              const tName = tid.replace('name:', '');
              return cast.some(c => c.name === tName);
          } else {
              return cast.some(c => c.id === tid);
          }
      });
  });

  const firstRealId = targetIds.find(id => !id.startsWith('name:'));
  if (firstRealId) {
      const detailedFilmos = await fetchPersonFilmos(firstRealId);
      if (detailedFilmos) {
          commonMovies = commonMovies.map(m => {
              const match = detailedFilmos.find(df => df.movieCd === m.movieCd);
              if (match && match.audiAcc) {
                  return { ...m, audiAcc: match.audiAcc };
              }
              return m;
          });
      }
  }

  commonMovies.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));

  const out = document.getElementById('out');
  out.innerHTML = '';
  document.getElementById('msg').textContent = `총 ${commonMovies.length}편 검색됨`;

  const validMovies = []; 

  for (const m of commonMovies) {
      const audiNum = safeParseInt(m.audiAcc);
      const audiStr = audiNum ? ` / <span class="audi">누적 ${fmtNum(audiNum)}명</span>` : '';

      let castStr = "";
      if (m.actors) {
          const d = m.actors.slice(0, 10).map(a => {
            const isTarget = names.includes(a.name); 
            const style = isTarget ? 'font-weight:bold; color:#000;' : '';
            
            const pid = (a.id && a.id.trim()) ? a.id : `name:${a.name}`;
            const href = `person.html?id=${encodeURIComponent(pid)}&name=${encodeURIComponent(a.name)}`;
            
            let badge = "";
            if(a.gender === "남자" || a.gender === "남") badge = " <span style='color:blue;font-size:0.8em'>(남)</span>";
            else if(a.gender === "여자" || a.gender === "여") badge = " <span style='color:red;font-size:0.8em'>(여)</span>";
            
            let rankBadge = "";
            if (a.id && GLOBAL_RANKS.has(a.id)) {
                const rInfo = GLOBAL_RANKS.get(a.id);
                rankBadge = ` <span style="font-size:11px; color:#d97706; font-weight:bold; cursor:help;" title="SP_Final 점수: ${fmtNum(rInfo.score)}점">[${rInfo.rank}위]</span>`;
            }

            // 첫 번째 검색 배우(A)를 기준으로 각 출연 배우(B)의 Directed Synergy Index 표시
            const synergyBadge = buildSynergyBadge(referenceId, referenceName, a);

            return `<a href="${href}" target="_blank" style="${style}">${a.name}</a>${badge}${rankBadge}${synergyBadge}`;
          });
          castStr = ` · 배우: ${d.join(', ')}`;
      }

      const li = document.createElement('li');
      li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}"><strong>${m.movieNm}</strong></a> 
          <span class="note">(${m.openDt}${audiStr})</span><br>
          <span class="cast-list">${castStr}</span>`;
      out.appendChild(li);

      if (m.openDt) validMovies.push({ ...m, audiAcc: audiNum });
  }

  let minDate = undefined;
  let maxDate = moment().toDate(); 

  if (validMovies.length > 0) {
      const dates = validMovies.map(m => parseSafeDate(m.openDt).getTime());
      const minTime = Math.min(...dates);
      const maxMovieTime = Math.max(...dates);
      
      minDate = moment(minTime).subtract(3, 'months').toDate();
      
      if (maxMovieTime > maxDate.getTime()) {
          maxDate = moment(maxMovieTime).add(3, 'months').toDate();
      }
  } else {
      minDate = moment().subtract(1, 'years').toDate();
  }

  drawChart(validMovies, minDate, maxDate);
  drawSentimentCompare(names, minDate, maxDate);
}

function drawChart(movies, minDate, maxDate) {
    const ctx = document.getElementById('audiChart');
    const container = document.getElementById('chart-container');
    
    if (movies.length === 0) {
        container.style.display = 'none';
        return;
    }
    container.style.display = 'block';

    if (myChart) myChart.destroy();

    const sorted = [...movies].sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));

    const dataPoints = sorted.map(m => ({
        x: parseSafeDate(m.openDt),
        y: safeParseInt(m.audiAcc),
        movieNm: m.movieNm
    }));

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: '관객수',
                data: dataPoints,
                borderColor: 'var(--accent, #009688)',
                backgroundColor: 'rgba(0, 150, 136, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 5,
                pointHoverRadius: 7
            }]
        },
        options: {
            maintainAspectRatio: false,
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        title: (tooltipItems) => tooltipItems[0].raw.movieNm,
                        label: (context) => ` 개봉: ${moment(context.raw.x).format('YYYY.MM.DD')} / 관객수: ${fmtNum(context.raw.y)}명`
                    }
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: { unit: 'year', displayFormats: { year: 'YYYY' } },
                    min: minDate,  
                    max: maxDate,  
                    grid: { display: false }
                },
                y: {
                    beginAtZero: true,
                    ticks: { callback: v => v.toLocaleString() }
                }
            }
        }
    });
}

async function drawSentimentCompare(names, minDate, maxDate) {
    const container = document.getElementById('sentiment-compare-container');
    const ctx = document.getElementById('sentimentCompareChart');
    if (sentimentCompareChart) sentimentCompareChart.destroy();

    Promise.all(names.map(name => fetchSentimentData(name))).then(sentimentResults => {
        const datasets = [];

        sentimentResults.forEach((data, i) => {
            if (!data || !data.timeline) return;
            const posPoints = [];
            const negPoints = [];
            const sortedWeeks = Object.keys(data.timeline).sort();

            sortedWeeks.forEach(w => {
                const dateObj = ISOWeekToDate(w);
                const posVal = data.timeline[w].positive || 0;
                const negVal = data.timeline[w].negative || 0;
                
                posPoints.push({ x: dateObj, y: posVal });
                negPoints.push({ x: dateObj, y: -(Math.abs(negVal)) });
            });

            posPoints.sort((a,b) => a.x - b.x);
            negPoints.sort((a,b) => a.x - b.x);

            const colors = ACTOR_COLORS[i % ACTOR_COLORS.length];

            datasets.push({
                label: `${names[i]} 긍정(+)`,
                data: posPoints,
                borderColor: colors.pos,
                backgroundColor: colors.pos,
                borderWidth: 2, tension: 0.1, pointRadius: 3
            });
            
            datasets.push({
                label: `${names[i]} 부정(-)`,
                data: negPoints,
                borderColor: colors.neg,
                backgroundColor: colors.neg,
                borderWidth: 2, tension: 0.1, pointRadius: 3
            });
        });

        if (datasets.length > 0) {
            container.style.display = 'block';

            sentimentCompareChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { 
                            type: 'time', 
                            time: { unit: 'year', displayFormats: { year: 'YYYY' } }, 
                            min: minDate, 
                            max: maxDate, 
                            grid: { display: false } 
                        },
                        y: { 
                            title: { display: true, text: '댓글 수' },
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#000000' : '#e5e7eb', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                        }
                    },
                    plugins: { 
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ` ${ctx.dataset.label}: ${Math.abs(ctx.parsed.y)}개`
                            }
                        }
                    }
                }
            });
        } else {
            container.style.display = 'none';
        }
    });
}

(async function main(){
  await loadIndex();
  document.getElementById('f').addEventListener('submit', (e)=>{ e.preventDefault(); search(); });
  
  const q = new URLSearchParams(location.search).get('q');
  if(q) {
      document.querySelector('input[name=q]').value = q;
      search();
  }
})();
</script>
