<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="costarSearch">공동 출연 검색 – K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
  /* 🌟 자동완성 드롭다운을 위한 신규 UI 스타일 (기존 사이트 테마에 맞게 융합) */
  .search-container { position: relative; width: 100%; max-width: 600px; margin-bottom: 15px; }
  .actor-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
  .dropdown { 
      position: absolute; top: 100%; left: 0; width: 100%; background: #fff; 
      border: 1px solid #ddd; border-top: none; border-radius: 0 0 6px 6px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; display: none; max-height: 250px; overflow-y: auto; list-style: none; padding: 0; margin: 0; 
  }
  .dropdown li { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
  .dropdown li:hover, .dropdown li.active { background: #eff6ff; color: #2563eb; font-weight: bold; }
  .dropdown li .cnt { font-size: 12px; color: #6b7280; font-weight: normal; }
  .result-item { border-bottom: 1px dashed #e5e7eb; padding: 10px 0; list-style: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls" style="margin-bottom:20px;">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우/감독 검색</a>
    <a href="costar-search.html" class="btn active" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="costarSearch">공동 출연 검색</h1>
  <p class="note" style="margin-bottom: 20px;">여러 배우가 함께 출연한 영화를 검색합니다. <br>(이름을 입력하면 가장 많이 함께 작업한 공동 출연자가 자동으로 추천됩니다.)</p>

  <div style="background:#f9f9f9; padding:20px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
      <div class="search-container">
          <input type="text" id="actorInput" class="actor-input" placeholder="배우 이름을 쉼표(,)로 구분하여 입력 (예: 송강호, 김혜수)" autocomplete="off">
          <ul id="autocompleteList" class="dropdown"></ul>
      </div>
      
      <button class="btn" onclick="executeCostarSearch()" style="background:#2563eb; color:#fff; border:none; padding:10px 20px; font-size:15px; border-radius:6px; cursor: pointer;">검색</button>
  </div>

  <h3 style="margin-top:30px; border-bottom:2px solid #2563eb; padding-bottom:8px;">검색 결과</h3>
  <ul id="costarResults" class="list" style="padding:0;"></ul>
</div>

<script>
let MOVIES = [];
let currentFocus = -1;

async function init() {
    try {
        // API 요청 없이 로컬 index.json 즉각 로드 (서버 부하 0%)
        const res = await fetch('data/search_index.json');
        MOVIES = await res.json();
    } catch(e) { console.error("데이터 로드 실패"); }
}
init();

const inputEl = document.getElementById('actorInput');
const dropdownEl = document.getElementById('autocompleteList');

// 🌟 드롭다운 및 자동완성 핵심 로직
inputEl.addEventListener('input', function() {
    const rawVal = this.value;
    const parts = rawVal.split(',').map(s => s.trim());
    const currentTyping = parts.pop(); // 사용자가 현재 타이핑 중인 마지막 텍스트
    const lockedActors = parts.filter(s => s.length > 0); // 이미 쉼표(,)로 확정된 앞선 배우들

    closeDropdown();
    // 아무것도 입력하지 않았을 때는 드롭다운을 열지 않음
    if (!currentTyping && lockedActors.length === 0) return;

    let candidatesMap = new Map(); // name -> count 저장용

    if (lockedActors.length === 0) {
        // 1. 단일 배우 검색 중일 때: 전체 영화에서 해당 글자가 포함된 배우 카운팅
        MOVIES.forEach(m => {
            (m.actors || []).forEach(a => {
                if (a.name.includes(currentTyping)) {
                    candidatesMap.set(a.name, (candidatesMap.get(a.name) || 0) + 1);
                }
            });
        });
    } else {
        // 2. 공동 출연자(2번째 이후) 검색 중일 때: 확정된 배우들이 모두 포함된 영화만 필터링
        const coMovies = MOVIES.filter(m => {
            const movieActors = (m.actors || []).map(a => a.name);
            return lockedActors.every(locked => movieActors.includes(locked));
        });

        // 필터링된 영화 안에서 타이핑 중인 글자가 포함된 다른 배우들 카운팅
        coMovies.forEach(m => {
            (m.actors || []).forEach(a => {
                if (!lockedActors.includes(a.name) && a.name.includes(currentTyping)) {
                    candidatesMap.set(a.name, (candidatesMap.get(a.name) || 0) + 1);
                }
            });
        });
    }

    // 카운트 수(같이 한 작품 수) 기준 내림차순 정렬 후 Top 10 자르기
    const sortedCandidates = Array.from(candidatesMap.entries())
                                  .sort((a, b) => b[1] - a[1])
                                  .slice(0, 10);

    if (sortedCandidates.length === 0) return;

    currentFocus = -1;
    dropdownEl.style.display = 'block';
    dropdownEl.innerHTML = '';

    sortedCandidates.forEach(cand => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${cand[0]}</span> <span class="cnt">같이 한 작품: ${cand[1]}편</span>`;
        li.addEventListener('click', function() {
            addActorToInput(cand[0], lockedActors);
        });
        dropdownEl.appendChild(li);
    });
});

function addActorToInput(selectedName, lockedActors) {
    lockedActors.push(selectedName);
    inputEl.value = lockedActors.join(', ') + ', '; // 확정 후 쉼표와 공백 추가
    closeDropdown();
    inputEl.focus(); // 스페이스바 치면 다음 배우 바로 입력 가능하도록 포커스 유지
}

// 🌟 키보드 방향키 및 엔터 제어
inputEl.addEventListener('keydown', function(e) {
    let items = dropdownEl.getElementsByTagName('li');
    if (e.key === "ArrowDown") {
        currentFocus++;
        addActive(items);
    } else if (e.key === "ArrowUp") {
        currentFocus--;
        addActive(items);
    } else if (e.key === "Enter") {
        e.preventDefault();
        if (currentFocus > -1 && items.length > 0 && dropdownEl.style.display === 'block') {
            items[currentFocus].click(); // 드롭다운 아이템 선택
        } else if (dropdownEl.style.display !== 'block' || items.length === 0) {
            executeCostarSearch(); // 드롭다운이 안 보일 때 엔터 누르면 최종 검색 실행
        }
    }
});

function addActive(items) {
    if (!items || items.length === 0) return;
    removeActive(items);
    if (currentFocus >= items.length) currentFocus = 0;
    if (currentFocus < 0) currentFocus = items.length - 1;
    items[currentFocus].classList.add("active");
    items[currentFocus].scrollIntoView({ block: 'nearest' });
}

function removeActive(items) {
    for (let i = 0; i < items.length; i++) items[i].classList.remove("active");
}

function closeDropdown() { dropdownEl.style.display = 'none'; }
document.addEventListener('click', function(e) { if (e.target !== inputEl) closeDropdown(); });

// 🌟 최종 공동 출연 검색 결과 출력 (기존 디자인 유지)
function executeCostarSearch() {
    closeDropdown();
    const rawVal = inputEl.value;
    const targetActors = rawVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
    const out = document.getElementById('costarResults');
    out.innerHTML = '';

    if (targetActors.length < 2) {
        out.innerHTML = '<li class="note" style="color:red; list-style:none;">공동 출연을 검색하려면 2명 이상의 배우를 입력해주세요.</li>';
        return;
    }

    const matchedMovies = MOVIES.filter(m => {
        if (!m.actors) return false;
        const movieActors = m.actors.map(a => a.name);
        return targetActors.every(target => movieActors.includes(target));
    });

    if (matchedMovies.length === 0) {
        out.innerHTML = `<li class="note" style="list-style:none;">[<b>${targetActors.join(', ')}</b>] 배우들이 모두 함께 출연한 영화가 없습니다.</li>`;
        return;
    }

    out.innerHTML = `<li class="note" style="list-style:none; font-weight:bold; color:#2563eb; margin-bottom:10px;">총 ${matchedMovies.length}편의 공동 출연작을 찾았습니다.</li>`;
    
    // 개봉일 최신순 정렬 출력
    matchedMovies.sort((a,b) => (b.openDt || '00000000') > (a.openDt || '00000000') ? 1 : -1).forEach(m => {
        const li = document.createElement('li');
        li.className = "result-item";
        li.innerHTML = `
            <a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}" target="_blank" style="font-weight:bold; color:#111827; text-decoration:none; font-size:16px;">${m.movieNm}</a>
            <span style="font-size:12px; color:#6b7280; margin-left:8px;">(${m.openDt.replace(/-/g,'.')})</span>
            <div style="font-size:13px; color:#4b5563; margin-top:6px;"><b>출연진:</b> ${m.actors.map(a=>a.name).slice(0,8).join(', ')}${m.actors.length > 8 ? ' 등' : ''}</div>
        `;
        out.appendChild(li);
    });
}
</script>
</body>
</html>
