<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="costarSearchTitle">공동 출연 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
.audi { font-size: 14px; color: #333; }
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.highlight { font-weight: bold; background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="costarSearchTitle">공동 출연 검색</h1>

  <form id="f" class="box">
    <div style="display:flex; gap:8px; align-items:center;">
        <span data-i18n-key="actorNames">배우 이름들:</span>
        <input type="text" name="q" placeholder="예: 황정민, 정우성 (쉼표로 구분)" style="flex:1;">
        <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
    </div>
  </form>

  <div id="total" class="note" style="margin-top:8px;"></div>
  <ul id="out" class="list"></ul>

  <div id="chart-container" style="display:none; margin-top: 40px;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div style="position: relative; height:300px; width:100%">
        <canvas id="audiChart"></canvas>
    </div>
  </div>
</div>

<script>
const PATHS_INDEX = [`docs/data/search_index.json?v=${Date.now()}`, `data/search_index.json?v=${Date.now()}`];
let MOVIES = [], myChart = null;

const safeParseInt = (v) => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

async function loadIndex(){
  for (const p of PATHS_INDEX) {
      try { const r = await fetch(p); if (r.ok) { MOVIES = await r.json(); return; } } catch(e) {}
  }
}

function search(){
  const f = new FormData(document.getElementById('f'));
  const qStr = (f.get('q')||'').trim();
  if (!qStr) { document.getElementById('out').innerHTML=''; return; }

  const queries = qStr.split(',').map(s => s.trim().toLowerCase()).filter(s => s.length);
  if (!queries.length) return;

  const results = MOVIES.filter(m => {
      const actors = m.actors || [];
      // 모든 검색어가 출연진 목록에 있어야 함 (AND 조건)
      return queries.every(q => actors.some(a => a.name.toLowerCase().includes(q)));
  });

  // [중복 제거 확실하게]
  const unique = [];
  const seen = new Set();
  results.forEach(m => { 
      if(!seen.has(m.movieCd)) { 
          seen.add(m.movieCd); 
          unique.push(m); 
      } 
  });
  
  unique.sort((a,b) => (b.openDt||'').localeCompare(a.openDt||''));

  document.getElementById('total').textContent = `총 ${unique.length}편 검색됨`;
  const ul = document.getElementById('out');
  ul.innerHTML = '';
  const filmsWithAudi = [];

  for (const m of unique) {
    const audiNum = safeParseInt(m.audiAcc);
    const audiStr = audiNum ? ` / <span class="audi">누적 ${fmtNum(audiNum)}명</span>` : '';
    
    let castHtml = "";
    if (m.actors) {
        const links = m.actors.slice(0, 10).map(a => {
            const isMatch = queries.some(q => a.name.toLowerCase().includes(q));
            
            // 링크 생성 로직 (ID 있으면 사용, 없으면 name: 사용)
            const id = (a.id && a.id.trim()) ? a.id : `name:${a.name}`;
            const href = `person.html?id=${encodeURIComponent(id)}&name=${encodeURIComponent(a.name)}`;
            
            const nameHtml = isMatch ? `<span class="highlight">${a.name}</span>` : a.name;
            return `<a href="${href}" style="text-decoration:none;color:#555;">${nameHtml}</a>`;
        });
        castHtml = ` · 배우: ${links.join(', ')}`;
    }

    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}" style="font-weight:bold;color:#000;">${m.movieNm}</a>
      <span class="note">(${m.openDt||'미상'}${audiStr})</span><div class="cast-list" style="margin-top:4px;">${castHtml}</div>`;
    ul.appendChild(li);
    
    if (m.openDt && audiNum > 0) filmsWithAudi.push({ ...m, audiAcc: audiNum });
  }

  // 차트 렌더링
  const container = document.getElementById('chart-container');
  if (filmsWithAudi.length > 0) {
      container.style.display = 'block';
      // 차트용 정렬 (과거->최신)
      const chartData = [...filmsWithAudi].sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));
      drawChart(chartData);
  } else {
      container.style.display = 'none';
  }
}

function drawChart(films){
    const ctx = document.getElementById('audiChart');
    if (!ctx) return;

    if (myChart) myChart.destroy();
    
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: films.map(f => f.openDt.slice(0,7)), // YYYY-MM
            datasets: [{ 
                label: '관객수', 
                data: films.map(f => f.audiAcc), 
                borderColor: 'rgba(75, 192, 192, 1)', 
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                fill: true,
                tension: 0.1
            }]
        },
        options: { 
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(ctx) { return ` ${fmtNum(ctx.raw)}명`; }
                    }
                }
            }
        }
    });
}

(async function main(){
  await loadIndex();
  document.getElementById('f').addEventListener('submit', (e)=>{ e.preventDefault(); search(); });
})();
</script>
</body>
</html>
