<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="costarSearchTitle">공동 출연 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; display:flex; gap:8px; flex-wrap:wrap; }
.box input { flex:1; padding:6px; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.audi { font-size: 14px; color: #333; font-weight: bold; }
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.cast-list a { color: #555; text-decoration: none; }
.cast-list a:hover { text-decoration: underline; color: #000; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="costarSearchTitle">공동 출연 검색</h1>

  <form id="f" class="box">
    <span data-i18n-key="actorNamesLabel">배우 이름들:</span>
    <input type="text" name="q" placeholder="예: 이병헌, 류승룡 (쉼표로 구분)" value="">
    <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
  </form>

  <div id="msg" class="note" style="margin-top:10px;"></div>
  <ul id="out" class="list"></ul>

  <div id="chart-container" style="display:none; margin-top: 40px;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div style="position: relative; height:300px; width:100%">
        <canvas id="audiChart"></canvas>
    </div>
  </div>
</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`]; 

let MOVIES = [];
let PEOPLE_MAP = {}; // Name -> {id, filmoCount}
let myChart = null;

const safeParseInt = (v) => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// 인덱스 로드
async function loadIndex(){
  for (const p of PATHS_INDEX) {
      try { const r = await fetch(p); if(r.ok) {
          MOVIES = await r.json();
          buildPeopleMap();
          return;
      }} catch(e){}
  }
}

// 이름 검색을 위한 맵 생성
function buildPeopleMap() {
    MOVIES.forEach(m => {
        const list = [...(m.actors||[]), ...(m.directors||[])];
        list.forEach(p => {
            const id = (p.id && p.id.trim()) ? p.id : `name:${p.name}`;
            if (!PEOPLE_MAP[p.name]) PEOPLE_MAP[p.name] = [];
            
            // 중복 방지 (같은 ID가 이미 있으면 skip)
            if (!PEOPLE_MAP[p.name].some(x => x.id === id)) {
                PEOPLE_MAP[p.name].push({ id: id, count: 0 });
            }
            // 출연 횟수 증가 (유명도 판별용)
            const entry = PEOPLE_MAP[p.name].find(x => x.id === id);
            entry.count++;
        });
    });
    // 출연작 많은 순 정렬
    for (const k in PEOPLE_MAP) {
        PEOPLE_MAP[k].sort((a,b) => b.count - a.count);
    }
}

// [핵심] 특정 배우의 상세 파일(people/XXXX.json)을 가져와 관객수 정보 확보
async function fetchPersonFilmos(id) {
    if (!id || id.startsWith('name:')) return null;
    const fname = `${id}.json?v=${TS}`;
    for (const prefix of PATHS_DETAILS) {
        try { 
            const r = await fetch(prefix + fname); 
            if(r.ok) {
                const data = await r.json();
                const info = (data.peopleInfoResult && data.peopleInfoResult.peopleInfo) ? data.peopleInfoResult.peopleInfo : data;
                return info.filmos || []; // 관객수가 들어있는 필모 리스트 반환
            }
        } catch(e){}
    }
    return null;
}

async function search(){
  const f = new FormData(document.getElementById('f'));
  const qRaw = f.get('q');
  if (!qRaw) return;

  const names = qRaw.split(',').map(s => s.trim()).filter(s => s);
  if (names.length < 2) {
      document.getElementById('msg').textContent = "두 명 이상의 배우 이름을 입력해주세요.";
      return;
  }

  if (MOVIES.length === 0) await loadIndex();

  // 1. 이름 -> ID 변환
  const targetIds = [];
  const displayNames = [];
  
  for (const name of names) {
      const candidates = PEOPLE_MAP[name];
      if (!candidates || candidates.length === 0) {
          document.getElementById('msg').textContent = `'${name}' 배우를 찾을 수 없습니다.`;
          return;
      }
      // 가장 유명한(출연작 많은) 배우 자동 선택
      targetIds.push(candidates[0].id);
      displayNames.push(name);
  }

  // 2. 교집합 영화 찾기
  let commonMovies = MOVIES.filter(m => {
      const cast = [...(m.actors||[]), ...(m.directors||[])];
      // 모든 타겟 ID가 cast 목록에 있어야 함
      return targetIds.every(tid => {
          if (tid.startsWith('name:')) {
              const tName = tid.replace('name:', '');
              return cast.some(c => c.name === tName);
          } else {
              return cast.some(c => c.id === tid);
          }
      });
  });

  // [핵심 Patch] 첫 번째 배우의 상세 정보를 가져와서 관객수 데이터를 보정
  // (search_index에는 없지만 person.json에는 있는 최신 관객수를 덮어씌움)
  const firstRealId = targetIds.find(id => !id.startsWith('name:'));
  if (firstRealId) {
      const detailedFilmos = await fetchPersonFilmos(firstRealId);
      if (detailedFilmos) {
          commonMovies = commonMovies.map(m => {
              const match = detailedFilmos.find(df => df.movieCd === m.movieCd);
              if (match && match.audiAcc) {
                  // 관객수 업데이트!
                  return { ...m, audiAcc: match.audiAcc };
              }
              return m;
          });
      }
  }

  // 개봉일 순 정렬
  commonMovies.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));

  // 3. 렌더링
  const out = document.getElementById('out');
  out.innerHTML = '';
  document.getElementById('msg').textContent = `총 ${commonMovies.length}편 검색됨`;

  const validMovies = []; // 차트용

  for (const m of commonMovies) {
      const audiNum = safeParseInt(m.audiAcc);
      const audiStr = audiNum ? ` / <span class="audi">누적 ${fmtNum(audiNum)}명</span>` : '';

      let castStr = "";
      if (m.actors) {
          const d = m.actors.slice(0, 10).map(a => {
            const isTarget = names.includes(a.name); // 검색된 배우 강조
            const style = isTarget ? 'font-weight:bold; color:#000;' : '';
            
            // 링크 생성
            const pid = (a.id && a.id.trim()) ? a.id : `name:${a.name}`;
            const href = `person.html?id=${encodeURIComponent(pid)}&name=${encodeURIComponent(a.name)}`;
            
            // 성별 뱃지
            let badge = "";
            if(a.gender === "남자" || a.gender === "남") badge = " <span style='color:blue;font-size:0.8em'>(남)</span>";
            else if(a.gender === "여자" || a.gender === "여") badge = " <span style='color:red;font-size:0.8em'>(여)</span>";
            
            return `<a href="${href}" target="_blank" style="${style}">${a.name}</a>${badge}`;
          });
          castStr = ` · 배우: ${d.join(', ')}`;
      }

      const li = document.createElement('li');
      li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}"><strong>${m.movieNm}</strong></a> 
          <span class="note">(${m.openDt}${audiStr})</span><br>
          <span class="cast-list">${castStr}</span>`;
      out.appendChild(li);

      if (m.openDt) validMovies.push({ ...m, audiAcc: audiNum });
  }

  // 4. 차트 그리기
  drawChart(validMovies);
}

function drawChart(movies) {
    const ctx = document.getElementById('audiChart');
    const container = document.getElementById('chart-container');
    
    if (movies.length === 0) {
        container.style.display = 'none';
        return;
    }
    container.style.display = 'block';

    if (myChart) myChart.destroy();

    // 날짜 오름차순 정렬
    const sorted = [...movies].sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));

    const labels = sorted.map(m => m.openDt);
    const data = sorted.map(m => safeParseInt(m.audiAcc));

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '관객수',
                data: data,
                borderColor: 'var(--accent, #009688)',
                backgroundColor: 'rgba(0, 150, 136, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 5,
                pointHoverRadius: 7
            }]
        },
        options: {
            maintainAspectRatio: false,
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        // [핵심 요청사항 반영] 툴팁 제목을 '날짜'가 아닌 '영화 제목'으로 변경
                        title: (tooltipItems) => {
                            const index = tooltipItems[0].dataIndex;
                            return sorted[index].movieNm; 
                        },
                        label: (context) => {
                             return ` 개봉: ${context.label} / 관객수: ${fmtNum(context.raw)}명`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { callback: v => v.toLocaleString() }
                }
            }
        }
    });
}

(async function main(){
    await loadIndex();
    document.getElementById('f').addEventListener('submit', (e)=>{ e.preventDefault(); search(); });
    
    // URL 파라미터 자동 검색
    const q = new URLSearchParams(location.search).get('q');
    if(q) {
        document.querySelector('input[name=q]').value = q;
        search();
    }
})();
</script>
</body>
</html>
