<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="costarSearchTitle">공동 출연 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
.audi { font-size: 14px; color: #333; }
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.highlight { font-weight: bold; background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="costarSearchTitle">공동 출연 검색</h1>

  <form id="f" class="box">
    <!-- [수정] 여러 명을 입력할 수 있는 단일 입력창으로 복구 -->
    <div style="display:flex; gap:8px; align-items:center;">
        <span data-i18n-key="actorNames">배우 이름들:</span>
        <input type="text" name="q" placeholder="예: 황정민, 정우성 (쉼표로 구분)" style="flex:1;">
        <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
    </div>
  </form>

  <div id="total" class="note" style="margin-top:8px;"></div>
  <ul id="out" class="list"></ul>
</div>

<script>
const BASE = location.pathname.replace(/\/[^\/]*$/, '');
const INDEX_URL = `docs/data/search_index.json?v=${Date.now()}`;
let MOVIES = [];

const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

async function loadIndex(){
  try {
    let r = await fetch(INDEX_URL);
    if(!r.ok) {
        r = await fetch(`data/search_index.json?v=${Date.now()}`); // fallback
    }
    if(!r.ok) throw new Error('Failed to load index');
    
    MOVIES = await r.json();
    document.getElementById('total').textContent = '데이터 로드 완료. 배우 이름들을 입력하세요.';
  } catch(e) {
    console.error(e);
    document.getElementById('total').textContent = '데이터를 불러오는 데 실패했습니다.';
  }
}

function search(){
  const f = new FormData(document.getElementById('f'));
  const qStr = (f.get('q')||'').trim();

  if (!qStr) {
      document.getElementById('out').innerHTML = '';
      document.getElementById('total').textContent = '배우 이름을 입력해주세요.';
      return;
  }

  // [로직] 쉼표(,)로 구분하여 여러 배우 이름 추출
  const queries = qStr.split(',').map(s => s.trim().toLowerCase()).filter(s => s.length > 0);

  if (queries.length === 0) return;

  // 모든 쿼리(배우 이름)가 포함된 영화 찾기 (AND 조건)
  const results = MOVIES.filter(m => {
      const actors = m.actors || [];
      // 모든 검색어가 해당 영화의 배우 목록에 하나라도 걸리는지 확인
      return queries.every(query => {
          return actors.some(a => a.name.toLowerCase().includes(query));
      });
  });

  results.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));

  document.getElementById('total').textContent = `총 ${results.length}편의 공동 출연작이 검색되었습니다.`;
  const ul = document.getElementById('out');
  ul.innerHTML = '';
  
  if (results.length === 0) {
      ul.innerHTML = '<li style="text-align:center; color:#888;">검색 결과가 없습니다.</li>';
      return;
  }

  for (const m of results) {
    const date = m.openDt ? m.openDt.replace(/-/g, '.') : '개봉일미상';
    const audiStr = (m.audiAcc != null) ? ` / <span class="audi">누적 ${fmtNum(m.audiAcc)}명</span>` : '';
    
    let castHtml = "";
    if (m.actors && Array.isArray(m.actors)) {
        // [수정] 검색된 배우들 하이라이트 처리 및 링크 생성
        const actorLinks = m.actors.slice(0, 10).map(a => {
            // 현재 배우가 검색어 중 하나라도 포함하는지 확인
            const isMatch = queries.some(q => a.name.toLowerCase().includes(q));
            
            // ID 처리: ID가 있으면 그대로, 없으면 name: 접두사
            const idParam = (a.id && a.id.trim()) ? a.id : `name:${a.name}`;
            const href = `person.html?id=${encodeURIComponent(idParam)}&name=${encodeURIComponent(a.name)}`;
            
            const nameHtml = isMatch ? `<span class="highlight">${a.name}</span>` : a.name;
            return `<a href="${href}" style="text-decoration:none; color:#555; hover:text-decoration:underline;">${nameHtml}</a>`;
        });
        
        castHtml = ` · 배우: ${actorLinks.join(', ')}${m.actors.length > 10 ? '...' : ''}`;
    }

    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}" style="font-weight:bold; color:#000;">${m.movieNm}</a>
      <span class="note">(${date}${audiStr})</span><div class="cast-list" style="margin-top:4px;">${castHtml}</div>`;
    ul.appendChild(li);
  }
}

(async function main(){
  await loadIndex();
  const f = document.getElementById('f');
  f.addEventListener('submit', (e)=>{ e.preventDefault(); search(); });
})();
</script>
</body>
</html>
