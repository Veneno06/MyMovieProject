<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="costarSearchTitle">공동 출연 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
    .wrap { max-width:980px; margin:24px auto; padding:0 12px; }
    h1 { font-size:28px; margin:0 0 16px; }
    h2 { font-size:20px; margin:24px 0 8px; }
    .ctrls { display:flex; gap:8px; margin-bottom:12px; }
    .ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
    .note { color:#6b7280; }
    ul.list { list-style:none; padding:0; margin:12px 0; }
    li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
    .audi { font-size: 14px; color: #333; }
    .cast-list { font-size: 13px; color: #555; margin-left: 4px; }
    /* 볼드체 강조 스타일 */
    .cast-list b { color: #000; font-weight: 700; background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
    /* [신규] 배우 링크 스타일 */
    .cast-link { text-decoration: none; color: inherit; cursor: pointer; }
    .cast-link:hover { text-decoration: underline; color: #0056b3; }

    .chart-buttons { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .chart-buttons button { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#f0f0f0; cursor:pointer; font-size:14px; }
    .chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
    .box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
    
    /* 추천 목록 스타일 */
    #recommend-box { margin: 10px 0; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 8px; display: none; }
    .rec-title { font-size: 13px; color: #666; margin-bottom: 6px; font-weight: bold; }
    .recommend-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
    .rec-btn { 
        padding: 4px 10px; border: 1px solid #dce7f5; border-radius: 20px; 
        background: #f0f7ff; color: #333; cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .rec-btn:hover { background: #dbeafe; border-color: #2563eb; color: #2563eb; }
    .rec-btn b { color: #2563eb; margin-left: 4px; font-size: 0.9em; }
    
    /* 입력창 스타일 */
    .search-box-container { display: flex; gap: 8px; flex-wrap: wrap; }
    .search-input-wrapper { flex-grow: 1; }
    #actorsInput { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="costarSearchTitle">공동 출연 검색</h1>

  <form id="f" class="box">
    <div class="search-box-container">
        <div class="search-input-wrapper">
            <span data-i18n-key="actorLabel" style="font-weight:bold; display:block; margin-bottom:4px;">배우 입력 (쉼표로 구분):</span>
            <input type="text" id="actorsInput" value="" placeholder="예: 김윤석, 유해진" autocomplete="off">
        </div>
        <div style="align-self: flex-end;">
            <button type="submit" class="btn" data-i18n-key="searchBtn" style="height: 38px;">검색</button>
        </div>
    </div>
    
    <!-- 추천 배우 목록 영역 -->
    <div id="recommend-box">
        <div class="rec-title"><span id="rec-msg"></span> (2편 이상 공동 출연)</div>
        <div id="rec-list" class="recommend-list"></div>
    </div>
  </form>

  <h2 id="resultTitle" style="display:none;"></h2>
  <ul id="out" class="list"></ul>
  <div id="msg" class="note">검색할 배우들의 이름을 쉼표(,)로 구분하여 입력하세요. (예: 김윤석, 유해진)</div>

  <div id="chart-container" style="display:none;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div class="chart-buttons">
        <button id="btnTotalAudi" class="active" data-i18n-key="audiCnt">관객수</button>
        <button id="btnAudiPerActor" data-i18n-key="audiPerActor">관객수/배우 수</button>
        <!-- [수정] 나머지 버튼들 제거 -->
    </div>
    <canvas id="audiChart"></canvas>
    <div class="note" style="font-size:12px; text-align: right; margin-top: 4px;">* 점에 마우스를 가까이하면 나타나는 텍스트는 영화 제목입니다.</div>
  </div>
</div>
<script>
const TS = Date.now();
const PEOPLE_URL = `data/search/people.json?v=${TS}`;
const MOVIES_URL = `data/search/movies.json?v=${TS}`; 

let PEOPLE = [];
let MOVIES_DB = {}; 
let myChart = null;
const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

const out = document.getElementById('out');
const msg = document.getElementById('msg');
const resultTitle = document.getElementById('resultTitle');
const chartContainer = document.getElementById('chart-container');
let currentCommonFilms = []; 
let currentTargetActors = []; 

async function loadIndex(){
  try {
    const [peopleRes, moviesRes] = await Promise.all([
      fetch(PEOPLE_URL),
      fetch(MOVIES_URL)
    ]);

    if(peopleRes.ok){ 
        const j = await peopleRes.json();
        PEOPLE = j.people || [];
    }
    if(moviesRes.ok){
        const mData = await moviesRes.json();
        (mData.movies || []).forEach(m => {
            MOVIES_DB[m.movieCd] = m;
        });
    }
  } catch(e) {
    PEOPLE = [];
    msg.textContent = '데이터를 불러오는 데 실패했습니다.';
  }
}

function suggestCoStars() {
    // (추천 로직은 기존 코드 유지, 입력창 ID 변경에 맞춰 수정)
    // 현재는 다중 입력(쉼표 구분)으로 변경되었으므로, 
    // 마지막 입력된 배우 이름을 기준으로 추천하는 것이 자연스러울 수 있으나,
    // 복잡도를 피하기 위해 여기서는 첫 번째 배우 기준 추천 또는 생략할 수 있습니다.
    // 기존 로직(actorA 기준)은 다중 입력창 구조와 맞지 않아 잠시 비활성화하거나
    // 필요하다면 '마지막 입력값' 기준으로 수정해야 합니다.
    // 여기서는 일단 기존 단일 입력창 기준 로직은 제거하고,
    // 사용자가 쉼표로 입력하는 방식에 집중합니다.
}

function searchCoStars() {
  const inputVal = document.getElementById('actorsInput').value.trim();
  
  out.innerHTML = '';
  chartContainer.style.display = 'none';
  if (myChart) myChart.destroy();
  currentCommonFilms = []; 
  currentTargetActors = [];

  if (!inputVal) {
    msg.textContent = '배우 이름을 입력해주세요.';
    resultTitle.style.display = 'none';
    return;
  }

  const actorNames = inputVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
  
  currentTargetActors = actorNames; 

  const actorFilmsSets = [];
  const notFoundActors = [];

  for (const name of actorNames) {
      const films = new Set();
      const persons = PEOPLE.filter(p => p.peopleNm === name);
      
      if (persons.length === 0) {
          notFoundActors.push(name);
          continue;
      }

      persons.forEach(p => {
          (p.films || []).forEach(f => films.add(f.movieCd));
      });
      actorFilmsSets.push(films);
  }

  if (notFoundActors.length > 0) {
      msg.textContent = `다음 배우를 찾을 수 없습니다: ${notFoundActors.join(', ')}`;
      resultTitle.style.display = 'none';
      return;
  }
  
  if (actorFilmsSets.length === 0) {
       msg.textContent = '검색된 배우가 없습니다.';
       return;
  }

  let commonMovieCds = new Set([...actorFilmsSets[0]]);

  for (let i = 1; i < actorFilmsSets.length; i++) {
      const currentSet = actorFilmsSets[i];
      commonMovieCds = new Set(
          [...commonMovieCds].filter(cd => currentSet.has(cd))
      );
  }

  const commonFilms = [];
  commonMovieCds.forEach(cd => {
      const movie = MOVIES_DB[cd];
      if (movie) {
          commonFilms.push(movie);
      }
  });

  currentCommonFilms = commonFilms;
  renderResults(commonFilms, actorNames);
}

function renderResults(films, actorNames) {
  const namesStr = actorNames.map(n => `'${n}'`).join(' & ');
  resultTitle.textContent = `${namesStr} 공동 출연작 (${films.length}편)`;
  resultTitle.style.display = 'block';

  if (films.length === 0) {
    msg.textContent = '해당 배우들이 함께 출연한 영화가 없습니다.';
    return;
  }
  msg.textContent = ''; 
  
  films.sort((a,b) => (b.openDt || '0').localeCompare(a.openDt || '0'));

  for (const f of films) {
    const date = f.openDt ? f.openDt.replace(/-/g, '.') : '개봉일미상';
    const audiStr = (f.audiAcc != null) ? ` / <span class="audi">누적 ${fmtNum(f.audiAcc)}명</span>` : '';
    
    let castStr = "";
    if (f.cast && Array.isArray(f.cast) && f.cast.length > 0) {
        const actors = f.cast;
        const displayActors = actors.slice(0, 10); 
        
        // [수정] 배우 이름 클릭 시 링크 생성 및 볼드체 처리
        const formattedActors = displayActors.map(name => {
            let displayName = name;
            // 검색어 포함 시 볼드 처리
            if (actorNames.includes(name)) {
                displayName = `<b>${name}</b>`;
            }
            // 링크 생성 (people-search.html로 이동)
            return `<a href="people-search.html?q=${encodeURIComponent(name)}" class="cast-link">${displayName}</a>`;
        });
        
        castStr = ` · 배우: ${formattedActors.join(', ')}${actors.length > 10 ? '...' : ''}`;
    }
    
    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}">${f.movieNm}</a>
      <span class="note">(${date}${f.part? ' · '+f.part:''}${audiStr}<span class="cast-list">${castStr}</span>)</span>`;
    out.appendChild(li);
  }

  const filmsWithData = films.filter(f => f.openDt && f.audiAcc != null);
  if (filmsWithData.length > 1) {
    chartContainer.style.display = 'block';
    drawAudiChart(filmsWithData, 'totalAudi'); 
  }
}

function drawAudiChart(films, dataType = 'totalAudi'){
    if (myChart) {
        myChart.destroy();
    }

    films.sort((a,b) => (a.openDt || '').localeCompare(b.openDt || ''));

    const firstYear = (films.length > 0 && films[0].openDt) ? parseInt(films[0].openDt.slice(0, 4), 10) : new Date().getFullYear();

    const labels = films.map(f => f.openDt ? f.openDt.slice(0,7) : '미상');
    let dataPoints;
    
    const lang = window.getCurrentLang ? window.getCurrentLang() : 'ko';
    const s = (window.STRINGS && window.STRINGS[lang]) ? window.STRINGS[lang] : STRINGS['ko']; 
    let yAxisLabel;

    // [수정] 불필요한 그래프 옵션 제거
    if (dataType === 'audiPerActor') {
        dataPoints = films.map(f => (f.audiAcc && f.actorCount > 0) ? Math.round(f.audiAcc / f.actorCount) : 0);
        yAxisLabel = s.audiPerActor;
    } else { // 기본값: totalAudi
        dataPoints = films.map(f => f.audiAcc || 0);
        yAxisLabel = s.audiCnt;
    }
    
    const movieTitles = films.map(f => f.movieNm);

    const ctx = document.getElementById('audiChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '값',
                data: dataPoints,
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                fill: true,
                tension: 0.1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString(); }
                    },
                    title: {
                        display: true,
                        text: yAxisLabel 
                    }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: function(tooltipItems) { return movieTitles[tooltipItems[0].dataIndex]; },
                        label: function(context) {
                            let label = yAxisLabel.split(' (')[0] || '';
                            if (label) { label += ': '; }
                            if (context.parsed.y !== null) { label += context.parsed.y.toLocaleString() + (lang === 'ko' ? '명' : ''); }
                            return label;
                        }
                    }
                }
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadIndex(); 
  
  const form = document.getElementById('f');
  // 추천 기능 관련 이벤트는 다중 입력창 변경으로 인해 일단 제거하거나 보류
  
  if (form) {
      form.addEventListener('submit', (e) => {
          e.preventDefault();
          searchCoStars(); 
      });
  }

  // [수정] 버튼 목록 간소화
  const buttons = [
      { id: 'btnTotalAudi', type: 'totalAudi' },
      { id: 'btnAudiPerActor', type: 'audiPerActor' }
  ];

  buttons.forEach(btnInfo => {
      const button = document.getElementById(btnInfo.id);
      if (button) {
          button.addEventListener('click', () => {
              if (currentCommonFilms.length > 0) {
                  const filmsWithData = currentCommonFilms.filter(f => f.openDt && f.audiAcc != null);
                  drawAudiChart(filmsWithData, btnInfo.type);
              }
              document.querySelectorAll('.chart-buttons button').forEach(b => b.classList.remove('active'));
              button.classList.add('active');
          });
      }
  });
});
</script>
</body>
</html>
