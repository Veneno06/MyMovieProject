<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title data-i18n-key="homeTitle">K-Movie Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/translator.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .link-banner {
        display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        margin-top: 40px; padding: 20px; background: #f9fafb;
        border-radius: 8px; border: 1px solid #e5e7eb;
    }
    .link-banner a {
        padding: 10px 20px; text-decoration: none; color: #374151; font-weight: bold;
        background: #fff; border: 1px solid #d1d5db; border-radius: 6px;
        transition: all 0.2s ease; font-size: 14px;
    }
    .link-banner a:hover {
        background: #111827; color: #fff; border-color: #111827;
    }
    .stat-overview {
        background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb;
        margin-top: 40px; text-align: center;
    }
    .stat-overview h3 { color: #111827; margin-bottom: 10px; }
    .stat-overview p { font-size: 15px; color: #4b5563; margin: 5px 0; }
    .stat-overview span { font-weight: bold; color: #2563eb; }
    
    .main-charts-container {
        display: flex; flex-direction: column; gap: 40px; margin-top: 20px;
    }
    .main-chart-box {
        width: 100%; padding: 15px; background: #fff; 
        border: 1px solid #e5e7eb; border-radius: 8px;
    }
    .main-chart-box h4 { text-align: center; margin-top: 0; color: #374151; }
    .total-count-label { text-align: center; font-size: 13.5px; color: #4b5563; margin-top: 15px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  
  <h1 data-i18n-key="homeTitle">K-Movie A Archive</h1>

  <div class="ctrls">
    <a href="index.html" class="btn active" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <div class="pill" id="rangePill" style="display: none;">데이터 범위: 로딩 중…</div>

  <h2 style="margin:20px 0 8px;" data-i18n-key="monthlyTimeline">월간 타임라인</h2>
  <div class="monthbar">
    <button class="btn" id="prevM" data-i18n-key="prevMonth">◀ 이전 달</button>
    <div id="ymLabel" style="font-weight:700; font-size: 1.1em;"></div>
    <button class="btn" id="nextM" data-i18n-key="nextMonth">다음 달 ▶</button>
  </div>

  <div class="tl-bar" id="tlBar"></div>
  <div class="tl-panel" id="panel" data-i18n-key="panelDefault">날짜를 선택하면 해당 날짜의 개봉작을 보여줍니다.</div>
  
  <div id="boxoffice-container"></div>

  <div style="margin: 60px 0;"></div>

  <!-- 4. 아카이브 전체 통계 및 차트 영역 -->
  <div id="archive-stats" style="display: none;">
      <div class="stat-overview">
          <h3>영화 통합 데이터 통계</h3>
          <p>등록된 전체 영화 수: <span id="idxTotalMovies">0</span>편</p>
          <p>국내 영화 수: <span id="idxDomMovies">0</span>편 / 국외 영화 수: <span id="idxForMovies">0</span>편</p>
          <p>누적 총 관객 수 (~현재): <span id="idxTotalAudi">0</span>명</p>
      </div>

      <div class="main-charts-container">
          <div class="main-chart-box">
              <h4>연도별 영화 개봉 편수</h4>
              <div style="position: relative; height: 350px; width: 100%;">
                  <canvas id="chartMovieCount"></canvas>
              </div>
              <!-- 연평균 개봉 편수 표시 -->
              <div class="total-count-label" id="labelAvgMovies"></div>
          </div>
          <div class="main-chart-box">
              <h4>연도별 누적 관객수 (단위: 천 명)</h4>
              <div style="position: relative; height: 350px; width: 100%;">
                  <canvas id="chartAudience"></canvas>
              </div>
              <!-- 연평균 관객수 표시 -->
              <div class="total-count-label" id="labelAvgAudi"></div>
          </div>
      </div>
  </div>

  <div class="link-banner">
      <a href="https://cgv.co.kr/" target="_blank">🎬 CGV 바로가기</a>
      <a href="https://www.megabox.co.kr/" target="_blank">🍿 메가박스 바로가기</a>
      <a href="https://www.kofic.or.kr/" target="_blank">🏛️ KOFIC 바로가기</a>
  </div>

</div>

<script>
// --- 기존 타임라인 및 박스오피스 기능 유지 ---
const MOVIE_INDEX_URL = 'data/search_index.json';

const isYmd8 = (s) => /^\d{8}$/.test(String(s||'').trim());
function ymParts(ym){ return [ym.getFullYear(), ym.getMonth()+1]; }
function pad2(n){ return String(n).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }

let MOVIES = [];
let YM = new Date();

function pickValidMovies(arr){
  return arr.map(m => {
    m.openDt_normalized = (m.openDt || '').replace(/-/g, '');
    return m;
  }).filter(m => isYmd8(m.openDt_normalized));
}

function computeRange(arr){
  if (!arr.length) return null;
  let minY = 9999, maxY = 0;
  for (const m of arr){
    const y = parseInt(m.openDt_normalized.slice(0,4),10);
    if (isFinite(y)){
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  if (minY===9999 || maxY===0) return null;
  return {min:minY, max:maxY};
}

function groupByDay(arr, y, m){ 
  const map = {};
  for (let d=1; d<=daysInMonth(y,m); d++) map[d]=[];
  for (const row of arr){
    const dt = row.openDt_normalized;
    if (!isYmd8(dt)) continue;
    const yy = +dt.slice(0,4);
    const mm = +dt.slice(4,6);
    const dd = +dt.slice(6,8);
    if (yy===y && mm===m && map[dd]) map[dd].push(row);
  }
  return map;
}

function renderMonth(){
  const [y, m] = ymParts(YM);
  document.getElementById('ymLabel').textContent = `${y}년 ${pad2(m)}월`;

  const byDay = groupByDay(MOVIES, y, m);
  const bar = document.getElementById('tlBar');
  bar.innerHTML = '';

  const last = daysInMonth(y, m);
  for (let d=1; d<=last; d++){
    const btn = document.createElement('div');
    btn.className = 'tl-day' + (byDay[d].length ? ' hasMovies' : '');
    btn.textContent = d;
    btn.title = byDay[d].length ? `${byDay[d].length}편` : '개봉작 없음';
    btn.onclick = (e)=> {
        const currentSelected = bar.querySelector('.selected');
        if (currentSelected) currentSelected.classList.remove('selected');
        e.currentTarget.classList.add('selected');
        renderPanel(y,m,d, byDay[d]);
    };
    bar.appendChild(btn);
  }

  const today = new Date();
  if (today.getFullYear()===y && (today.getMonth()+1)===m){
     const todayBtn = bar.children[today.getDate()-1];
     if(todayBtn) todayBtn.click(); 
  } else {
     document.getElementById('panel').innerHTML = '<div class="muted">날짜를 선택하면 해당 날짜의 개봉작을 보여줍니다.</div>';
  }
}

function renderPanel(y,m,d, list){
  const box = document.getElementById('panel');
  const ymd = `${y}-${pad2(m)}-${pad2(d)}`;
  if (!list || list.length===0){
    box.innerHTML = `<div class="muted">해당 날짜(${ymd})에는 등록된 개봉작이 없습니다.</div>`;
    return;
  }
  const rows = list.sort((a,b)=> (a.movieNm || '').localeCompare(b.movieNm||'', 'ko')).map(row=>{
      const badge = row.grade ? `[${row.grade}]` : '';
      const rn = row.nation || '';
      const gens = Array.isArray(row.genres) ? row.genres.join(', ') : '';
      return `<div class="row">
        <a href="detail.html?movieCd=${encodeURIComponent(row.movieCd)}">${row.movieNm||'(제목없음)'}</a>
        <div class="muted">${badge} ${rn} ${gens ? '· '+gens : ''}</div>
      </div>`;
    }).join('');
  box.innerHTML = `<div class="note" style="font-weight:bold; margin-bottom:10px;">${ymd} 개봉작 ${list.length}편</div><div class="list">${rows}</div>`;
}

async function mainTimeline(){
  const res = await fetch(`${MOVIE_INDEX_URL}?v=${Date.now()}`);
  if (!res.ok) return;
  const js = await res.json();
  MOVIES = pickValidMovies(js);
  const rg = computeRange(MOVIES);
  
  if (MOVIES.length > 0) {
    const latestDateStr = MOVIES.reduce((max, m) => (m.openDt_normalized > max ? m.openDt_normalized : max), '0');
    const year = parseInt(latestDateStr.slice(0, 4), 10);
    const month = parseInt(latestDateStr.slice(4, 6), 10) - 1;  
    if (!isNaN(year) && !isNaN(month)) YM = new Date(year, month);
  }

  renderMonth();
  document.getElementById('prevM').onclick = ()=>{ YM.setMonth(YM.getMonth()-1); renderMonth(); };
  document.getElementById('nextM').onclick = ()=>{ YM.setMonth(YM.getMonth()+1); renderMonth(); };
}

async function mainBoxoffice() {
  const container = document.getElementById('boxoffice-container');
  try {
    const ts = Date.now();
    const metaResp = await fetch(`./data/latest.json?v=${ts}`);
    if (!metaResp.ok) return;
    const meta = await metaResp.json();
    const dataResp = await fetch(`${meta.url}?v=${ts}`);
    if (!dataResp.ok) return;
    const data = await dataResp.json();

    const list = data?.boxOfficeResult?.dailyBoxOfficeList;
    if (Array.isArray(list) && list.length > 0) {
      let html = `<h2 data-i18n-key="latestBoxOffice" style="margin-bottom:8px; margin-top:50px; padding-top:30px; border-top:2px dashed #e5e7eb;">최신 일일 박스오피스 TOP ${Math.min(10, list.length)}</h2>`;
      html += `<div class="note" style="margin-bottom:15px;">기준일: ${meta.date}</div>`;
      html += '<ol style="margin:0; padding-left:20px; line-height: 1.8;">';
      list.slice(0, 10).forEach(item => {
        html += `<li style="padding-left: 5px;">
                    <a href="detail.html?movieCd=${item.movieCd}" style="text-decoration:none; color:#333; font-weight:bold;">${item.movieNm}</a> 
                    <span style="color:#666; font-size:0.9em; margin-left:5px;">(일일 관객수: ${Number(item.audiCnt).toLocaleString()}명 / 총 관객수: ${Number(item.audiAcc).toLocaleString()}명)</span>
                 </li>`;
      });
      html += '</ol>';
      container.innerHTML = html;
    }
  } catch (err) {}
}

// 🌟 아카이브 전체 통계 렌더링 (2003년 이후, 연평균 통계 포함)
async function renderArchiveStats() {
    try {
        const res = await fetch(`data/db_summary.json?v=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        
        document.getElementById('archive-stats').style.display = 'block';
        
        // 텍스트 통계
        const stats = data.db_stats;
        document.getElementById('idxTotalMovies').textContent = stats.total_movies.toLocaleString();
        document.getElementById('idxDomMovies').textContent = stats.total_dom_movies.toLocaleString();
        document.getElementById('idxForMovies').textContent = stats.total_for_movies.toLocaleString();
        document.getElementById('idxTotalAudi').textContent = stats.cumulative_audience.toLocaleString();
        
        // 🌟 2003년 이후 데이터만 필터링
        const allYears = Object.keys(data.yearly_stats).sort();
        const filteredYears = allYears.filter(y => parseInt(y, 10) >= 2003);
        const yearCount = filteredYears.length;

        const labels = filteredYears;
        const domCount = [], forCount = [];
        const totalAudi = [], domAudi = [], forAudi = [];
        
        // 평균을 구하기 위한 변수 누적
        let sumDomMovies = 0, sumForMovies = 0;
        let sumTotalAudi = 0, sumDomAudi = 0, sumForAudi = 0;

        filteredYears.forEach(y => {
            const yData = data.yearly_stats[y];
            
            domCount.push(yData.dom_movies);
            forCount.push(yData.for_movies);
            sumDomMovies += yData.dom_movies;
            sumForMovies += yData.for_movies;

            const tAudi = yData.dom_audi + yData.for_audi;
            totalAudi.push(Math.floor(tAudi / 1000));
            domAudi.push(Math.floor(yData.dom_audi / 1000));
            forAudi.push(Math.floor(yData.for_audi / 1000));

            sumTotalAudi += tAudi;
            sumDomAudi += yData.dom_audi;
            sumForAudi += yData.for_audi;
        });

        // 평균 계산 (소수점 반올림)
        const avgDomMovies = Math.round(sumDomMovies / yearCount);
        const avgForMovies = Math.round(sumForMovies / yearCount);
        const avgTotalAudi = Math.round(sumTotalAudi / yearCount);
        const avgDomAudi = Math.round(sumDomAudi / yearCount);
        const avgForAudi = Math.round(sumForAudi / yearCount);

        // 하단 텍스트 라벨 적용
        document.getElementById('labelAvgMovies').innerHTML = 
            `* 국내 영화 총 <b>${stats.total_dom_movies.toLocaleString()}</b>편 / 해외 영화 총 <b>${stats.total_for_movies.toLocaleString()}</b>편<br>` +
            `* 연평균 개봉: 국내 <b>${avgDomMovies.toLocaleString()}</b>편 / 해외 <b>${avgForMovies.toLocaleString()}</b>편`;

        document.getElementById('labelAvgAudi').innerHTML = 
            `* 연평균 관객수: 전체 <b>${avgTotalAudi.toLocaleString()}</b>명 / 국내 <b>${avgDomAudi.toLocaleString()}</b>명 / 해외 <b>${avgForAudi.toLocaleString()}</b>명`;

        // 그래프 4-1: 영화 개수
        new Chart(document.getElementById('chartMovieCount').getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '국내 영화', data: domCount, borderColor: '#2563eb', backgroundColor: '#2563eb', tension: 0.1, borderWidth: 2 },
                    { label: '해외 영화', data: forCount, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.1, borderWidth: 2 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    x: { 
                        grid: { display: false },
                        ticks: { autoSkip: false, maxRotation: 45, minRotation: 45 } 
                    }, 
                    y: { beginAtZero: true } 
                }
            }
        });

        // 그래프 4-2: 관객수 (천 명)
        new Chart(document.getElementById('chartAudience').getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '전체 관객수', data: totalAudi, borderColor: '#111827', backgroundColor: '#111827', tension: 0.1, borderWidth: 2 },
                    { label: '국내 영화 관객수', data: domAudi, borderColor: '#2563eb', backgroundColor: '#2563eb', tension: 0.1, borderWidth: 2 },
                    { label: '해외 영화 관객수', data: forAudi, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.1, borderWidth: 2 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (ctx) => ` ${ctx.dataset.label}: ${ctx.raw.toLocaleString()}천 명`
                        }
                    }
                },
                scales: { 
                    x: { 
                        grid: { display: false },
                        ticks: { autoSkip: false, maxRotation: 45, minRotation: 45 } 
                    }, 
                    y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString() } } 
                }
            }
        });

    } catch (e) {}
}

mainTimeline();
mainBoxoffice();
renderArchiveStats();
</script>
</body>
</html>
