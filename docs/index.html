<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
  /* 🌟 배너 스타일 추가 */
  .link-banner { 
      display: flex; justify-content: center; gap: 20px; 
      margin-top: 50px; padding: 20px; background: #f9fafb; 
      border-radius: 12px; border: 1px solid #eee;
  }
  .link-banner a { 
      text-decoration: none; color: #4b5563; font-weight: bold; font-size: 14px;
      padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: #fff;
      transition: all 0.2s;
  }
  .link-banner a:hover { background: #374151; color: #fff; border-color: #374151; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn active">홈</a>
    <a href="title-search.html" class="btn">영화 검색 (제목)</a>
    <a href="search.html" class="btn">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn">배우 검색</a>
    <a href="costar-search.html" class="btn">공동 출연 검색</a>
    <a href="saved.html" class="btn">저장 목록</a>
    <button id="langBtn" class="btn">EN</button>
  </div>

  <h1>최신 일일 박스오피스 TOP 10</h1>
  <div id="boxoffice-date" class="note">데이터 로딩 중...</div>
  <ul id="boxoffice-list" class="list"></ul>

  <div class="link-banner">
      <a href="https://cgv.co.kr/" target="_blank">🎬 CGV 바로가기</a>
      <a href="https://www.megabox.co.kr/" target="_blank">🍿 메가박스 바로가기</a>
      <a href="https://www.kofic.or.kr/" target="_blank">🏛️ KOFIC 바로가기</a>
  </div>
</div>

<script>
const TS = Date.now();
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

async function loadBoxOffice() {
    try {
        const res = await fetch(`docs/data/boxoffice/latest.json?v=${TS}`);
        const data = await res.json();
        const dateStr = data.showRange ? data.showRange.split('~')[0] : "";
        document.getElementById('boxoffice-date').innerText = `기준일: ${dateStr}`;
        
        const list = document.getElementById('boxoffice-list');
        list.innerHTML = '';
        
        data.dailyBoxOfficeList.forEach(m => {
            const li = document.createElement('li');
            // 🌟 [요청 반영] 일일 관객수 및 총 관객수 병기
            li.innerHTML = `
                <strong>${m.rank}.</strong> 
                <a href="detail.html?movieCd=${m.movieCd}"><b>${m.movieNm}</b></a>
                <span class="note" style="margin-left:10px;">
                    (일일 관객수: ${fmtNum(m.audiCnt)} / 총 관객수: ${fmtNum(m.audiAcc)})
                </span>
            `;
            list.appendChild(li);
        });
    } catch(e) {
        document.getElementById('boxoffice-date').innerText = "데이터를 불러올 수 없습니다.";
    }
}
loadBoxOffice();
</script>
</body>
</html>
