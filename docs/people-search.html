<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우/감독 검색 – K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn active" data-i18n-key="peopleSearch">배우/감독 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1>배우/감독 검색</h1>

  <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
      <label>이름: <input type="text" id="keyword" onkeypress="if(event.key==='Enter') doSearch()" style="width:200px;"></label>
      <label style="margin-left:10px;"><input type="checkbox" id="onlyActor" checked> 배우만</label>
      <button class="btn" onclick="doSearch()" style="margin-left:10px;">검색</button>
  </div>

  <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
      <h3 style="margin-top:0; color:#111827; font-size:16px;">📊 데이터베이스 전체 통계</h3>
      <div style="display:flex; gap:20px; font-size:14px; color:#4b5563;">
          <div><b>배우:</b> 국내 <span id="statActorDom" style="font-weight:bold; color:#2563eb;">0</span>명 / 해외 <span id="statActorInt" style="font-weight:bold; color:#ef4444;">0</span>명</div>
          <div><b>감독:</b> 국내 <span id="statDirDom" style="font-weight:bold; color:#2563eb;">0</span>명 / 해외 <span id="statDirInt" style="font-weight:bold; color:#ef4444;">0</span>명</div>
      </div>
  </div>

  <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
      <h3 style="margin-top:0; color:#111827; font-size:16px;">🔍 유튜브 여론 심층 필터링
          <span style="font-size:13px; font-weight:normal; color:#2563eb; margin-left:15px;" id="sentimentScanStatus">여론 데이터 스캔 준비...</span>
      </h3>
      <div style="display:flex; flex-direction:column; gap:12px; font-size:14px; color:#374151;">
          <label>1. 부정 댓글 총합: 
              <input type="number" id="filterNegTotal" placeholder="예: 200" style="width:120px; margin-left:5px; padding:4px;"> 개 이상
          </label>
          <label>2. 부정 댓글 비율: 
              <input type="number" id="filterNegRatio" placeholder="0 ~ 100" style="width:120px; margin-left:5px; padding:4px;" min="0" max="100"> % 이상
          </label>
          <label>3. 부정 댓글 최대 급증/급락폭(기울기): 
              <input type="number" id="filterNegSlope" placeholder="스캔 중..." style="width:180px; margin-left:5px; padding:4px;"> 개/주 이상
          </label>
          <div style="margin-top:5px;">
              <button class="btn" onclick="applySentimentFilter()" style="background:#4f46e5; color:white; border:none; padding:8px 16px;">위 조건으로 여론 기반 검색</button>
          </div>
      </div>
  </div>

  <div id="count" class="note" style="margin-bottom: 10px;"></div>
  <ul id="results" class="list"></ul>

  <div id="rankingContainer" style="margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ddd; display: none;">
      <h2> 실시간 스타 파워 (SP_Final) TOP 10</h2>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #111827; border-bottom: 2px solid #2563eb; padding-bottom: 5px;"> 통합 랭킹</h3>
              <ul id="rankOverall" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 5px;"> 남자 배우 랭킹</h3>
              <ul id="rankMale" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #ef4444; border-bottom: 2px solid #ef4444; padding-bottom: 5px;"> 여자 배우 랭킹</h3>
              <ul id="rankFemale" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
      </div>
  </div>

</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`];
const PATHS_SENTIMENT = [`docs/data/sentiment/`, `data/sentiment/`];

let SEARCH_INDEX = [];
let GLOBAL_RANKED_ALL = []; // 스캔을 위해 전체 랭킹 데이터 전역 보관
let VALID_SENTIMENT_ACTORS = []; // 여론 데이터가 있는 배우들 목록
let GLOBAL_MAX_SLOPE = 0; // 발견된 최대 기울기(절댓값)

async function loadIndex() {
    for (const p of PATHS_INDEX) {
        try {
            const res = await fetch(p);
            if (res.ok) { 
                SEARCH_INDEX = await res.json(); 
                calculateGlobalRankings(); 
                return; 
            }
        } catch(e) {}
    }
}
loadIndex();

async function fetchPersonInfo(id) {
    if (!id) return null;
    for (const prefix of PATHS_DETAILS) {
        try {
            const res = await fetch(prefix + `${id}.json?v=${TS}`);
            if (res.ok) {
                const data = await res.json();
                return data.peopleInfoResult?.peopleInfo || data;
            }
        } catch(e) {}
    }
    return null;
}

// 🌟 [추가 기능 1] 데이터베이스 통계 (국내/해외) 산출
function calculateDbStats() {
    const actorsSetDomestic = new Set();
    const actorsSetIntl = new Set();
    const directorsSetDomestic = new Set();
    const directorsSetIntl = new Set();

    // 이름에 한글이 하나라도 포함되어 있으면 국내로 분류 (휴리스틱 판단)
    const isDomestic = (name) => /[가-힣]/.test(name);

    SEARCH_INDEX.forEach(m => {
        (m.actors || []).forEach(a => {
            if (a.id) {
                if (isDomestic(a.name)) actorsSetDomestic.add(a.id);
                else actorsSetIntl.add(a.id);
            }
        });
        (m.directors || []).forEach(d => {
            if (d.id) {
                if (isDomestic(d.name)) directorsSetDomestic.add(d.id);
                else directorsSetIntl.add(d.id);
            }
        });
    });

    document.getElementById('statActorDom').innerText = actorsSetDomestic.size.toLocaleString();
    document.getElementById('statActorInt').innerText = actorsSetIntl.size.toLocaleString();
    document.getElementById('statDirDom').innerText = directorsSetDomestic.size.toLocaleString();
    document.getElementById('statDirInt').innerText = directorsSetIntl.size.toLocaleString();
}

// 여론 데이터 단일 호출 함수
async function tryFetchSentiment(name) {
    for (const prefix of PATHS_SENTIMENT) {
        try {
            const res = await fetch(prefix + `${name}.json?v=${TS}`);
            if (res.ok) return await res.json();
        } catch(e) {}
    }
    return null;
}

// 🌟 [추가 기능 2-1] 여론 데이터 백그라운드 스캔 (병렬)
async function startSentimentScan() {
    const statusEl = document.getElementById('sentimentScanStatus');
    const slopeInput = document.getElementById('filterNegSlope');
    statusEl.innerText = `검색 가능한 배우의 수: 0명 (스타 파워 랭킹 기반 스캔 중...)`;

    const uniqueActors = GLOBAL_RANKED_ALL; 
    const batchSize = 10; // 네트워크 과부하 방지 청크 단위
    let foundCount = 0;

    for (let i = 0; i < uniqueActors.length; i += batchSize) {
        const batch = uniqueActors.slice(i, i + batchSize);
        await Promise.all(batch.map(async (actor) => {
            const data = await tryFetchSentiment(actor.name);
            if (data && data.timeline) {
                let totalPos = 0, totalNeg = 0, maxSlope = 0;
                let prevNeg = null;
                const weeks = Object.keys(data.timeline).sort();

                weeks.forEach(w => {
                    const p = data.timeline[w].positive || 0;
                    const n = Math.abs(data.timeline[w].negative || 0); // 항상 양수로 환산
                    totalPos += p;
                    totalNeg += n;

                    if (prevNeg !== null) {
                        const slope = Math.abs(n - prevNeg);
                        if (slope > maxSlope) maxSlope = slope;
                    }
                    prevNeg = n;
                });

                if (maxSlope > GLOBAL_MAX_SLOPE) GLOBAL_MAX_SLOPE = maxSlope;

                const totalComments = totalPos + totalNeg;
                const negRatio = totalComments > 0 ? (totalNeg / totalComments) * 100 : 0;

                VALID_SENTIMENT_ACTORS.push({
                    id: actor.id,
                    name: actor.name,
                    score: actor.score,
                    negTotal: totalNeg,
                    negRatio: negRatio,
                    maxSlope: maxSlope
                });
                foundCount++;
            }
        }));

        // UI 갱신
        statusEl.innerHTML = `검색 가능한 배우의 수: <b>${foundCount}명</b> <span style="color:#888;">(스캔 진행 중... ${Math.min(i + batchSize, uniqueActors.length)}/${uniqueActors.length})</span>`;
        slopeInput.placeholder = `0 ~ 최대 ${GLOBAL_MAX_SLOPE} 사이 입력`;

        // UI 스레드가 멈추지 않도록 짧은 휴식 부여
        await new Promise(r => setTimeout(r, 15));
    }
    
    statusEl.innerHTML = `검색 가능한 배우의 수: <b>${foundCount}명</b> <span style="color:#16a34a;">(스캔 완료 ✅)</span>`;
    // 스타파워 순 내림차순 정렬
    VALID_SENTIMENT_ACTORS.sort((a, b) => b.score - a.score);
}

// 🌟 [추가 기능 2-2] 필터 적용 버튼 로직
function applySentimentFilter() {
    const minNegTotal = parseInt(document.getElementById('filterNegTotal').value, 10) || 0;
    const minNegRatio = parseFloat(document.getElementById('filterNegRatio').value) || 0;
    const minNegSlope = parseInt(document.getElementById('filterNegSlope').value, 10) || 0;

    const filtered = VALID_SENTIMENT_ACTORS.filter(a => {
        return a.negTotal >= minNegTotal &&
               a.negRatio >= minNegRatio &&
               a.maxSlope >= minNegSlope;
    });

    const out = document.getElementById('results');
    out.innerHTML = '';
    document.getElementById('count').innerText = `여론 필터링 결과: 총 ${filtered.length}명 검색됨`;

    if (filtered.length === 0) {
        out.innerHTML = '<li class="note" style="color:#ef4444;">해당 조건에 부합하는 여론 분석 대상 배우가 없습니다.</li>';
        return;
    }

    filtered.forEach(r => {
        const li = document.createElement('li');
        li.style.borderBottom = "1px dashed #e5e7eb"; li.style.padding = "10px 0";
        
        li.innerHTML = `
            <a href="person.html?id=${r.id}&name=${encodeURIComponent(r.name)}" target="_blank" style="font-weight:bold; color:#2563eb; text-decoration:none; font-size:15px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${r.name}</a>
            <span class="note">(${r.id})</span>
            <span style="font-size:13px; font-weight:bold; color:#d97706; margin-left:8px;">[스타파워: ${Math.round(r.score).toLocaleString()}점]</span>
            <div style="font-size:13px; color:#4b5563; margin-top:6px; background:#f3f4f6; padding:8px; border-radius:4px; display:inline-block;">
                • 부정 댓글 총합: <b style="color:#ef4444;">${r.negTotal.toLocaleString()}개</b> &nbsp;|&nbsp; 
                • 부정 비율: <b style="color:#ef4444;">${r.negRatio.toFixed(1)}%</b> &nbsp;|&nbsp; 
                • 최대 급증/급락폭(기울기): <b style="color:#ef4444;">${r.maxSlope.toLocaleString()}개/주</b>
            </div>
        `;
        out.appendChild(li);
    });
}

// 기존 일반 검색 기능
async function doSearch() {
    if (SEARCH_INDEX.length === 0) await loadIndex();
    
    const keyword = document.getElementById('keyword').value.trim();
    const onlyActor = document.getElementById('onlyActor').checked;
    
    if (!keyword) { alert("이름을 입력해주세요."); return; }

    const out = document.getElementById('results');
    out.innerHTML = '<li class="note">검색 중...</li>';
    
    const peopleMap = new Map();

    SEARCH_INDEX.forEach(m => {
        const movieTitle = m.movieNm;
        (m.actors || []).forEach(a => {
            if (a.name.includes(keyword)) {
                const id = a.id || "";
                const key = id ? id : `name:${a.name}:actor`; 
                if (!peopleMap.has(key)) peopleMap.set(key, { id: id, name: a.name, sourceRole: '배우', movies: new Set() });
                peopleMap.get(key).movies.add(movieTitle);
            }
        });
        (m.directors || []).forEach(d => {
            if (d.name.includes(keyword)) {
                const id = d.id || "";
                const key = id ? id : `name:${d.name}:director`; 
                if (!peopleMap.has(key)) peopleMap.set(key, { id: id, name: d.name, sourceRole: '감독', movies: new Set() });
                peopleMap.get(key).movies.add(movieTitle);
            }
        });
    });

    let resultsArray = Array.from(peopleMap.values());
    out.innerHTML = '';
    let visibleCount = 0; 

    for (const r of resultsArray) {
        if (!r.id) continue;

        const li = document.createElement('li');
        li.style.borderBottom = "1px dashed #e5e7eb"; li.style.padding = "8px 0";
        
        li.innerHTML = `
            <a href="person.html?id=${r.id}&name=${encodeURIComponent(r.name)}" target="_blank" style="font-weight:bold; color:#2563eb; text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${r.name}</a>
            <span class="note">(${r.id})</span>
            <span id="info-${r.id}" style="font-size:13px; font-weight:bold; color:#555;">[${r.sourceRole}]</span>
            <span class="note" style="font-size:13px;">(${Array.from(r.movies).slice(0, 5).join(', ')}${r.movies.size > 5 ? ' 등' : ''})</span>
        `;
        
        fetchPersonInfo(r.id).then(info => {
            if (info) {
                const infoSpan = document.getElementById(`info-${r.id}`);
                let trueRole = info.repRoleNm || r.sourceRole; 
                
                let sexBadge = "";
                if (info.sex === "남자" || info.sex === "남") sexBadge = `<span style="color:#2563eb;">(남)</span>`;
                if (info.sex === "여자" || info.sex === "여") sexBadge = `<span style="color:#ef4444;">(여)</span>`;

                if (onlyActor && trueRole !== '배우' && !trueRole.includes('배우')) {
                    li.style.display = 'none';
                    visibleCount--;
                    document.getElementById('count').innerText = `일반 검색 결과: 총 ${visibleCount}건 검색됨`;
                } else {
                    infoSpan.innerHTML = `${sexBadge} [${trueRole}]`;
                }
            }
        });

        out.appendChild(li);
        visibleCount++;
    }

    document.getElementById('count').innerText = `일반 검색 결과: 총 ${visibleCount}건 검색됨`;
    if (visibleCount === 0) out.innerHTML = '<li class="note" style="color:red;">검색 결과가 없습니다.</li>';
}

async function calculateGlobalRankings() {
    const YEAR_TOTALS = {};
    const ACTOR_SCORES = new Map();

    SEARCH_INDEX.forEach(m => {
        const audi = parseInt(String(m.audiAcc).replace(/,/g, '') || '0', 10);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (year && audi > 0) YEAR_TOTALS[year] = (YEAR_TOTALS[year] || 0) + audi;
    });

    SEARCH_INDEX.forEach(m => {
        const A_i = parseInt(String(m.audiAcc).replace(/,/g, '') || '0', 10);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (!year || A_i <= 0) return;
        
        const Total_Y = YEAR_TOTALS[year];
        const W_time = Math.max(0.1, (parseInt(year) - 2000) / 10);
        const C_i = Math.max(1, (m.actors || []).length);

        (m.actors || []).forEach((a, idx) => {
            if (!a.id) return; 
            const W_role = (idx < Math.ceil(C_i / 3)) ? 1.0 : 0.5;
            const score_i = (A_i / Total_Y) * (W_role / Math.sqrt(C_i)) * W_time * 10000;

            if (!ACTOR_SCORES.has(a.id)) ACTOR_SCORES.set(a.id, { id: a.id, name: a.name, score: 0 });
            ACTOR_SCORES.get(a.id).score += score_i;
        });
    });

    const rankedAll = Array.from(ACTOR_SCORES.values()).sort((a,b) => b.score - a.score);
    GLOBAL_RANKED_ALL = rankedAll; // 🌟 전역 변수 저장 (스캔용)
    
    // 추가 지시 기능 실행
    calculateDbStats();
    startSentimentScan();

    const top100 = rankedAll.slice(0, 100);
    const enrichedTop100 = await Promise.all(top100.map(async (actor) => {
        const info = await fetchPersonInfo(actor.id);
        return { ...actor, sex: info ? info.sex : null };
    }));

    let topMale = [], topFemale = [];
    for (const actor of enrichedTop100) {
        if (actor.sex) {
            const s = actor.sex.trim();
            if ((s === '남자' || s === '남') && topMale.length < 10) topMale.push(actor);
            if ((s === '여자' || s === '여') && topFemale.length < 10) topFemale.push(actor);
        }
        if (topMale.length >= 10 && topFemale.length >= 10) break;
    }

    document.getElementById('rankingContainer').style.display = 'block';
    
    const renderList = (elementId, list) => {
        const el = document.getElementById(elementId);
        el.innerHTML = '';
        list.slice(0, 10).forEach(a => {
            el.innerHTML += `<li>
                <a href="person.html?id=${a.id}&name=${encodeURIComponent(a.name)}" target="_blank" style="color:#333; text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    <b>${a.name}</b> <span style="font-size:12px; color:#888;">(${Math.round(a.score).toLocaleString()}점)</span>
                </a>
            </li>`;
        });
    };

    renderList('rankOverall', rankedAll);
    renderList('rankMale', topMale);
    renderList('rankFemale', topFemale);
}
</script>
</body>
</html>
