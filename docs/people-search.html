<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우/감독 검색 – K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn active" data-i18n-key="peopleSearch">배우/감독 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1>배우/감독 검색</h1>

  <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
      <label>이름: <input type="text" id="keyword" onkeypress="if(event.key==='Enter') doSearch()" style="width:200px;"></label>
      <label style="margin-left:10px;"><input type="checkbox" id="onlyActor" checked> 배우만</label>
      <button class="btn" onclick="doSearch()" style="margin-left:10px;">검색</button>
  </div>

  <div id="count" class="note" style="margin-bottom: 10px;"></div>
  <ul id="results" class="list"></ul>

  <div id="rankingContainer" style="margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ddd; display: none;">
      <h2> 실시간 스타 파워 (SP_Final) TOP 10</h2>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #111827; border-bottom: 2px solid #2563eb; padding-bottom: 5px;"> 통합 랭킹</h3>
              <ul id="rankOverall" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 5px;"> 남자 배우 랭킹</h3>
              <ul id="rankMale" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
          <div style="flex: 1; min-width: 250px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px;">
              <h3 style="color: #ef4444; border-bottom: 2px solid #ef4444; padding-bottom: 5px;"> 여자 배우 랭킹</h3>
              <ul id="rankFemale" style="list-style: decimal; margin-left: 20px; line-height: 1.8;"></ul>
          </div>
      </div>
  </div>

</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`];

let SEARCH_INDEX = [];

async function loadIndex() {
    for (const p of PATHS_INDEX) {
        try {
            const res = await fetch(p);
            if (res.ok) { 
                SEARCH_INDEX = await res.json(); 
                calculateGlobalRankings(); // 인덱스 로딩 직후 랭킹 즉시 계산
                return; 
            }
        } catch(e) {}
    }
}
loadIndex();

async function fetchPersonInfo(id) {
    if (!id) return null;
    for (const prefix of PATHS_DETAILS) {
        try {
            const res = await fetch(prefix + `${id}.json?v=${TS}`);
            if (res.ok) {
                const data = await res.json();
                return data.peopleInfoResult?.peopleInfo || data;
            }
        } catch(e) {}
    }
    return null;
}

// === [해결: 검색 로직] ===
async function doSearch() {
    if (SEARCH_INDEX.length === 0) await loadIndex();
    
    const keyword = document.getElementById('keyword').value.trim();
    const onlyActor = document.getElementById('onlyActor').checked;
    
    if (!keyword) { alert("이름을 입력해주세요."); return; }

    const out = document.getElementById('results');
    out.innerHTML = '<li class="note">검색 중...</li>';
    
    const peopleMap = new Map();

    SEARCH_INDEX.forEach(m => {
        const movieTitle = m.movieNm;
        (m.actors || []).forEach(a => {
            if (a.name.includes(keyword)) {
                const id = a.id || "";
                const key = id ? id : `name:${a.name}:actor`; 
                if (!peopleMap.has(key)) peopleMap.set(key, { id: id, name: a.name, sourceRole: '배우', movies: new Set() });
                peopleMap.get(key).movies.add(movieTitle);
            }
        });
        (m.directors || []).forEach(d => {
            if (d.name.includes(keyword)) {
                const id = d.id || "";
                const key = id ? id : `name:${d.name}:director`; 
                if (!peopleMap.has(key)) peopleMap.set(key, { id: id, name: d.name, sourceRole: '감독', movies: new Set() });
                peopleMap.get(key).movies.add(movieTitle);
            }
        });
    });

    let resultsArray = Array.from(peopleMap.values());
    out.innerHTML = '';
    let visibleCount = 0; // 실제 표시되는 인원수

    for (const r of resultsArray) {
        // [해결요청 2] "코드없음" 데이터는 화면에 아예 그리지 않고 무시 (데이터는 보존됨)
        if (!r.id) continue;

        const li = document.createElement('li');
        li.style.borderBottom = "1px dashed #e5e7eb"; li.style.padding = "8px 0";
        
        // 동적으로 채워질 뼈대 HTML
        li.innerHTML = `
            <a href="person.html?id=${r.id}&name=${encodeURIComponent(r.name)}" style="font-weight:bold; color:#2563eb;">${r.name}</a>
            <span class="note">(${r.id})</span>
            <span id="info-${r.id}" style="font-size:13px; font-weight:bold; color:#555;">[${r.sourceRole}]</span>
            <span class="note" style="font-size:13px;">(${Array.from(r.movies).slice(0, 5).join(', ')}${r.movies.size > 5 ? ' 등' : ''})</span>
        `;
        
        // [해결요청 3] 실시간으로 상세 데이터를 열어 진짜 직종(repRoleNm)을 가져와 반영
        fetchPersonInfo(r.id).then(info => {
            if (info) {
                const infoSpan = document.getElementById(`info-${r.id}`);
                let trueRole = info.repRoleNm || r.sourceRole; // API 제공 진짜 직업
                
                let sexBadge = "";
                if (info.sex === "남자" || info.sex === "남") sexBadge = `<span style="color:#2563eb;">(남)</span>`;
                if (info.sex === "여자" || info.sex === "여") sexBadge = `<span style="color:#ef4444;">(여)</span>`;

                if (onlyActor && trueRole !== '배우' && !trueRole.includes('배우')) {
                    // 배우만 체크했는데 진짜 직업이 광고대행 등이라면 화면에서 숨기고 카운트 차감
                    li.style.display = 'none';
                    visibleCount--;
                    document.getElementById('count').innerText = `총 ${visibleCount}건 검색됨`;
                } else {
                    infoSpan.innerHTML = `${sexBadge} [${trueRole}]`;
                }
            }
        });

        out.appendChild(li);
        visibleCount++;
    }

    document.getElementById('count').innerText = `총 ${visibleCount}건 검색됨`;
    if (visibleCount === 0) out.innerHTML = '<li class="note" style="color:red;">검색 결과가 없습니다.</li>';
}

// === [해결요청 4] 실시간 스타 파워(SP_Final) 전체 랭킹 계산 ===
async function calculateGlobalRankings() {
    const YEAR_TOTALS = {};
    const ACTOR_SCORES = new Map();

    // 1차 순회: 연도별 총 관객수(Total_Y) 계산
    SEARCH_INDEX.forEach(m => {
        const audi = parseInt(String(m.audiAcc).replace(/,/g, '') || '0', 10);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (year && audi > 0) YEAR_TOTALS[year] = (YEAR_TOTALS[year] || 0) + audi;
    });

    // 2차 순회: SP_Final 공식 적용
    SEARCH_INDEX.forEach(m => {
        const A_i = parseInt(String(m.audiAcc).replace(/,/g, '') || '0', 10);
        const year = (m.openDt || '').slice(0,4) || String(m.prdtYear);
        if (!year || A_i <= 0) return;
        
        const Total_Y = YEAR_TOTALS[year];
        const W_time = Math.max(0.1, (parseInt(year) - 2000) / 10);
        const C_i = Math.max(1, (m.actors || []).length);

        (m.actors || []).forEach((a, idx) => {
            if (!a.id) return; // 코드 없으면 랭킹에서 제외
            const W_role = (idx < Math.ceil(C_i / 3)) ? 1.0 : 0.5;
            const score_i = (A_i / Total_Y) * (W_role / Math.sqrt(C_i)) * W_time * 10000;

            if (!ACTOR_SCORES.has(a.id)) ACTOR_SCORES.set(a.id, { id: a.id, name: a.name, score: 0 });
            ACTOR_SCORES.get(a.id).score += score_i;
        });
    });

    // 통합 랭킹 정렬
    const rankedAll = Array.from(ACTOR_SCORES.values()).sort((a,b) => b.score - a.score);
    
    // 남/녀 분리 추출 (상위권 인물만 fetch하여 성별 확인 - 속도 최적화)
    let topMale = [], topFemale = [];
    for (const actor of rankedAll) {
        if (topMale.length >= 10 && topFemale.length >= 10) break;
        const info = await fetchPersonInfo(actor.id);
        if (info && info.sex) {
            const s = info.sex.trim();
            if ((s === '남자' || s === '남') && topMale.length < 10) topMale.push(actor);
            if ((s === '여자' || s === '여') && topFemale.length < 10) topFemale.push(actor);
        }
    }

    // UI 렌더링
    document.getElementById('rankingContainer').style.display = 'block';
    
    const renderList = (elementId, list) => {
        const el = document.getElementById(elementId);
        el.innerHTML = '';
        list.slice(0, 10).forEach(a => {
            el.innerHTML += `<li>
                <a href="person.html?id=${a.id}&name=${encodeURIComponent(a.name)}" style="color:#333; text-decoration:none;">
                    <b>${a.name}</b> <span style="font-size:12px; color:#888;">(${Math.round(a.score).toLocaleString()}점)</span>
                </a>
            </li>`;
        });
    };

    renderList('rankOverall', rankedAll);
    renderList('rankMale', topMale);
    renderList('rankFemale', topFemale);
}
</script>
</body>
</html>
