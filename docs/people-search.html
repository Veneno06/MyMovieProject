<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- [수정] title에 번역 키 추가 -->
<title data-i18n-key="peopleSearchTitle">배우 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<!-- [수정] 신규 번역 스크립트 추가 -->
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:6px 0; border-bottom:1px dashed #e5e7eb; }
label { margin-right:8px; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- [수정] 버튼에 번역 키 추가 -->
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="peopleSearchTitle">배우/감독 검색</h1>

  <!-- [수정] 라벨에 번역 키 추가 -->
  <form id="f" class="box">
    <span data-i18n-key="nameLabel">이름:</span> <input type="text" name="q" value="">
    <label><input type="checkbox" name="actorOnly" checked> <span data-i18n-key="actorOnly">배우만</span></label>
    <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
  </form>

  <div id="total" class="note"></div>
  <ul id="out" class="list"></ul>
</div>

<script>
// [핵심 수정] 데이터 소스를 새로 수집한 search_index.json으로 변경
const PEOPLE_URL = `data/search_index.json?v=${Date.now()}`;
let PEOPLE_DB = []; // 가공된 사람 목록

async function loadIndex(){
  try {
    const r = await fetch(PEOPLE_URL);
    if(!r.ok){ throw new Error('Failed to load index'); }
    const movies = await r.json();
    
    // [데이터 가공] 영화 데이터를 사람 중심으로 재정렬 (ID 기준 분리)
    const peopleMap = new Map();

    movies.forEach(m => {
        // 배우 처리
        if (m.actors) {
            m.actors.forEach(a => {
                // ID가 있으면 ID 사용, 없으면 이름+직업으로 임시 키 생성
                const id = a.id ? a.id : `unknown_actor_${a.name}`;
                
                if (!peopleMap.has(id)) {
                    peopleMap.set(id, {
                        personKey: id, // ID를 키로 사용
                        peopleNm: a.name,
                        repRoleNm: '배우',
                        filmos: [] // 대표작 목록
                    });
                }
                const p = peopleMap.get(id);
                // 검색 결과에 보여줄 대표작 3개만 저장
                if (p.filmos.length < 3) p.filmos.push(m.movieNm);
            });
        }
        // 감독 처리
        if (m.directors) {
            m.directors.forEach(d => {
                const id = d.id ? d.id : `unknown_director_${d.name}`;
                
                if (!peopleMap.has(id)) {
                    peopleMap.set(id, {
                        personKey: id,
                        peopleNm: d.name,
                        repRoleNm: '감독',
                        filmos: []
                    });
                }
                // 이미 배우로 등록된 사람은 감독 역할도 추가 가능하나, 여기선 덮어쓰지 않음
            });
        }
    });

    PEOPLE_DB = Array.from(peopleMap.values());
    document.getElementById('total').textContent = '데이터 로드 완료. 검색어를 입력하세요.';

  } catch(e) {
    console.error(e);
    PEOPLE_DB = [];
    document.getElementById('total').textContent = '데이터를 불러오는 데 실패했습니다.';
  }
}

function search(){
  const f = new FormData(document.getElementById('f'));
  const q = (f.get('q')||'').trim().toLowerCase();
  const actorOnly = f.get('actorOnly') !== null;

  // 검색어가 없으면 목록 비움
  if (!q) {
      document.getElementById('out').innerHTML = '';
      document.getElementById('total').textContent = '검색어를 입력하세요.';
      return;
  }

  let list = PEOPLE_DB.filter(p => (p.peopleNm||'').toLowerCase().includes(q));
  
  if (actorOnly) {
    list = list.filter(p => (p.repRoleNm||'') === '배우');
  }

  list = list.slice(0, 200);

  document.getElementById('total').textContent = `총 ${list.length}명 검색됨`;
  const ul = document.getElementById('out');
  ul.innerHTML = '';
  
  for (const p of list) {
    // [핵심] ID를 파라미터로 넘김
    const href = `person.html?id=${encodeURIComponent(p.personKey)}&name=${encodeURIComponent(p.peopleNm)}`;
    
    // 대표작 표시
    const filmoStr = p.filmos.length > 0 ? `(${p.filmos.join(', ')} 등)` : '';
    const codeStr = (p.personKey.startsWith('unknown')) ? '' : `<span style="font-size:0.8em; color:#999; margin-left:4px;">(코드: ${p.personKey})</span>`;

    const li = document.createElement('li');
    li.innerHTML = `<a href="${href}"><strong>${p.peopleNm}</strong></a> 
                    <span class="note">${p.repRoleNm} ${filmoStr}</span> ${codeStr}`;
    ul.appendChild(li);
  }
}

(async function main(){
  await loadIndex();
  const f = document.getElementById('f');
  f.addEventListener('submit', (e)=>{ e.preventDefault(); search(); });

  const initialQuery = new URLSearchParams(location.search).get('q');
  if (initialQuery) {
    document.querySelector('input[name="q"]').value = initialQuery;
    // 데이터 로드가 비동기이므로 약간 대기 후 검색 시도 (혹은 loadIndex 내에서 호출도 가능)
    setTimeout(search, 500); 
  }
})();
</script>
</body>
</html>
