<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- [수정] title에 번역 키 추가 -->
<title data-i18n-key="peopleSearchTitle">배우 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<!-- [수정] 신규 번역 스크립트 추가 -->
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:6px 0; border-bottom:1px dashed #e5e7eb; }
label { margin-right:8px; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- [수정] 버튼에 번역 키 추가 -->
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="peopleSearchTitle">배우/감독 검색</h1>

  <!-- [수정] 라벨에 번역 키 추가 -->
  <form id="f" class="box">
    <span data-i18n-key="nameLabel">이름:</span> <input type="text" name="q" value="">
    <label><input type="checkbox" name="actorOnly" checked> <span data-i18n-key="actorOnly">배우만</span></label>
    <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
  </form>

  <div id="total" class="note"></div>
  <ul id="out" class="list"></ul>
</div>

<script>
const BASE = location.pathname.replace(/\/[^\/]*$/, '');
const PEOPLE_URL = `${BASE}/data/search/people.json?v=${Date.now()}`;
let PEOPLE = [];

async function loadIndex(){
  try {
    const r = await fetch(PEOPLE_URL);
    if(!r.ok){ throw new Error('Failed to load people index'); }
    const j = await r.json();
    PEOPLE = j.people || [];
  } catch(e) {
    PEOPLE = [];
    document.getElementById('total').textContent = '데이터를 불러오는 데 실패했습니다.';
  }
}

function search(){
  const f = new FormData(document.getElementById('f'));
  const q = (f.get('q')||'').trim().toLowerCase();
  const actorOnly = f.get('actorOnly') !== null;

  let list = PEOPLE;
  if (q) {
    list = list.filter(p => (p.peopleNm||'').toLowerCase().includes(q));
  }
  if (actorOnly) {
    list = list.filter(p => (p.repRoleNm||'') === '배우');
  }

  if (!q) list = [];
  list = list.slice(0, 200);

  document.getElementById('total').textContent = q ? `총 ${list.length}명 검색됨 (캐시)` : '검색어를 입력하세요.';
  const ul = document.getElementById('out');
  ul.innerHTML = '';
  
  for (const p of list) {
    const href = `person.html?personKey=${encodeURIComponent(p.personKey)}`;
    const li = document.createElement('li');
    li.innerHTML = `<a href="${href}">${p.peopleNm}</a> <span class="note">${p.repRoleNm||''}</span>`;
    ul.appendChild(li);
  }
}

(async function main(){
  await loadIndex();
  const f = document.getElementById('f');
  f.addEventListener('submit', (e)=>{ e.preventDefault(); search(); });

  const initialQuery = new URLSearchParams(location.search).get('q');
  if (initialQuery) {
    f.q.value = initialQuery;
  }
  search();
})();
</script>
</body>
</html>
