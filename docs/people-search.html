<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="peopleSearchTitle">배우 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:6px 0; border-bottom:1px dashed #e5e7eb; }
label { margin-right:8px; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="peopleSearchTitle">배우/감독 검색</h1>

  <form id="f" class="box">
    <span data-i18n-key="nameLabel">이름:</span> <input type="text" name="q" value="">
    <label><input type="checkbox" name="actorOnly" checked> <span data-i18n-key="actorOnly">배우만</span></label>
    <button type="submit" class="btn" data-i18n-key="searchBtn">검색</button>
  </form>

  <div id="total" class="note"></div>
  <ul id="out" class="list"></ul>
</div>

<script>
// [핵심] 데이터 경로 캐싱 방지
const TS = Date.now();
const PATHS = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
let PEOPLE_DB = [];

async function loadIndex(){
  for (const path of PATHS) {
      try {
          const r = await fetch(path);
          if (r.ok) {
              const data = await r.json();
              processData(data);
              return;
          }
      } catch(e) {}
  }
  document.getElementById('total').textContent = '데이터를 불러올 수 없습니다.';
}

function processData(movies) {
    const peopleMap = new Map();
    
    movies.forEach(m => {
        // 배우 처리
        if (m.actors) {
            m.actors.forEach(a => {
                // ID가 있으면 ID, 없으면 name:이름
                const id = (a.id && a.id.trim()) ? a.id : `name:${a.name}`;
                
                if (!peopleMap.has(id)) {
                    peopleMap.set(id, { 
                        personKey: id, 
                        peopleNm: a.name, 
                        repRoleNm: '배우', 
                        filmos: [],
                        sex: a.gender || '' // 성별 정보 수집
                    });
                }
                const p = peopleMap.get(id);
                // 중복 영화명 방지
                if (!p.filmos.includes(m.movieNm)) {
                     if (p.filmos.length < 4) p.filmos.push(m.movieNm); // 4개까지만 저장
                }
            });
        }
        // 감독 처리
        if (m.directors) {
            m.directors.forEach(d => {
                const id = (d.id && d.id.trim()) ? d.id : `name:${d.name}`;
                if (!peopleMap.has(id)) {
                     peopleMap.set(id, { personKey: id, peopleNm: d.name, repRoleNm: '감독', filmos: [], sex: '' });
                }
                const p = peopleMap.get(id);
                if (!p.filmos.includes(m.movieNm) && p.filmos.length < 4) p.filmos.push(m.movieNm);
            });
        }
    });
    PEOPLE_DB = Array.from(peopleMap.values());
}

function search(){
  const f = new FormData(document.getElementById('f'));
  const q = (f.get('q')||'').trim().toLowerCase();
  if (!q) { document.getElementById('out').innerHTML=''; return; }

  let list = PEOPLE_DB.filter(p => (p.peopleNm||'').toLowerCase().includes(q));
  if (f.get('actorOnly')) list = list.filter(p => p.repRoleNm === '배우');
  
  // 출연작 많은 순 정렬
  list.sort((a, b) => b.filmos.length - a.filmos.length);
  list = list.slice(0, 200);

  document.getElementById('total').textContent = `총 ${list.length}명 검색됨`;
  const ul = document.getElementById('out');
  ul.innerHTML = '';
  
  for (const p of list) {
    const href = `person.html?id=${encodeURIComponent(p.personKey)}&name=${encodeURIComponent(p.peopleNm)}`;
    const filmoStr = p.filmos.length > 0 ? `(${p.filmos.join(', ')} 등)` : '';
    
    // [UI 개선] 성별 표시
    let genderBadge = '';
    if (p.sex === '남자' || p.sex === '남') genderBadge = ' <span style="color:blue;font-size:0.8em;">(남)</span>';
    else if (p.sex === '여자' || p.sex === '여') genderBadge = ' <span style="color:red;font-size:0.8em;">(여)</span>';

    // 코드 유무 표시 (디버깅 및 구분용)
    const hasCode = !p.personKey.startsWith('name:');
    const codeInfo = hasCode ? '' : ' <span style="font-size:0.8em;color:#999;">(상세정보 없음)</span>';
    
    const li = document.createElement('li');
    li.innerHTML = `<a href="${href}"><strong>${p.peopleNm}</strong></a>${genderBadge} <span class="note">${p.repRoleNm} ${filmoStr}</span> ${codeInfo}`;
    ul.appendChild(li);
  }
}

(async function main(){
  await loadIndex();
  document.getElementById('f').addEventListener('submit', (e)=>{ e.preventDefault(); search(); });
  
  const q = new URLSearchParams(location.search).get('q');
  if(q) {
      document.querySelector('input[name=q]').value = q;
      const check = setInterval(() => {
          if(PEOPLE_DB.length > 0) { clearInterval(check); search(); }
      }, 100);
  }
})();
</script>
</body>
</html>
