<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우/감독 검색 – K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
  .search-box { background: #f9fafb; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e5e7eb; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .search-input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; width: 250px; }
  .btn-search { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .result-count { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  .result-list { list-style: none; padding: 0; margin: 0; }
  .result-item { border-bottom: 1px dashed #e5e7eb; padding: 15px 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .name-link { color: #2563eb; font-weight: bold; text-decoration: none; font-size: 16px; }
  .name-link:hover { text-decoration: underline; }
  .code { color: #6b7280; font-size: 13px; }
  .dynamic-info { font-size: 14px; }
  .role-badge { color: #4b5563; font-weight: bold; }
  .movies { color: #6b7280; font-size: 13px; margin-left: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn active" data-i18n-key="peopleSearch">배우/감독 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 style="margin-bottom: 20px;">배우/감독 검색</h1>

  <div class="search-box">
      <label style="font-weight:bold;">이름:</label>
      <input type="text" id="keyword" class="search-input" placeholder="예: 이병헌, 박지환" onkeypress="if(event.key==='Enter') doSearch()">
      <label style="cursor:pointer; display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="onlyActor" checked style="transform:scale(1.2);"> 배우만
      </label>
      <button class="btn-search" onclick="doSearch()">검색</button>
  </div>

  <div id="count" class="result-count"></div>
  <ul id="results" class="result-list"></ul>
</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`];

let SEARCH_INDEX = [];

// 1. 기초 데이터 로드
async function loadIndex() {
    for (const p of PATHS_INDEX) {
        try {
            const res = await fetch(p);
            if (res.ok) { SEARCH_INDEX = await res.json(); return; }
        } catch(e) {}
    }
}
loadIndex();

// 2. 상세 정보 동적 페치 함수 (직종 확인용)
async function fetchPersonInfo(id) {
    if (!id) return null;
    for (const prefix of PATHS_DETAILS) {
        try {
            const res = await fetch(prefix + `${id}.json?v=${TS}`);
            if (res.ok) {
                const data = await res.json();
                return data.peopleInfoResult?.peopleInfo || data;
            }
        } catch(e) {}
    }
    return null;
}

// 3. 메인 검색 로직
async function doSearch() {
    if (SEARCH_INDEX.length === 0) await loadIndex();
    
    const keyword = document.getElementById('keyword').value.trim();
    const onlyActor = document.getElementById('onlyActor').checked;
    
    if (!keyword) {
        alert("이름을 입력해주세요.");
        return;
    }

    const out = document.getElementById('results');
    out.innerHTML = '<li style="color:#666;">검색 중...</li>';
    
    const peopleMap = new Map();

    // 데이터 순회 및 병합 (코드없음 분리 로직 적용)
    SEARCH_INDEX.forEach(m => {
        const movieTitle = m.movieNm;

        // 배우 처리
        (m.actors || []).forEach(a => {
            if (a.name.includes(keyword)) {
                const id = a.id || "";
                // [해결포인트 1] 코드가 없으면 이름과 '역할(배우)'을 결합하여 고유키 생성 (분리 효과)
                const key = id ? id : `name:${a.name}:actor`; 
                
                if (!peopleMap.has(key)) {
                    peopleMap.set(key, { id: id, name: a.name, sourceRole: '배우', movies: new Set() });
                }
                peopleMap.get(key).movies.add(movieTitle);
            }
        });

        // 감독 처리
        (m.directors || []).forEach(d => {
            if (d.name.includes(keyword)) {
                const id = d.id || "";
                // [해결포인트 1] 코드가 없으면 이름과 '역할(감독)'을 결합하여 고유키 생성 (분리 효과)
                const key = id ? id : `name:${d.name}:director`; 
                
                if (!peopleMap.has(key)) {
                    peopleMap.set(key, { id: id, name: d.name, sourceRole: '감독', movies: new Set() });
                }
                peopleMap.get(key).movies.add(movieTitle);
            }
        });
    });

    let resultsArray = Array.from(peopleMap.values());
    
    // 초기 렌더링
    out.innerHTML = '';
    let visibleCount = resultsArray.length;
    document.getElementById('count').innerText = `총 ${visibleCount}건 검색됨`;

    if (visibleCount === 0) {
        out.innerHTML = '<li style="color:#ef4444;">검색 결과가 없습니다.</li>';
        return;
    }

    for (const r of resultsArray) {
        const li = document.createElement('li');
        li.className = 'result-item';
        
        const displayId = r.id ? r.id : "코드없음";
        const linkId = r.id ? r.id : `name:${r.name}`;
        
        // 임시 HTML 구조 생성 (동적 데이터 페치 후 채워짐)
        li.innerHTML = `
            <a href="person.html?id=${encodeURIComponent(linkId)}&name=${encodeURIComponent(r.name)}" class="name-link" target="_blank">${r.name}</a>
            <span class="code">(${displayId})</span>
            <span class="dynamic-info" id="info-${r.id || linkId.replace(/:/g,'-')}">
                <span class="role-badge">${r.sourceRole}</span>
            </span>
            <span class="movies">(${Array.from(r.movies).slice(0, 5).join(', ')}${r.movies.size > 5 ? ' 등' : ''})</span>
        `;
        out.appendChild(li);

        // [해결포인트 2 & 3] 상세 정보 실시간 페치 및 2차 필터링 (광고대행 분리)
        if (r.id) {
            fetchPersonInfo(r.id).then(info => {
                if (info) {
                    const infoSpan = document.getElementById(`info-${r.id}`);
                    // KOFIC 상세 정보의 '대표 직종'을 우선적으로 가져옴
                    let trueRole = info.repRoleNm || r.sourceRole; 
                    
                    // 성별 뱃지
                    let sexBadge = "";
                    if (info.sex === "남자" || info.sex === "남") sexBadge = `<span style="color:#2563eb; margin-right:4px;">(남)</span>`;
                    if (info.sex === "여자" || info.sex === "여") sexBadge = `<span style="color:#ef4444; margin-right:4px;">(여)</span>`;

                    // "배우만" 필터 로직: KOFIC에서 추출한 진짜 직업이 '배우'가 아니면 즉시 숨김
                    if (onlyActor && trueRole !== '배우' && !trueRole.includes('배우')) {
                        li.style.display = 'none';
                        visibleCount--;
                        document.getElementById('count').innerText = `총 ${visibleCount}건 검색됨`;
                    } else {
                        // 정확한 성별과 진짜 직업으로 UI 업데이트
                        infoSpan.innerHTML = `${sexBadge}<span class="role-badge">${trueRole}</span>`;
                    }
                }
            });
        } else {
            // 코드 없는 사람의 경우 (페치할 상세 정보가 없음)
            if (onlyActor && r.sourceRole !== '배우') {
                li.style.display = 'none';
                visibleCount--;
                document.getElementById('count').innerText = `총 ${visibleCount}건 검색됨`;
            }
        }
    }
}
</script>
</body>
</html>
