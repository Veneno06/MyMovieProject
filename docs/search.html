<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="movieSearchTitle">영화 검색(기간)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.box { background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; }

.ctrls { display:flex; gap:8px; margin-bottom:12px; flex-wrap: wrap; align-items: center; }
.ctrls .btn { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; font-size: 1rem;}

label { margin-right:10px; white-space:nowrap; }
ul.list { list-style:none; padding:0; margin:16px 0; }
ul.list li { padding:6px 0; border-bottom:1px dashed #e5e7eb; }
.badge { font-size:12px; color:#6b7280; margin-left:6px; }
.note { color:#6b7280; font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn active" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="movieSearchTitle">영화 검색(기간)</h1>

  <div id="dataRange" class="note" style="margin-bottom: 10px;">데이터 범위: 2003년 ~ 현재 (인덱스 기준)</div>

  <div class="box">
    <form id="f">
      <div style="display:flex;flex-wrap:wrap;gap:12px;">
        <div><span data-i18n-key="dateStart">시작일:</span> <input type="date" name="from"></div>
        <div><span data-i18n-key="dateEnd">종료일:</span> <input type="date" name="to"></div>
        <div>
          <span data-i18n-key="rating">등급:</span>
          <label><input type="checkbox" name="g_all" checked> <span data-i18n-key="ratingAll">전체관람가</span></label>
          <label><input type="checkbox" name="g_12" checked> <span data-i18n-key="rating12">12세 이상 관람가</span></label>
          <label><input type="checkbox" name="g_15" checked> <span data-i18n-key="rating15">15세 이상 관람가</span></label>
          <label><input type="checkbox" name="g_r" checked> <span data-i18n-key="ratingR">청소년 관람불가</span></label>
        </div>
        <div>
          <span data-i18n-key="nation">국가:</span>
          <label><input type="radio" name="nation" value="all" checked> <span data-i18n-key="nationAll">모두</span></label>
          <label><input type="radio" name="nation" value="K"> <span data-i18n-key="nationK">국내 영화</span></label>
          <label><input type="radio" name="nation" value="F"> <span data-i18n-key="nationF">국외 영화</span></label>
        </div>
        <div><button type="submit" class="btn" data-i18n-key="searchBtn">검색</button></div>
      </div>
    </form>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 8px 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">
      <div id="msg" class="note" style="margin: 0; font-weight: bold; color: #2563eb; font-size: 15px;">검색 대기 중...</div>
      <div style="font-size: 14px; color: #374151;">
          <label style="margin-right: 12px; cursor: pointer;">
              <input type="radio" name="sortOrder" value="desc" checked onchange="applySort()"> 최신순
          </label>
          <label style="cursor: pointer;">
              <input type="radio" name="sortOrder" value="asc" onchange="applySort()"> 오래된 순
          </label>
      </div>
  </div>

  <ul id="out" class="list"></ul>
</div>

<script>
const BASE = location.pathname.replace(/\/[^\/]*$/, '');
const MOVIES_URL = `${BASE}/data/search/movies.json?v=${Date.now()}`;

let MOVIES = [];
let currentFilteredList = []; // 🌟 정렬을 위해 필터링된 배열을 별도 저장

function ymd(s) { return (s||'').replace(/-/g,''); }
function between(d, a, b){ return (!a || d>=a) && (!b || d<=b); }

function formatDate(s){
  if(!s) return '개봉일미상';
  const t = s.replace(/-/g,'');
  if (t.length === 8) return `${t.slice(0,4)}.${t.slice(4,6)}.${t.slice(6,8)}`;
  return s.replace(/-/g,'.');
}

async function loadIndex() {
  try {
    const r = await fetch(MOVIES_URL);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    MOVIES = (j.movies || []);
  } catch(e) {
    MOVIES = [];
    document.getElementById('msg').innerHTML =
      `문제가 있나요? <b>인덱스를 재생</b>해 주세요 (Actions → <i>Build Search Indexes (only)</i>).`;
  }
}

function filter() {
  const f = new FormData(document.getElementById('f'));
  const from = ymd(f.get('from'));
  const to   = ymd(f.get('to'));
  const gAll = f.get('g_all') !== null;
  const g12  = f.get('g_12')  !== null;
  const g15  = f.get('g_15')  !== null;
  const gR   = f.get('g_r')   !== null;
  const nation = f.get('nation') || 'all';

  const allowGrade = new Set([
    ...(gAll?['전체관람가']:[]),
    ...(g12?['12세이상관람가','12세 이상 관람가']:[]),
    ...(g15?['15세이상관람가','15세 이상 관람가']:[]),
    ...(gR ?['청소년관람불가','청소년 관람불가']:[]),
  ]);

  currentFilteredList = MOVIES.filter(m => {
    const movieOpenDt = ymd(m.openDt);
    
    // 🌟 2003년 이전 개봉작 강제 배제 로직 추가
    if (!movieOpenDt || movieOpenDt < '20030101') return false; 
    
    if (movieOpenDt && !between(movieOpenDt, from, to)) return false;
    if (allowGrade.size && !allowGrade.has(m.grade||'')) return false;
    if (nation !== 'all') {
      if ((m.repNation||'') !== nation) return false;
    }
    return true;
  });

  applySort(); // 필터링이 끝나면 즉시 정렬 및 화면 출력 함수 호출
}

// 🌟 새로고침 없이 즉각 정렬 및 출력을 담당하는 함수
function applySort() {
  const sortOrder = document.querySelector('input[name="sortOrder"]:checked').value;
  
  currentFilteredList.sort((a,b) => {
      const dateA = ymd(a.openDt) || '00000000';
      const dateB = ymd(b.openDt) || '00000000';
      if (sortOrder === 'desc') {
          return dateA < dateB ? 1 : -1; // 최신순
      } else {
          return dateA > dateB ? 1 : -1; // 오래된 순
      }
  });

  const ul = document.getElementById('out');
  ul.innerHTML = '';
  for (const m of currentFilteredList) {
    const li = document.createElement('li');
    const dateText = formatDate(m.openDt);
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(m.movieCd)}" style="font-weight:bold; color:#111827; text-decoration:none;">${m.movieNm}</a>
      <span class="badge">(${dateText})</span>
      <span class="badge" style="color:#d97706;">[${m.grade||'등급미상'}]</span>`;
    ul.appendChild(li);
  }

  document.getElementById('msg').textContent =
    currentFilteredList.length ? `총 ${currentFilteredList.length.toLocaleString()}개의 영화를 찾았습니다.` : `조건에 맞는 결과가 없습니다.`;
}

(async function main(){
  await loadIndex();
  const f = document.getElementById('f');
  const today = new Date().toISOString().slice(0, 10);
  const thisYear = today.slice(0, 4);
  f.from.value = `${thisYear}-01-01`;
  f.to.value   = today;
  f.addEventListener('submit', (e)=>{e.preventDefault(); filter();});
  filter();
})();
</script>
</body>
</html>
