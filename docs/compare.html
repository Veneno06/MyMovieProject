<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="compareTitle">배우 비교 – K-Movie A Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
.compare-container { display: flex; gap: 20px; width: 100%; overflow-x: auto; }
.actor-panel { flex: 1; min-width: 300px; padding: 10px; border: 1px solid #eee; border-radius: 8px; }
h1, h2 { text-align: center; }
.controls-container { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; }
.chart-buttons { display:flex; flex-wrap:wrap; gap:8px; justify-content: center; }
.chart-buttons button { padding:6px 12px; border:1px solid #ccc; border-radius:20px; background:#f0f0f0; cursor:pointer; font-size:14px; }
.chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
canvas { max-height: 400px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="compareTitle">스타 파워 비교</h1>

  <div class="compare-container">
    <div class="actor-panel" id="panel1">
        <h2 id="name1">로딩 중...</h2>
        <canvas id="chart1"></canvas>
    </div>
    <div class="actor-panel" id="panel2">
        <h2 id="name2">로딩 중...</h2>
        <canvas id="chart2"></canvas>
    </div>
    <div class="actor-panel" id="panel3" style="display: none;">
        <h2 id="name3">로딩 중...</h2>
        <canvas id="chart3"></canvas>
    </div>
  </div>
  
  <div class="controls-container">
      <div class="chart-buttons">
          <button id="btnTotalAudi" class="active" data-i18n-key="audiCnt">관객수</button>
          <button id="btnAudiPerActor" data-i18n-key="audiPerActor">관객수/배우 수</button>
          <button id="btnAudiPerFilmography" data-i18n-key="audiPerFilmo">관객수/출연작</button>
          <button id="btnAudiPerCareer" data-i18n-key="audiPerCareer">관객수/연기경력</button>
          <button id="btnAudiBonus" data-i18n-key="audiBonus">500만+ 가중치</button>
      </div>
  </div>
</div>

<script>
const TS = Date.now();
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`]; 

let charts = [null, null, null];
let actorsData = [null, null, null];

function getParam(k){ return new URLSearchParams(location.search).get(k); }

// 숫자 안전 변환
const safeParseInt = (v) => {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};

// 배우 상세 데이터 가져오기 (비동기)
async function fetchPersonDetail(id) {
    if(!id) return null;
    const fname = `${id}.json?v=${TS}`;
    for (const prefix of PATHS_DETAILS) {
        try { 
            const r = await fetch(prefix + fname); 
            if(r.ok) {
                const json = await r.json();
                return (json.peopleInfoResult && json.peopleInfoResult.peopleInfo) ? json.peopleInfoResult.peopleInfo : json;
            }
        } catch(e){}
    }
    return null;
}

async function main() {
    const ids = [getParam('p1'), getParam('p2'), getParam('p3')];
    
    // UI 초기화
    if (!ids[2]) document.getElementById('panel3').style.display = 'none';
    else document.getElementById('panel3').style.display = 'block';

    // 데이터 로드
    for (let i = 0; i < 3; i++) {
        if (ids[i]) {
            const data = await fetchPersonDetail(ids[i]);
            if (data) {
                actorsData[i] = data;
                document.getElementById(`name${i+1}`).textContent = data.peopleNm;
            } else {
                document.getElementById(`name${i+1}`).textContent = "데이터 없음";
            }
        }
    }

    setupButtonListeners();
    updateAllCharts('totalAudi');
}

function setupButtonListeners() {
    const buttons = [
        { id: 'btnTotalAudi', type: 'totalAudi' },
        { id: 'btnAudiPerActor', type: 'audiPerActor' },
        { id: 'btnAudiPerFilmography', type: 'audiPerFilmography' },
        { id: 'btnAudiPerCareer', type: 'audiPerCareer' },
        { id: 'btnAudiBonus', type: 'audiBonus' }
    ];

    buttons.forEach(btn => {
        const el = document.getElementById(btn.id);
        el.addEventListener('click', () => {
            buttons.forEach(b => document.getElementById(b.id).classList.remove('active'));
            el.classList.add('active');
            updateAllCharts(btn.type);
        });
    });
}

function updateAllCharts(type) {
    for (let i = 0; i < 3; i++) {
        if (actorsData[i]) {
            drawChart(i, actorsData[i], type);
        }
    }
}

function drawChart(idx, person, type) {
    const canvasId = `chart${idx+1}`;
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    if (charts[idx]) charts[idx].destroy();

    // 데이터 가공
    // 개봉일 있는 영화만, 오름차순 정렬
    const films = (person.filmos || []).filter(f => f.openDt && f.openDt.length >= 4)
                                       .sort((a,b) => a.openDt.localeCompare(b.openDt));
    
    if (films.length === 0) return;

    const firstYear = parseInt(films[0].openDt.slice(0,4));
    
    const labels = films.map(f => f.openDt.slice(0,4)); // 연도만 표시 (공간 절약)
    
    const dataPoints = films.map(f => {
        const audi = safeParseInt(f.audiAcc);
        
        if (type === 'audiPerActor') {
             // 배우 수를 알 수 없으므로(배우 파일엔 그 정보 없음) 임시로 1/N 대신 관객수 그대로 or 특정 로직
             // 여기서는 단순히 관객수 보여주되, 차후 영화 데이터와 조인 필요.
             // 현재는 데이터 한계로 관객수 그대로 표시하되 0.8 곱함 (예시)
             return Math.round(audi * 0.8); 
        } 
        else if (type === 'audiPerFilmography') {
             return Math.round(audi / films.length);
        }
        else if (type === 'audiPerCareer') {
             const curYear = parseInt(f.openDt.slice(0,4));
             const career = Math.max(1, curYear - firstYear + 1);
             return Math.round(audi / career);
        }
        else if (type === 'audiBonus') {
             return audi > 5000000 ? audi * 1.5 : audi;
        }
        return audi; // 기본: totalAudi
    });

    charts[idx] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '수치',
                data: dataPoints,
                borderColor: '#2e7d32',
                backgroundColor: 'rgba(46, 125, 50, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: (tt) => films[tt[0].dataIndex].movieNm,
                        label: (ctx) => ` ${ctx.parsed.y.toLocaleString()}`
                    }
                }
            },
            scales: {
                y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString() } }
            }
        }
    });
}

main();
</script>
</body>
</html>
