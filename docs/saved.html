<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>저장한 배우 – K-Movie A Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .actor-card {
        border: 1px solid #e6e6e6;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
    }
    .film-list {
        font-size: 14px;
        color: #555;
        margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>저장한 배우</h1>
    <div class="spacer"></div>
    <a href="index.html" class="btn">홈</a>
    <a href="search.html" class="btn">영화 검색</a>
    <a href="people-search.html" class="btn">배우 검색</a>
  </div>

  <div id="savedPeopleList" class="grid"></div>
</div>

<script>
const LIST_BOX = document.getElementById('savedPeopleList');
const PEOPLE_INDEX_URL = 'data/search/people.json';

function getSavedPeople() { return JSON.parse(localStorage.getItem('savedPeople') || '{}'); }
function setSavedPeople(obj) { localStorage.setItem('savedPeople', JSON.stringify(obj)); }
function removeSaved(id) {
    const saved = getSavedPeople();
    delete saved[id];
    setSaved(saved);
    render();
}

// [수정] ID 또는 이름으로 배우를 찾는 함수
function findPerson(peopleList, savedKey, savedInfo) {
    // ID가 있으면 ID로 찾기 (가장 정확)
    if (savedInfo.peopleCd) {
        return peopleList.find(p => p.peopleCd === savedInfo.peopleCd);
    }
    // ID가 없으면 이름으로 찾기
    if (savedKey.startsWith('name::')) {
        const name = savedKey.split('::')[1];
        return peopleList.find(p => p.peopleNm === name);
    }
    return null;
}

async function render() {
    const saved = getSavedPeople();
    const savedKeys = Object.keys(saved);

    LIST_BOX.innerHTML = '';
    if (savedKeys.length === 0) {
        LIST_BOX.innerHTML = '<div class="muted">저장된 배우가 없습니다.</div>';
        return;
    }

    const res = await fetch(`${PEOPLE_INDEX_URL}?v=${Date.now()}`);
    if (!res.ok) {
        LIST_BOX.innerHTML = '<div class="muted" style="color:red;">배우 목록을 불러오는 데 실패했습니다.</div>';
        return;
    }
    const peopleIndex = await res.json();
    const allPeople = peopleIndex.people || [];

    const savedPeopleDetails = [];
    for (const key of savedKeys) {
        const person = findPerson(allPeople, key, saved[key]);
        if (person) {
            savedPeopleDetails.push(person);
        }
    }
    
    savedPeopleDetails.sort((a, b) => (a.peopleNm || '').localeCompare(b.peopleNm || ''));

    savedPeopleDetails.forEach(person => {
        const div = document.createElement('div');
        div.className = 'actor-card';

        const topFilms = (person.films || [])
            .slice(0, 3)
            .map(film => film.movieNm)
            .join(', ');

        // [수정] 삭제 버튼에 전달할 ID를 결정 (ID 또는 이름)
        const personId = person.peopleCd || `name::${person.peopleNm}`;

        div.innerHTML = `
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <a href="person.html?peopleCd=${person.peopleCd || ''}&peopleNm=${encodeURIComponent(person.peopleNm)}"><strong>${person.peopleNm}</strong></a>
            <span class="muted">(${person.repRoleNm || ''})</span>
            <div class="spacer"></div>
            <button class="btn" onclick="removeSaved('${personId}')">삭제</button>
          </div>
          <div class="film-list">주요 출연작: ${topFilms || '정보 없음'}</div>
        `;
        LIST_BOX.appendChild(div);
    });
}

render();
</script>
</body>
</html>
