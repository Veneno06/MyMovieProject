<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>저장한 배우 – K-Movie A Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .actor-card {
        border: 1px solid #e6e6e6;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
    }
    .film-list {
        font-size: 14px;
        color: #555;
        margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>저장한 배우</h1>
    <div class="spacer"></div>
    <a href="index.html" class="btn">홈</a>
    <a href="search.html" class="btn">영화 검색</a>
    <a href="people-search.html" class="btn">배우 검색</a>
  </div>

  <div id="savedPeopleList" class="grid"></div>
</div>

<script>
const LIST_BOX = document.getElementById('savedPeopleList');
const PEOPLE_INDEX_URL = 'data/search/people.json';

// --- LocalStorage 관련 함수 ---
function getSavedPeople() { return JSON.parse(localStorage.getItem('savedPeople') || '{}'); }
function setSavedPeople(obj) { localStorage.setItem('savedPeople', JSON.stringify(obj)); }
function removeSaved(id) {
    const saved = getSavedPeople();
    delete saved[id];
    setSaved(saved);
    render();
}

// --- 데이터 렌더링 함수 ---
async function render() {
    const saved = getSavedPeople();
    const savedIds = Object.keys(saved);

    LIST_BOX.innerHTML = '';
    if (savedIds.length === 0) {
        LIST_BOX.innerHTML = '<div class="muted">저장된 배우가 없습니다.</div>';
        return;
    }

    // 전체 배우 인덱스 파일을 불러옴
    const res = await fetch(`${PEOPLE_INDEX_URL}?v=${Date.now()}`);
    if (!res.ok) {
        LIST_BOX.innerHTML = '<div class="muted" style="color:red;">배우 목록을 불러오는 데 실패했습니다.</div>';
        return;
    }
    const peopleIndex = await res.json();
    const allPeople = peopleIndex.people || [];

    // 저장된 배우 정보만 필터링
    const savedPeopleDetails = allPeople.filter(p => savedIds.includes(p.peopleCd));

    // 최신 출연작 순으로 정렬 (가장 최근 영화의 개봉일 기준)
    savedPeopleDetails.sort((a, b) => {
        const lastMovieA = a.films[0]?.openDt || '0';
        const lastMovieB = b.films[0]?.openDt || '0';
        return lastMovieB.localeCompare(lastMovieA);
    });

    savedPeopleDetails.forEach(person => {
        const div = document.createElement('div');
        div.className = 'actor-card';

        // 대표 출연작 3개만 표시
        const topFilms = (person.films || [])
            .slice(0, 3)
            .map(film => film.movieNm)
            .join(', ');

        div.innerHTML = `
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <a href="person.html?peopleCd=${person.peopleCd}"><strong>${person.peopleNm}</strong></a>
            <span class="muted">(${person.repRoleNm || ''})</span>
            <div class="spacer"></div>
            <button class="btn" onclick="removeSaved('${person.peopleCd}')">삭제</button>
          </div>
          <div class="film-list">주요 출연작: ${topFilms || '정보 없음'}</div>
        `;
        LIST_BOX.appendChild(div);
    });
}

render();
</script>
</body>
</html>
