<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>저장한 배우</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>
/* 페이지 고유 스타일(사이트 공통 스타일은 assets/style.css 사용) */
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.list { list-style:none; padding:0; margin:16px 0; }
.item { padding:14px 16px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; display:flex; align-items:flex-start; gap:12px; }
.item + .item { margin-top:10px; }
.item .meta { flex:1; }
.item .meta .name { font-weight:700; }
.item .meta .role { color:#6b7280; margin-left:6px; }
.item .actions { display:flex; gap:8px; }
.note { color:#6b7280; font-size:13px; }
.footer-actions { margin-top:12px; display:flex; gap:8px; align-items:center; }
.btn-danger { background:#fee2e2; border:1px solid #fecaca; }
.btn-danger:hover { background:#fecaca; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn">홈</a>
    <a href="search.html" class="btn">영화 검색</a>
    <a href="people-search.html" class="btn">배우 검색</a>
  </div>

  <h1>저장한 배우</h1>

  <ul id="list" class="list"></ul>
  <div id="msg" class="note"></div>

  <div class="footer-actions">
    <button id="compareBtn" class="btn" disabled>스타 파워 비교 (2명 선택)</button>
  </div>
</div>

<script>
/* ---------------- 로컬스토리지 유틸 ---------------- */
function getSavedPeople() {
  try { return JSON.parse(localStorage.getItem('savedPeople') || '{}'); }
  catch { return {}; }
}
function setSavedPeople(obj) {
  localStorage.setItem('savedPeople', JSON.stringify(obj));
}

/* ---------------- 렌더링 ---------------- */
const listEl = document.getElementById('list');
const msgEl = document.getElementById('msg');
const compareBtn = document.getElementById('compareBtn');

function render() {
  const saved = getSavedPeople();
  const entries = Object.values(saved);
  // 이름 오름차순
  entries.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'ko'));

  listEl.innerHTML = '';
  if (entries.length === 0) {
    msgEl.textContent = '저장된 배우가 없습니다.';
    compareBtn.disabled = true;
    return;
  }
  msgEl.textContent = '';

  for (const p of entries) {
    const li = document.createElement('li');
    li.className = 'item';
    li.innerHTML = `
      <input type="checkbox" class="pick" data-key="${p.personKey}" aria-label="${p.name}">
      <div class="meta">
        <div><span class="name">${p.name}</span> <span class="role">(배우)</span></div>
        <div class="note">personKey: ${p.personKey}</div>
      </div>
      <div class="actions">
        <button class="btn btn-danger del" data-key="${p.personKey}">삭제</button>
      </div>
    `;
    listEl.appendChild(li);
  }

  updateCompareState();
}

/* ---------------- 이벤트 핸들링 ---------------- */
// 삭제(핵심 수정: setSavedPeople 사용 & 위임 처리)
listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.del');
  if (!btn) return;

  const key = btn.getAttribute('data-key');
  if (!key) return;

  const saved = getSavedPeople();
  if (saved[key]) {
    delete saved[key];
    setSavedPeople(saved);   // <= 버그 원인: setSaved(...)가 아니라 setSavedPeople(...)
  }
  render();
});

// 비교 버튼 상태 업데이트
listEl.addEventListener('change', (e) => {
  if (e.target.classList.contains('pick')) updateCompareState();
});

function updateCompareState() {
  const picked = [...document.querySelectorAll('.pick:checked')];
  compareBtn.disabled = picked.length !== 2;
}

// 비교 페이지로 이동(기존 설계에 맞춰 쿼리스트링 두 명)
compareBtn.addEventListener('click', () => {
  const picked = [...document.querySelectorAll('.pick:checked')].map(i => i.getAttribute('data-key'));
  if (picked.length === 2) {
    // 예: compare.html?A=key1&B=key2 (사이트의 실제 비교 페이지 규격에 맞게 수정)
    location.href = `compare.html?A=${encodeURIComponent(picked[0])}&B=${encodeURIComponent(picked[1])}`;
  }
});

/* ---------------- 시작 ---------------- */
render();
</script>
</body>
</html>
