<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>저장 목록 – K-Movie A Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .actor-card {
      border: 1px solid #e6e6e6;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
    }
    .actor-info { flex-grow: 1; }
    .film-list {
      font-size: 14px;
      color: #555;
      margin-top: 6px;
    }
    .compare-section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
    .muted { color:#6b7280; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>저장 목록</h1>
    <div class="spacer"></div>
    <a href="index.html" class="btn">홈</a>
    <a href="search.html" class="btn">영화 검색</a>
    <a href="people-search.html" class="btn">배우 검색</a>
  </div>

  <div id="savedPeopleList" class="grid"></div>

  <div class="compare-section">
    <button class="btn" id="compareBtn" disabled>스타 파워 비교 (2명 선택)</button>
  </div>
</div>

<script>
/* ===== 공통 유틸 ===== */
const LIST_BOX = document.getElementById('savedPeopleList');
const COMPARE_BTN = document.getElementById('compareBtn');
const PEOPLE_INDEX_URL = 'data/search/people.json';

function getSavedPeople() {
  try { return JSON.parse(localStorage.getItem('savedPeople') || '{}'); }
  catch { return {}; }
}
function setSavedPeople(obj) {
  localStorage.setItem('savedPeople', JSON.stringify(obj));
}

/* 삭제 (버튼 onclick에서 사용) */
function removeSaved(id) {
  const saved = getSavedPeople();
  if (saved[id]) {
    delete saved[id];
    setSavedPeople(saved);   // ← 중요: setSaved가 아니라 setSavedPeople
  }
  render();
}

/* 체크박스 2개 선택 시 비교 버튼 활성화 */
function updateCompareButtonState() {
  const checked = document.querySelectorAll('.actor-checkbox:checked');
  COMPARE_BTN.disabled = (checked.length !== 2);
}

/* 렌더링 */
async function render() {
  const saved = getSavedPeople();
  const savedKeys = Object.keys(saved);

  LIST_BOX.innerHTML = '';
  if (savedKeys.length === 0) {
    LIST_BOX.innerHTML = '<div class="muted">저장된 배우가 없습니다.</div>';
    document.querySelector('.compare-section').style.display = 'none';
    return;
  }
  document.querySelector('.compare-section').style.display = '';

  // people 인덱스 로드 (주요 출연작 표시용)
  let allPeople = [];
  try {
    const res = await fetch(`${PEOPLE_INDEX_URL}?v=${Date.now()}`);
    if (res.ok) {
      const peopleIndex = await res.json();
      allPeople = peopleIndex.people || [];
    }
  } catch(e){}

  // 저장된 personKey 기준으로 상세 매칭
  const savedPeopleDetails = allPeople.filter(p => savedKeys.includes(p.personKey));
  // allPeople에 아직 없는(캐시 누락) 항목은 saved의 name/personKey로 보강
  const missingKeys = savedKeys.filter(k => !savedPeopleDetails.some(p => p.personKey === k));
  for (const k of missingKeys) {
    savedPeopleDetails.push({ personKey: k, peopleNm: saved[k]?.name || '(이름 미상)', repRoleNm: '배우', films: [] });
  }

  // 이름순 정렬(한글 대응)
  savedPeopleDetails.sort((a,b)=>(a.peopleNm||'').localeCompare(b.peopleNm||'','ko'));

  // 카드 렌더링
  for (const person of savedPeopleDetails) {
    const personId = person.personKey;
    const filmsStr = (person.films || []).slice(0,3).map(f => f.movieNm).join(', ') || '정보 없음';

    const card = document.createElement('div');
    card.className = 'actor-card';
    card.innerHTML = `
      <input type="checkbox" class="actor-checkbox" value="${personId}" style="transform: scale(1.2);">
      <div class="actor-info">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <a href="person.html?personKey=${encodeURIComponent(personId)}"><strong>${person.peopleNm || '이름 없음'}</strong></a>
          <span class="muted">(${person.repRoleNm || '배우'})</span>
          <div class="spacer"></div>
          <button class="btn" onclick="removeSaved('${personId}')">삭제</button>
        </div>
        <div class="film-list">주요 출연작: ${filmsStr}</div>
      </div>
    `;
    LIST_BOX.appendChild(card);
  }

  // 체크박스 이벤트 바인딩 및 초기 상태
  document.querySelectorAll('.actor-checkbox').forEach(cb => {
    cb.addEventListener('change', updateCompareButtonState);
  });
  updateCompareButtonState();
}

/* 비교 버튼: p1/p2 쿼리로 이동(기능 유지) */
COMPARE_BTN.addEventListener('click', () => {
  const checked = [...document.querySelectorAll('.actor-checkbox:checked')];
  if (checked.length === 2) {
    const p1 = encodeURIComponent(checked[0].value);
    const p2 = encodeURIComponent(checked[1].value);
    location.href = `compare.html?p1=${p1}&p2=${p2}`;
  }
});

/* 초기 렌더 */
render();
</script>
</body>
</html>
