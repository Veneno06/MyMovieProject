<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="movieTitleSearch">영화 검색 (제목)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }

/* 네비게이션 버튼 */
.ctrls { display:flex; gap:8px; margin-bottom:12px; flex-wrap: wrap; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }

/* 검색 박스 스타일 */
.box { 
    background:#f6f7f9; border:1px solid #e5e7eb; border-radius:8px; padding:12px; 
    position: relative; 
    display: flex; gap: 8px;
}
.search-input { 
    flex-grow: 1; 
    padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; 
}

/* 자동완성 드롭다운 */
.suggestions { 
    list-style: none; padding: 0; margin: 0; 
    border: 1px solid #ccc; border-top: none; 
    border-radius: 0 0 4px 4px; 
    max-height: 300px; overflow-y: auto; 
    background: #fff; 
    position: absolute; left: 12px; right: 12px; top: 55px; z-index: 1000;
    display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.suggestions li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
.suggestions li:last-child { border-bottom: none; }
/* 🌟 키보드 방향키 조작 시 하이라이트 효과 적용 (.selected) */
.suggestions li:hover, .suggestions li.selected { background-color: #f0f0f0; } 
.suggestions li strong { color: #2e7d32; }
.suggestions .meta { font-size: 0.85em; color: #666; margin-left: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" style="font-weight:bold; border-color:#333;" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 data-i18n-key="movieTitleSearch">영화 검색 (제목)</h1>

  <div class="box">
    <input type="text" id="q" class="search-input" placeholder="영화 제목을 입력하세요 (예: 범죄도시)" autocomplete="off">
    <button id="searchBtn" class="btn" style="white-space: nowrap;" data-i18n-key="searchBtn">검색</button>
    
    <ul id="suggestions" class="suggestions"></ul>
  </div>

  <div style="margin-top:20px; color:#666; font-size:0.9em;">
      * 제목을 입력하면 유사한 영화 목록이 아래에 표시됩니다.<br>
      * 목록에서 영화를 클릭하거나 <strong>방향키로 선택 후 엔터(Enter)</strong>를 누르면 가장 정확한 결과의 상세 페이지가 <strong>새 탭</strong>에서 열립니다.
  </div>
</div>

<script>
const TS = Date.now();
const PATHS = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
let MOVIES = [];
let selectedIndex = -1;

// 🌟 어떤 타입이 들어와도 에러 없이 처리하는 안전한 숫자 변환 함수
const safeParseInt = (v) => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};

async function loadIndex(){
  for (const path of PATHS) {
      try {
          const r = await fetch(path);
          if (r.ok) {
              MOVIES = await r.json();
              return;
          }
      } catch(e) {}
  }
}

const inp = document.getElementById('q');
const list = document.getElementById('suggestions');
const btn = document.getElementById('searchBtn');

function doSearch() {
    const val = inp.value.trim().toLowerCase();
    if (val.length < 1) {
        list.style.display = 'none';
        return;
    }

    const matched = getMatchedMovies(val);

    list.innerHTML = '';
    if (matched.length === 0) {
        list.style.display = 'none';
        return;
    }

    selectedIndex = -1; // 검색어가 바뀔 때마다 키보드 인덱스 초기화

    matched.forEach(m => {
        const li = document.createElement('li');
        li.className = 'suggestion-item'; // 키보드 조작용 클래스
        
        const audiNum = safeParseInt(m.audiAcc);
        const audiStr = audiNum > 0 ? ` (누적 ${audiNum.toLocaleString()}명)` : '';
        
        li.innerHTML = `<strong>${m.movieNm}</strong> <span class="meta">${m.openDt || '미개봉'} ${audiStr}</span>`;
        
        li.onclick = () => {
            openDetail(m.movieCd);
        };
        list.appendChild(li);
    });

    list.style.display = 'block';
}

// 🌟 [오류 해결 완료] 에러를 뿜던 부분을 safeParseInt로 교체하여 완벽하게 정렬
function getMatchedMovies(val) {
    if (!val) return [];
    return MOVIES.filter(m => (m.movieNm || '').toLowerCase().includes(val))
                 .sort((a,b) => safeParseInt(b.audiAcc) - safeParseInt(a.audiAcc)) // 관객수 내림차순
                 .slice(0, 30);
}

function openDetail(movieCd) {
    const url = `detail.html?movieCd=${movieCd}`;
    window.open(url, '_blank');
}

// 🌟 [요청 반영] 방향키 및 엔터키 조작 로직
inp.addEventListener('keydown', (e) => {
    const items = list.getElementsByClassName('suggestion-item');
    
    // 목록이 없거나 닫혀있으면 엔터 시 바로검색 로직 수행
    if (list.style.display === 'none' || items.length === 0) {
        if (e.key === 'Enter') handleDirectSearch();
        return;
    }

    if (e.key === 'ArrowDown') {
        e.preventDefault(); 
        selectedIndex++;
        if (selectedIndex >= items.length) selectedIndex = 0;
        updateSelection(items);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex--;
        if (selectedIndex < 0) selectedIndex = items.length - 1;
        updateSelection(items);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedIndex > -1) {
            // 항목이 하이라이트 되어있으면 해당 항목 클릭
            items[selectedIndex].click();
        } else {
            // 하이라이트가 없으면 맨 위 결과(가장 정확한/관객수 많은) 검색
            handleDirectSearch();
        }
        list.style.display = 'none';
    }
});

function updateSelection(items) {
    for (let item of items) item.classList.remove('selected');
    if (selectedIndex > -1) {
        items[selectedIndex].classList.add('selected');
        // 스크롤이 따라가도록 조치
        items[selectedIndex].scrollIntoView({ block: 'nearest' });
    }
}

function handleDirectSearch() {
    const val = inp.value.trim().toLowerCase();
    if (!val) {
        alert("검색어를 입력해주세요.");
        return;
    }
    if (MOVIES.length === 0) {
        alert("데이터를 로딩 중입니다. 잠시 후 다시 시도해주세요.");
        return;
    }

    const matched = getMatchedMovies(val);
    if (matched.length > 0) {
        openDetail(matched[0].movieCd);
    } else {
        alert("일치하는 영화가 없습니다.");
    }
}

inp.addEventListener('input', doSearch);
btn.addEventListener('click', handleDirectSearch);

// 외부 클릭 시 목록 닫기
document.addEventListener('click', (e) => {
    if (!e.target.closest('.box')) list.style.display = 'none';
});

(async function main(){ await loadIndex(); })();
</script>
</body>
</html>
