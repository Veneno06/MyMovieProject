<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title data-i18n-key="movieTitleSearchTitle">영화 제목 검색</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/translator.js" defer></script>
<style>
  .search-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
  #movieInput { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
  .autocomplete-list { 
    position: absolute; top: 100%; left: 0; right: 0; background: white; 
    border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; 
    z-index: 1000; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .autocomplete-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .autocomplete-item:hover, .autocomplete-item.selected { background-color: #f3f4f6; }
  .movie-audi { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn active" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 style="text-align: center;" data-i18n-key="movieTitleSearchTitle">영화 제목 검색</h1>
  <div class="search-container">
    <input type="text" id="movieInput" placeholder="영화 제목을 입력하세요..." autocomplete="off">
    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
  </div>
</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
let MOVIES = [];
let selectedIndex = -1;

const safeParseInt = (v) => {
    if (!v) return 0;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};

async function loadIndex() {
    for (const p of PATHS_INDEX) {
        try {
            const r = await fetch(p);
            if (r.ok) { MOVIES = await r.json(); return; }
        } catch(e) {}
    }
}

const input = document.getElementById('movieInput');
const list = document.getElementById('autocompleteList');

input.addEventListener('input', () => {
    const val = input.value.trim();
    if (!val) { list.style.display = 'none'; return; }

    // 🌟 [요청 반영] 관객수 높은 순으로 정렬
    const results = MOVIES.filter(m => m.movieNm.includes(val))
                          .sort((a, b) => safeParseInt(b.audiAcc) - safeParseInt(a.audiAcc))
                          .slice(0, 15);

    renderList(results);
});

function renderList(results) {
    if (results.length === 0) { list.style.display = 'none'; return; }
    selectedIndex = -1;
    list.innerHTML = '';
    results.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.innerHTML = `<span>${m.movieNm}</span><span class="movie-audi">${Number(safeParseInt(m.audiAcc)).toLocaleString()}명</span>`;
        item.addEventListener('click', () => { location.href = `detail.html?movieCd=${m.movieCd}`; });
        list.appendChild(item);
    });
    list.style.display = 'block';
}

// 🌟 [요청 반영] 키보드 조작 기능 추가
input.addEventListener('keydown', (e) => {
    const items = list.getElementsByClassName('autocomplete-item');
    if (list.style.display === 'none' || items.length === 0) return;

    if (e.key === 'ArrowDown') {
        selectedIndex++;
        if (selectedIndex >= items.length) selectedIndex = 0;
        updateSelection(items);
    } else if (e.key === 'ArrowUp') {
        selectedIndex--;
        if (selectedIndex < 0) selectedIndex = items.length - 1;
        updateSelection(items);
    } else if (e.key === 'Enter') {
        if (selectedIndex > -1) {
            items[selectedIndex].click();
        }
    }
});

function updateSelection(items) {
    for (let item of items) item.classList.remove('selected');
    if (selectedIndex > -1) {
        items[selectedIndex].classList.add('selected');
        items[selectedIndex].scrollIntoView({ block: 'nearest' });
    }
}

loadIndex();
</script>
</body>
</html>
