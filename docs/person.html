<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우 프로필</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.audi { font-size: 14px; color: #333; }
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.cast-list b { color: #000; font-weight: 700; background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
.chart-buttons { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chart-buttons button { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#f0f0f0; cursor:pointer; font-size:14px; }
.chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
.btn { padding:6px 10px; border:1px solid #e6e6e6; border-radius:6px; background:#fafafa; cursor:pointer; }
.sex-badge { font-size: 1rem; margin-left: 8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/translator.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 id="title" style="display:inline-block;" data-i18n-key="actorProfileTitle">배우 프로필</h1><span id="sexBadge" class="sex-badge"></span>
  
  <div class="note" data-i18n-key="filmography">출연작 (최신 개봉일 순)</div>
  <ul id="out" class="list"></ul>
  <div id="msg" class="note"></div>

  <div style="margin-top:12px; display:flex; gap:8px;">
    <button class="btn" onclick="history.back()" data-i18n-key="btnBack">🔙 뒤로</button>
    <button class="btn" id="saveBtn" style="display:none;" data-i18n-key="btnSave">☆ 배우 저장</button>
  </div>

  <div id="chart-container" style="display:none;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div class="chart-buttons">
        <button id="btnTotalAudi" class="active" data-i18n-key="audiCnt">관객수</button>
    </div>
    <canvas id="audiChart"></canvas>
  </div>
</div>

<script>
const TS = Date.now();
const INDEX_URL = `docs/data/search_index.json?v=${TS}`;
const DETAILS_URL = `docs/data/people_details.json?v=${TS}`;

function getParam(k){ return new URL(location.href).searchParams.get(k) || ""; }
const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

let MOVIES_RAW = [], PEOPLE_DETAILS = {}, myChart = null;
let currentId = null, currentName = null;
const saveBtn = document.getElementById('saveBtn');

function isSaved(id) { const s = JSON.parse(localStorage.getItem('savedPeople')||'{}'); return !!s[id]; }
function renderSaveBtn() {
    if (!currentId) return;
    saveBtn.style.display = 'inline-block';
    saveBtn.textContent = isSaved(currentId) ? '⭐ 저장됨' : '☆ 배우 저장';
}
saveBtn.addEventListener('click', () => {
    const s = JSON.parse(localStorage.getItem('savedPeople')||'{}');
    if (s[currentId]) delete s[currentId];
    else s[currentId] = { name: currentName, personKey: currentId };
    localStorage.setItem('savedPeople', JSON.stringify(s));
    renderSaveBtn();
});

async function loadData(){
  try {
    const fetchTry = async (p) => { 
        let r = await fetch(p); 
        if(!r.ok) r = await fetch(p.replace('docs/','')); 
        return r.ok ? r.json() : null; 
    };
    MOVIES_RAW = await fetchTry(INDEX_URL) || [];
    PEOPLE_DETAILS = await fetchTry(DETAILS_URL) || {};
  } catch(e) {}
}

function render(){
  currentId = getParam('id') || getParam('personKey');
  currentName = getParam('name') || "이름 없음";
  
  if (!currentId) return;
  
  document.getElementById('title').textContent = currentName;
  renderSaveBtn();

  if (PEOPLE_DETAILS[currentId]) {
      const s = PEOPLE_DETAILS[currentId].sex;
      if (s === "남") document.getElementById('sexBadge').textContent = "♂";
      if (s === "여") document.getElementById('sexBadge').textContent = "♀";
  }

  const seen = new Set();
  const myMovies = [];

  MOVIES_RAW.forEach(m => {
      if (seen.has(m.movieCd)) return;
      let match = false;

      if (currentId.startsWith('name:')) {
          // ID 없는 황정민 (이름은 같은데 ID가 비어있어야 함)
          const target = currentId.replace('name:', '');
          const aMatch = m.actors && m.actors.some(a => a.name === target && (!a.id));
          const dMatch = m.directors && m.directors.some(d => d.name === target && (!d.id));
          match = aMatch || dMatch;
      } else {
          // ID 있는 황정민 (ID 일치해야 함)
          const aMatch = m.actors && m.actors.some(a => a.id === currentId);
          const dMatch = m.directors && m.directors.some(d => d.id === currentId);
          match = aMatch || dMatch;
      }

      if (match) {
          myMovies.push(m);
          seen.add(m.movieCd);
      }
  });

  myMovies.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));
  
  const out = document.getElementById('out');
  out.innerHTML = '';
  const filmsWithAudi = [];

  if (myMovies.length === 0) {
      document.getElementById('msg').textContent = "등록된 출연작이 없습니다.";
      return;
  }

  for (const f of myMovies) {
    const audiNum = typeof f.audiAcc === 'number' ? f.audiAcc : 0;
    const audiStr = audiNum ? ` / <span class="audi">누적 ${fmtNum(audiNum)}명</span>` : '';
    let castStr = "";
    if (f.actors) {
        const d = f.actors.slice(0, 7).map(a => a.name === currentName ? `<b>${a.name}</b>` : a.name);
        castStr = ` · 배우: ${d.join(', ')}`;
    }
    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}">${f.movieNm}</a>
      <span class="note">(${f.openDt||'미상'}${audiStr}<span class="cast-list">${castStr}</span>)</span>`;
    out.appendChild(li);
    if (f.openDt && audiNum > 0) filmsWithAudi.push(f);
  }

  if (filmsWithAudi.length > 0) {
      document.getElementById('chart-container').style.display = 'block';
      drawChart(filmsWithAudi);
  }
}

function drawChart(films) {
    if (myChart) myChart.destroy();
    films.sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));
    
    new Chart(document.getElementById('audiChart'), {
        type: 'line',
        data: {
            labels: films.map(f => f.openDt.slice(0,7)),
            datasets: [{
                label: '관객수',
                data: films.map(f => f.audiAcc),
                borderColor: 'rgba(75, 192, 192, 1)',
                fill: true
            }]
        }
    });
}

(async function main(){ await loadData(); render(); })();
</script>
</body>
</html>
