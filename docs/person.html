<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우 프로필</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
<script src="assets/translator.js" defer></script>
<style>
.sentiment-control-box { background: #f6f7f9; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.sentiment-control-box label { font-weight: bold; margin-right: 5px; font-size: 14px; }
.sentiment-control-box select, .sentiment-control-box input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
.shared-chart-container { position: relative; height:300px; width:100%; margin-bottom: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="title-search.html" class="btn" data-i18n-key="movieTitleSearch">영화 검색 (제목)</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearchPeriod">영화 검색 (기간)</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <div style="margin-bottom: 20px;">
      <div style="font-size: 14px; color: #666; margin-bottom: 4px; font-weight: bold;">배우 프로필</div>
      <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
          <h1 id="title" style="margin:0;"></h1>
          <span id="codeDisplay" style="font-size: 18px; color: #888; font-family: monospace;"></span>
          <span id="sexBadge" style="font-size: 1.2rem; font-weight:bold;"></span>
      </div>
  </div>
  
  <div class="note" data-i18n-key="filmography">출연작 (최신 개봉일 순)</div>
  <ul id="out" class="list" style="margin-top:10px;"></ul>
  <div id="msg" class="note"></div>

  <div style="margin-top:12px; display:flex; gap:8px;">
    <button class="btn" onclick="history.back()" data-i18n-key="btnBack">🔙 뒤로</button>
    <button class="btn" id="saveBtn" style="display:none;" data-i18n-key="btnSave">☆ 배우 저장</button>
  </div>

  <div id="chart-container" style="display:none; margin-top: 40px;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
        <button id="btnTotalAudi" class="btn active" data-i18n-key="audiCnt">관객수</button>
        <button id="btnAudiPerActor" class="btn" data-i18n-key="audiPerActor">관객수/배우 수</button>
        <button id="btnAudiPerFilmography" class="btn" data-i18n-key="audiPerFilmo">관객수/출연작</button>
        <button id="btnAudiPerCareer" class="btn" data-i18n-key="audiPerCareer">관객수/연기경력</button>
        <button id="btnAudiBonus" class="btn" data-i18n-key="audiBonus">500만+ 가중치</button>
    </div>
    <div class="shared-chart-container">
        <canvas id="audiChart"></canvas>
    </div>
  </div>

  <div id="sentiment-container" style="display:none; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #e5e7eb;">
    <h2>유튜브 여론 분석 (긍정/부정)</h2>
    <div class="sentiment-control-box">
        <div>
            <label>X축 (기간) 설정:</label>
            <select id="timeRange">
                <option value="all">전체 기간 보기</option>
                <option value="3">최근 3년</option>
                <option value="1">최근 1년</option>
            </select>
        </div>
        <div>
            <label>Y축 (댓글 수) 고정:</label>
            <input type="number" id="yMax" placeholder="예: 30" style="width: 80px;">
        </div>
        <button class="btn" onclick="drawSentimentChart()">그래프 적용</button>
    </div>
    <div class="shared-chart-container" style="height: 350px;">
        <canvas id="sentimentChart"></canvas>
    </div>
  </div>
</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`]; 

function getParam(k){ return new URL(location.href).searchParams.get(k) || ""; }
const safeParseInt = (v) => { if (!v) return 0; if (typeof v === 'number') return v; const n = parseInt(String(v).replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

let myChart = null; 
let sentimentChartInstance = null; 
let currentId = null, currentName = null;
let rawSentimentData = null; 
let chartMoviesData = []; 

// 공통 X축 옵션 (두 차트의 시간 비율을 똑같이 맞춤)
const commonXScaleOptions = {
    type: 'time',
    time: {
        unit: 'year',
        displayFormats: { year: 'YYYY년', month: 'YYYY.MM' },
        tooltipFormat: 'YYYY년 MM월 DD일'
    },
    grid: { display: false },
    ticks: { maxRotation: 45, minRotation: 45 }
};

const saveBtn = document.getElementById('saveBtn');
function isSaved(id) { const s = JSON.parse(localStorage.getItem('savedPeople')||'{}'); return !!s[id]; }
function renderSaveBtn() { if (!currentId) return; saveBtn.style.display = 'inline-block'; saveBtn.textContent = isSaved(currentId) ? '⭐ 저장됨' : '☆ 배우 저장'; }
saveBtn.addEventListener('click', () => { const s = JSON.parse(localStorage.getItem('savedPeople')||'{}'); if (s[currentId]) delete s[currentId]; else s[currentId] = { name: currentName, personKey: currentId }; localStorage.setItem('savedPeople', JSON.stringify(s)); renderSaveBtn(); });

function updateActiveBtn(activeId) {
    const ids = ['btnTotalAudi','btnAudiPerActor','btnAudiPerFilmography','btnAudiPerCareer','btnAudiBonus'];
    ids.forEach(id => {
        const el = document.getElementById(id);
        if(id === activeId) { el.classList.add('active'); el.style.backgroundColor = '#333'; el.style.color = '#fff'; el.style.borderColor = '#333'; } 
        else { el.classList.remove('active'); el.style.backgroundColor = '#fff'; el.style.color = '#333'; el.style.borderColor = '#e5e7eb'; }
    });
}

async function fetchIndex() { for (const p of PATHS_INDEX) { try { const r = await fetch(p); if(r.ok) return await r.json(); } catch(e){} } return []; }
async function fetchPersonDetail(id) { if(!id || id.startsWith('name:')) return null; const fname = `${id}.json?v=${TS}`; for (const prefix of PATHS_DETAILS) { try { const r = await fetch(prefix + fname); if(r.ok) return await r.json(); } catch(e){} } return null; }
async function fetchSentimentData(name) { const url = `data/sentiment/${name}.json?v=${TS}`; const url2 = `docs/data/sentiment/${name}.json?v=${TS}`; for (const p of [url, url2]) { try { const r = await fetch(p); if (r.ok) return await r.json(); } catch(e) {} } return null; }

async function render(){
  currentId = getParam('id') || getParam('personKey');
  currentName = getParam('name') || "이름 없음";
  if (!currentId) return;
  document.getElementById('title').textContent = currentName;
  if (!currentId.startsWith('name:')) document.getElementById('codeDisplay').textContent = `(${currentId})`;
  renderSaveBtn();

  const allMovies = await fetchIndex() || [];
  const movieMap = {}; allMovies.forEach(m => movieMap[m.movieCd] = m);
  const details = await fetchPersonDetail(currentId);
  
  let myMovies = [];
  if (details) {
      const personInfo = (details.peopleInfoResult && details.peopleInfoResult.peopleInfo) ? details.peopleInfoResult.peopleInfo : details;
      if (personInfo && personInfo.sex) {
           const s = personInfo.sex.trim(); const badge = document.getElementById('sexBadge');
           if (s === "남자" || s === "남") { badge.textContent = "♂"; badge.style.color = "blue"; }
           else if (s === "여자" || s === "여") { badge.textContent = "♀"; badge.style.color = "red"; }
      }
      if (personInfo && personInfo.filmos) {
          myMovies = personInfo.filmos.map(filmo => {
              const baseInfo = movieMap[filmo.movieCd] || {};
              return { ...baseInfo, ...filmo, movieNm: filmo.movieNm || baseInfo.movieNm, openDt: baseInfo.openDt || filmo.openDt };
          });
      }
  }

  if (myMovies.length === 0) {
      const seen = new Set();
      allMovies.forEach(m => {
          if (seen.has(m.movieCd)) return;
          const actors = m.actors || []; const directors = m.directors || [];
          let match = currentId.startsWith('name:') ? (actors.some(a => a.name === currentName) || directors.some(d => d.name === currentName)) : (actors.some(a => a.id === currentId) || directors.some(d => d.id === currentId));
          if (match) { myMovies.push(m); seen.add(m.movieCd); }
      });
  }

  const uniqueMovies = []; const seenCodes = new Set();
  myMovies.forEach(m => {
      if (seenCodes.has(m.movieCd)) return;
      if (m.openDt && m.openDt.replace(/-/g, '').trim().length >= 4) { seenCodes.add(m.movieCd); uniqueMovies.push(m); }
  });
  uniqueMovies.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));
  
  const out = document.getElementById('out'); out.innerHTML = '';
  const filmsForChart = [];

  for (const f of uniqueMovies) {
      const audiNum = safeParseInt(f.audiAcc);
      const li = document.createElement('li'); li.style.borderBottom = "1px dashed #e5e7eb"; li.style.padding = "8px 0";
      li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}" style="font-weight:bold;">${f.movieNm}</a> <span class="note">(${f.openDt})</span>`;
      out.appendChild(li);
      if (f.openDt && f.openDt.length >= 8 && audiNum > 0) filmsForChart.push({ ...f, audiAcc: audiNum });
  }

  chartMoviesData = [...filmsForChart].sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));

  if (chartMoviesData.length > 0) {
      document.getElementById('chart-container').style.display = 'block';
      updateActiveBtn('btnTotalAudi');
      drawAudiChart('totalAudi');
      
      const buttons = [ { id: 'btnTotalAudi', type: 'totalAudi' }, { id: 'btnAudiPerActor', type: 'audiPerActor' }, { id: 'btnAudiPerFilmography', type: 'audiPerFilmography' }, { id: 'btnAudiPerCareer', type: 'audiPerCareer' }, { id: 'btnAudiBonus', type: 'audiBonus' } ];
      buttons.forEach(b => {
          const el = document.getElementById(b.id);
          if(el) el.onclick = () => { updateActiveBtn(b.id); drawAudiChart(b.type); };
      });
  }

  rawSentimentData = await fetchSentimentData(currentName);
  if (rawSentimentData && rawSentimentData.timeline) {
      document.getElementById('sentiment-container').style.display = 'block';
      drawSentimentChart();
  }
}

function drawAudiChart(type) {
    if (!chartMoviesData || chartMoviesData.length === 0) return;
    const ctx = document.getElementById('audiChart');
    if (myChart) myChart.destroy();
    
    const parsedData = chartMoviesData.map(f => {
        let val = safeParseInt(f.audiAcc);
        if (type === 'audiPerActor') val = Math.round(val / ((f.actors && f.actors.length > 0) ? f.actors.length : 1));
        else if (type === 'audiPerFilmography') val = Math.round(val / chartMoviesData.length);
        else if (type === 'audiBonus') val = val > 5000000 ? val * 1.5 : val;
        
        const dStr = f.openDt.replace(/-/g, '');
        const dateObj = new Date(`${dStr.slice(0,4)}-${dStr.slice(4,6)}-${dStr.slice(6,8)}`);
        return { x: dateObj, y: Math.round(val / 1000), movieNm: f.movieNm };
    });

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: '관객수 (단위: 천명)',
                data: parsedData,
                borderColor: '#2e7d32', backgroundColor: 'rgba(46, 125, 50, 0.1)',
                borderWidth: 2, fill: true, tension: 0.2, pointRadius: 4, pointHoverRadius: 6
            }]
        },
        options: { 
            maintainAspectRatio: false, responsive: true,
            scales: {
                x: commonXScaleOptions,
                y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString() }, title: { display: true, text: '단위: 천명' }, grid: { color: '#f3f4f6' } }
            },
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { title: (tt) => tt[0].raw.movieNm, label: (ctx) => ` 수치: ${fmtNum(ctx.raw.y * 1000)}` } }
            }
        }
    });
}

function ISOWeekToDate(weekStr) {
    const parts = weekStr.split('-W');
    const year = parseInt(parts[0], 10);
    const week = parseInt(parts[1], 10);
    const date = new Date(year, 0, 1 + (week - 1) * 7);
    const day = date.getDay();
    date.setDate(date.getDate() - day + 1);
    return date;
}

function drawSentimentChart() {
    if (!rawSentimentData || !rawSentimentData.timeline) return;
    const ctx = document.getElementById('sentimentChart').getContext('2d');
    if (sentimentChartInstance) sentimentChartInstance.destroy();

    let labels = Object.keys(rawSentimentData.timeline).sort();
    
    const timeRange = document.getElementById('timeRange').value;
    let minDate = null;
    if (timeRange !== 'all') {
        const yearsToSubtract = parseInt(timeRange, 10);
        minDate = new Date();
        minDate.setFullYear(minDate.getFullYear() - yearsToSubtract);
    }

    const posData = [];
    const negData = [];
    
    labels.forEach(week => {
        const dateObj = ISOWeekToDate(week);
        if (minDate && dateObj < minDate) return; 
        
        posData.push({ x: dateObj, y: rawSentimentData.timeline[week].positive || 0 });
        negData.push({ x: dateObj, y: -(Math.abs(rawSentimentData.timeline[week].negative || 0)) });
    });

    const yMaxInput = document.getElementById('yMax').value;
    let yMaxVal = yMaxInput ? parseInt(yMaxInput, 10) : undefined;
    let yMinVal = yMaxVal ? -yMaxVal : undefined;

    sentimentChartInstance = new Chart(ctx, {
        type: 'line', // ★ 막대그래프(bar)가 아닌 꺾은선(line)으로 완벽 복구
        data: {
            datasets: [
                { label: '긍정 댓글 (+)', data: posData, borderColor: '#3b82f6', backgroundColor: '#3b82f6', borderWidth: 2, tension: 0.1, pointRadius: 4 },
                { label: '부정 댓글 (-)', data: negData, borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 2, tension: 0.1, pointRadius: 4 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
                x: commonXScaleOptions,
                y: { max: yMaxVal, min: yMinVal, grid: { color: (ctx) => ctx.tick.value === 0 ? '#000000' : '#e5e7eb', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 } }
            },
            plugins: { tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${Math.abs(ctx.parsed.y)}개` } } }
        }
    });
}

(async function main(){ await render(); })();
</script>
</body>
</html>
