<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-g">
<title>배우 프로필</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
h2 { font-size:20px; margin:24px 0 8px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.audi { font-size: 14px; color: #333; }
.chart-buttons { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chart-buttons button { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#f0f0f0; cursor:pointer; font-size:14px; }
.chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html">홈</a>
    <a href="search.html">영화 검색</a>
    <a href="people-search.html">배우 검색</a>
    <a href="saved.html">저장 목록</a>
  </div>

  <h1 id="title">배우 프로필</h1>
  <div class="note">출연작 (최신 개봉일 순)</div>
  <ul id="out" class="list"></ul>
  <div id="msg" class="note"></div>

  <div id="chart-container" style="display:none;">
    <h2>개봉 시기별 관객수 추이</h2>
    <div class="chart-buttons">
        <button id="btnTotalAudi" class="active">관객수</button>
        <button id="btnAudiPerActor">관객수/배우 수</button>
        <button id="btnAudiPerFilmography">관객수/출연작</button>
    </div>
    <canvas id="audiChart"></canvas>
    <div class="note" style="font-size:12px; text-align: right; margin-top: 4px;">* 점에 마우스를 가까이하면 나타나는 텍스트는 영화 제목입니다.</div>
  </div>
</div>

<script>
const BASE = location.pathname.replace(/\/[^\/]*$/, '');
const PEOPLE_URL = `${BASE}/data/search/people.json?v=${Date.now()}`;

function getParam(k){ return new URL(location.href).searchParams.get(k) || ""; }
const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
let PEOPLE = [];
let myChart = null;

async function loadIndex(){
  const r = await fetch(PEOPLE_URL);
  if(!r.ok){ PEOPLE = []; return; }
  const j = await r.json();
  PEOPLE = j.people || [];
}

function render(){
  const cd = getParam('peopleCd') || '';
  const nm = getParam('peopleNm') || '';
  let item = null;

  if (cd) {
    item = PEOPLE.find(p => p.peopleCd === cd);
  }
  if (!item && nm) {
    const movieNm = getParam('movieNm') || '';
    if(movieNm) {
        item = PEOPLE.find(p => p.peopleNm === nm && p.films.some(f => f.movieNm === movieNm));
    }
    if(!item) item = PEOPLE.find(p => p.peopleNm === nm);
  }

  const out = document.getElementById('out');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');

  if (!item) {
    title.textContent = '배우 프로필';
    msg.textContent = '배우를 찾을 수 없어요. (캐시 인덱스 확인)';
    return;
  }

  title.textContent = item.peopleNm;
  out.innerHTML = '';
  const filmsWithAudi = [];

  for (const f of (item.films||[])) {
    const date = f.openDt ? f.openDt.replace(/-/g, '.') : '개봉일미상';
    const audiStr = (f.audiAcc != null) ? ` / <span class="audi">누적 ${fmtNum(f.audiAcc)}명</span>` : '';
    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}">${f.movieNm}</a>
      <span class="note">(${date}${f.part? ' · '+f.part:''}${audiStr})</span>`;
    out.appendChild(li);

    if (f.openDt) filmsWithAudi.push(f);
  }

  if (filmsWithAudi.length > 1) {
    document.getElementById('chart-container').style.display = 'block';
    
    const btnTotal = document.getElementById('btnTotalAudi');
    const btnPerActor = document.getElementById('btnAudiPerActor');
    const btnPerFilmography = document.getElementById('btnAudiPerFilmography'); // [추가] 새 버튼 참조

    btnTotal.addEventListener('click', () => {
        drawAudiChart(filmsWithAudi, 'totalAudi');
        btnTotal.classList.add('active');
        btnPerActor.classList.remove('active');
        btnPerFilmography.classList.remove('active');
    });

    btnPerActor.addEventListener('click', () => {
        drawAudiChart(filmsWithAudi, 'audiPerActor');
        btnPerActor.classList.add('active');
        btnTotal.classList.remove('active');
        btnPerFilmography.classList.remove('active');
    });

    // [추가] 새 버튼 이벤트 리스너
    btnPerFilmography.addEventListener('click', () => {
        drawAudiChart(filmsWithAudi, 'audiPerFilmography');
        btnPerFilmography.classList.add('active');
        btnTotal.classList.remove('active');
        btnPerActor.classList.remove('active');
    });

    drawAudiChart(filmsWithAudi, 'totalAudi');
  }
}

function drawAudiChart(films, dataType = 'totalAudi'){
    if (myChart) {
        myChart.destroy();
    }

    films.sort((a,b) => (a.openDt || '').localeCompare(b.openDt || ''));

    const labels = films.map(f => f.openDt.slice(0,7));
    let dataPoints;
    let yAxisLabel;

    // [추가] '관객수/출연작' 그래프 계산 로직
    if (dataType === 'audiPerFilmography') {
        const totalFilms = films.length;
        dataPoints = films.map(f => (f.audiAcc && totalFilms > 0) ? Math.round(f.audiAcc / totalFilms) : 0);
        yAxisLabel = '관객수/출연작 수 (명)';
    } else if (dataType === 'audiPerActor') {
        dataPoints = films.map(f => (f.audiAcc && f.actorCount > 0) ? Math.round(f.audiAcc / f.actorCount) : 0);
        yAxisLabel = '관객수/배우 수 (명)';
    } else {
        dataPoints = films.map(f => f.audiAcc || 0);
        yAxisLabel = '관객수 (명)';
    }
    
    const movieTitles = films.map(f => f.movieNm);

    const ctx = document.getElementById('audiChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '값', // 범례 이름을 '관객수'에서 '값'으로 일반화
                data: dataPoints,
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                fill: true,
                tension: 0.1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString(); }
                    },
                    title: {
                        display: true,
                        text: yAxisLabel
                    }
                }
            },
            plugins: {
                legend: { display: false }, // 범례는 버튼으로 대체되었으므로 숨김
                tooltip: {
                    callbacks: {
                        title: function(tooltipItems) { return movieTitles[tooltipItems[0].dataIndex]; },
                        label: function(context) {
                            let label = yAxisLabel.split(' ')[0] || '';
                            if (label) { label += ': '; }
                            if (context.parsed.y !== null) { label += context.parsed.y.toLocaleString() + '명'; }
                            return label;
                        }
                    }
                }
            }
        }
    });
}

(async function main(){
  await loadIndex();
  render();
})();
</script>
</body>
</html>
