<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우 프로필</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
h2 { font-size:20px; margin:24px 0 8px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.audi { font-size: 14px; color: #333; }
/* [신규] 배우 목록 스타일 */
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.chart-buttons { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chart-buttons button { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#f0f0f0; cursor:pointer; font-size:14px; }
.chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
.btn { padding:6px 10px; border:1px solid #e6e6e6; border-radius:6px; background:#fafafa; cursor:pointer; }
.sex-badge { font-size: 1rem; margin-left: 8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- 번역 스크립트 -->
<script src="assets/translator.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 id="title" style="display:inline-block;" data-i18n-key="actorProfileTitle">배우 프로필</h1><span id="sexBadge" class="sex-badge"></span>
  
  <div class="note" data-i18n-key="filmography">출연작 (최신 개봉일 순)</div>
  <ul id="out" class="list"></ul>
  <div id="msg" class="note"></div>

  <div style="margin-top:12px; display:flex; gap:8px;">
    <button class="btn" onclick="history.back()" data-i18n-key="btnBack">🔙 뒤로</button>
    <button class="btn" id="saveBtn" style="display:none;" data-i18n-key="btnSave">☆ 배우 저장</button>
  </div>

  <div id="chart-container" style="display:none;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div class="chart-buttons">
        <button id="btnTotalAudi" class="active" data-i18n-key="audiCnt">관객수</button>
        <button id="btnAudiPerActor" data-i18n-key="audiPerActor">관객수/배우 수</button>
        <button id="btnAudiPerFilmography" data-i18n-key="audiPerFilmo">관객수/출연작</button>
        <button id="btnAudiPerCareer" data-i18n-key="audiPerCareer">관객수/연기경력</button>
        <button id="btnAudiBonus" data-i18n-key="audiBonus">500만+ 가중치</button>
    </div>
    <canvas id="audiChart"></canvas>
    <div class="note" style="font-size:12px; text-align: right; margin-top: 4px;">* 점에 마우스를 가까이하면 나타나는 텍스트는 영화 제목입니다.</div>
  </div>
</div>

<script>
const TS = Date.now();
const PEOPLE_URL = `data/search/people.json?v=${TS}`;
const PEOPLE_DETAILS_URL = `data/search/people_details.json?v=${TS}`;
const MOVIES_URL = `data/search/movies.json?v=${TS}`; // [신규] 영화별 배우 목록을 찾기 위해 movies.json 로드

function getParam(k){ return new URL(location.href).searchParams.get(k) || ""; }
const fmtNum = n => (n==null || isNaN(n)) ? '' : n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
let PEOPLE = [];
let PEOPLE_DETAILS = {};
let MOVIES_MAP = {}; // [신규] movieCd -> movieData 매핑
let myChart = null;
let currentPerson = null;

const saveBtn = document.getElementById('saveBtn');

function getPersonId(person) { return person?.personKey || null; }
function getSavedPeople() { return JSON.parse(localStorage.getItem('savedPeople') || '{}'); }
function setSavedPeople(obj) { localStorage.setItem('savedPeople', JSON.stringify(obj)); }
function isSaved(id) { return !!getSavedPeople()[id]; }

function renderSaveBtn() {
    const personId = getPersonId(currentPerson);
    if (!personId) {
        saveBtn.style.display = 'none';
        return;
    }
    saveBtn.style.display = 'inline-block';
    
    if (window.getCurrentLang) { 
        const lang = window.getCurrentLang();
        const key = isSaved(personId) ? 'btnSaved' : 'btnSave';
        if (window.STRINGS && window.STRINGS[lang] && window.STRINGS[lang][key]) {
            saveBtn.textContent = window.STRINGS[lang][key];
        } else {
            saveBtn.textContent = isSaved(personId) ? '⭐ 저장됨(해제)' : '☆ 배우 저장';
        }
        saveBtn.setAttribute('data-i18n-key', key);
    } else {
        saveBtn.textContent = isSaved(personId) ? '⭐ 저장됨(해제)' : '☆ 배우 저장';
    }
}

saveBtn.addEventListener('click', () => {
    const personId = getPersonId(currentPerson);
    if (!personId) return;
    const saved = getSavedPeople();
    if (isSaved(personId)) {
        delete saved[personId];
    } else {
        saved[personId] = { name: currentPerson.peopleNm, personKey: currentPerson.personKey };
    }
    setSavedPeople(saved);
    renderSaveBtn(); 
});

// [수정] movies.json도 함께 로드
async function loadData(){
  try {
    const [peopleRes, detailsRes, moviesRes] = await Promise.all([
      fetch(PEOPLE_URL),
      fetch(PEOPLE_DETAILS_URL),
      fetch(MOVIES_URL)
    ]);
    
    if (peopleRes.ok) {
        const j = await peopleRes.json();
        PEOPLE = j.people || [];
    }
    if (detailsRes.ok) {
        PEOPLE_DETAILS = await detailsRes.json() || {};
    }
    
    // [신규] 영화 데이터 로드 및 매핑 (movieCd 기준 검색을 위해)
    // 주의: movies.json에는 배우 목록이 들어있지 않음. 
    // 이 요구사항을 충족하려면, 각 영화의 배우 목록을 어딘가에서 가져와야 함.
    // 하지만 현재 인덱스 구조상, movies.json에는 배우 목록이 없음.
    // people.json을 역으로 조회해서 영화별 배우를 모으는 방식 사용.
    
    if (peopleRes.ok) {
        // [신규] 영화별 배우 목록 생성 (people.json 역참조)
        PEOPLE.forEach(p => {
            const pName = p.peopleNm;
            if (!pName) return;
            (p.films || []).forEach(f => {
                const mCd = f.movieCd;
                if (!MOVIES_MAP[mCd]) MOVIES_MAP[mCd] = new Set();
                MOVIES_MAP[mCd].add(pName);
            });
        });
    }
    
  } catch(e) {
      console.error("Error loading data", e);
  }
}

function render(){
  const key = getParam('personKey') || '';
  const item = PEOPLE.find(p => p.personKey === key);

  const out = document.getElementById('out');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  const sexBadge = document.getElementById('sexBadge'); 

  if (!item) {
    title.textContent = '배우 프로필';
    if (window.translatePage) {
        const lang = window.getCurrentLang();
        title.textContent = window.STRINGS[lang]['actorProfileTitle'] || '배우 프로필';
    }
    msg.textContent = '배우를 찾을 수 없어요. (캐시 인덱스 확인)';
    return;
  }
  
  currentPerson = item;
  renderSaveBtn();

  title.textContent = item.peopleNm;
  
  const personCd = item.peopleCd || ''; 
  if (personCd && PEOPLE_DETAILS[personCd]) {
      const detail = PEOPLE_DETAILS[personCd];
      if (detail.sex === "남") sexBadge.textContent = "♂";
      if (detail.sex === "여") sexBadge.textContent = "♀";
  }

  out.innerHTML = '';
  const filmsWithAudi = [];

  for (const f of (item.films||[])) {
    const date = f.openDt ? f.openDt.replace(/-/g, '.') : '개봉일미상';
    const audiStr = (f.audiAcc != null) ? ` / <span class="audi">누적 ${fmtNum(f.audiAcc)}명</span>` : '';
    
    // [신규] 이 영화에 출연한 배우 목록 가져오기 (최대 7명)
    let castStr = "";
    if (MOVIES_MAP[f.movieCd]) {
        // 현재 주인공 배우는 목록 맨 앞에 오지 않도록, 전체 셋에서 리스트로 변환
        let actors = Array.from(MOVIES_MAP[f.movieCd]);
        // 본인 이름 제외하고, 다시 본인을 맨 앞에 추가하거나, 
        // 그냥 리스트에서 본인을 제외하고 표시할 수도 있음.
        // 여기서는 리스트 전체를 표시하되 최대 7명.
        
        // 본인을 맨 앞으로 보내기
        actors = actors.filter(name => name !== item.peopleNm);
        actors.unshift(item.peopleNm);
        
        const displayActors = actors.slice(0, 7);
        castStr = ` · 배우: ${displayActors.join(', ')}${actors.length > 7 ? '...' : ''}`;
    }

    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}">${f.movieNm}</a>
      <span class="note">(${date}${f.part? ' · '+f.part:''}${audiStr}<span class="cast-list">${castStr}</span>)</span>`;
    out.appendChild(li);

    if (f.openDt) filmsWithAudi.push(f);
  }

  if (filmsWithAudi.length > 1) {
    document.getElementById('chart-container').style.display = 'block';
    
    const buttons = [
        { id: 'btnTotalAudi', type: 'totalAudi' },
        { id: 'btnAudiPerActor', type: 'audiPerActor' },
        { id: 'btnAudiPerFilmography', type: 'audiPerFilmography' },
        { id: 'btnAudiPerCareer', type: 'audiPerCareer' },
        { id: 'btnAudiBonus', type: 'audiBonus' }
    ];

    buttons.forEach(btnInfo => {
        const button = document.getElementById(btnInfo.id);
        if (!button) return;
        button.addEventListener('click', () => {
            drawAudiChart(filmsWithAudi, btnInfo.type);
            document.querySelectorAll('.chart-buttons button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
        });
    });

    drawAudiChart(filmsWithAudi, 'totalAudi');
  }
}

function drawAudiChart(films, dataType = 'totalAudi'){
    if (myChart) {
        myChart.destroy();
    }

    films.sort((a,b) => (a.openDt || '').localeCompare(b.openDt || ''));

    const firstYear = (films.length > 0 && films[0].openDt) ? parseInt(films[0].openDt.slice(0, 4), 10) : new Date().getFullYear();

    const labels = films.map(f => f.openDt ? f.openDt.slice(0,7) : '미상');
    let dataPoints;
    let yAxisLabel;
    
    const lang = window.getCurrentLang ? window.getCurrentLang() : 'ko';
    const s = (window.STRINGS && window.STRINGS[lang]) ? window.STRINGS[lang] : STRINGS['ko']; 

    if (dataType === 'audiPerFilmography') {
        const totalFilms = films.length;
        dataPoints = films.map(f => (f.audiAcc && totalFilms > 0) ? Math.round(f.audiAcc / totalFilms) : 0);
        yAxisLabel = s.audiPerFilmo;
    } else if (dataType === 'audiPerActor') {
        dataPoints = films.map(f => (f.audiAcc && f.actorCount > 0) ? Math.round(f.audiAcc / f.actorCount) : 0);
        yAxisLabel = s.audiPerActor;
    } else if (dataType === 'audiPerCareer') {
        dataPoints = films.map(f => {
            const currentYear = f.openDt ? parseInt(f.openDt.slice(0, 4), 10) : firstYear;
            const careerDuration = Math.max(1, currentYear - firstYear + 1);
            return (f.audiAcc && careerDuration > 0) ? Math.round(f.audiAcc / careerDuration) : 0;
        });
        yAxisLabel = s.audiPerCareer;
    } else if (dataType === 'audiBonus') {
        dataPoints = films.map(f => {
            const audi = f.audiAcc || 0;
            return audi > 5000000 ? audi * 2 : audi;
        });
        yAxisLabel = s.audiBonus;
    } else {
        dataPoints = films.map(f => f.audiAcc || 0);
        yAxisLabel = s.audiCnt;
    }
    
    const movieTitles = films.map(f => f.movieNm);

    const ctx = document.getElementById('audiChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '값',
                data: dataPoints,
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                fill: true,
                tension: 0.1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString(); }
                    },
                    title: {
                        display: true,
                        text: yAxisLabel 
                    }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: function(tooltipItems) { return movieTitles[tooltipItems[0].dataIndex]; },
                        label: function(context) {
                            let label = yAxisLabel.split(' (')[0] || '';
                            if (label) { label += ': '; }
                            if (context.parsed.y !== null) { label += context.parsed.y.toLocaleString() + (lang === 'ko' ? '명' : ''); }
                            return label;
                        }
                    }
                }
            }
        }
    });
}

(async function main(){
  await loadData(); 
  render();
})();
</script>
</body>
</html>
