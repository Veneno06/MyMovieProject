<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배우 프로필</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/translator.js" defer></script>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple SD Gothic Neo, Noto Sans KR, 'Malgun Gothic', sans-serif; line-height:1.6; }
.wrap { max-width:980px; margin:24px auto; padding:0 12px; }
h1 { font-size:28px; margin:0 0 16px; }
h2 { font-size:20px; margin:24px 0 8px; }
.ctrls { display:flex; gap:8px; margin-bottom:12px; }
.ctrls a { padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; text-decoration:none; color:#111827; }
.note { color:#6b7280; }
ul.list { list-style:none; padding:0; margin:12px 0; }
li { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
.audi { font-size: 14px; color: #333; }
.cast-list { font-size: 13px; color: #555; margin-left: 4px; }
.cast-list b { color: #000; font-weight: 700; background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
.chart-buttons { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chart-buttons button { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#f0f0f0; cursor:pointer; font-size:14px; }
.chart-buttons button.active { background:#333; color:#fff; border-color:#333; font-weight:bold; }
.btn { padding:6px 10px; border:1px solid #e6e6e6; border-radius:6px; background:#fafafa; cursor:pointer; }
.sex-badge { font-size: 1rem; margin-left: 8px; font-weight:bold; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrls">
    <a href="index.html" class="btn" data-i18n-key="home">홈</a>
    <a href="search.html" class="btn" data-i18n-key="movieSearch">영화 검색</a>
    <a href="people-search.html" class="btn" data-i18n-key="peopleSearch">배우 검색</a>
    <a href="costar-search.html" class="btn" data-i18n-key="costarSearch">공동 출연 검색</a>
    <a href="saved.html" class="btn" data-i18n-key="savedList">저장 목록</a>
  </div>

  <h1 id="title" style="display:inline-block;" data-i18n-key="actorProfileTitle">배우 프로필</h1><span id="sexBadge" class="sex-badge"></span>
  
  <div class="note" data-i18n-key="filmography">출연작 (최신 개봉일 순)</div>
  <ul id="out" class="list"></ul>
  <div id="msg" class="note"></div>

  <div style="margin-top:12px; display:flex; gap:8px;">
    <button class="btn" onclick="history.back()" data-i18n-key="btnBack">🔙 뒤로</button>
    <button class="btn" id="saveBtn" style="display:none;" data-i18n-key="btnSave">☆ 배우 저장</button>
  </div>

  <div id="chart-container" style="display:none; margin-top: 40px;">
    <h2 data-i18n-key="audiTrend">개봉 시기별 관객수 추이</h2>
    <div class="chart-buttons" style="margin-bottom: 10px;">
        <button id="btnTotalAudi" class="active" data-i18n-key="audiCnt">관객수</button>
        <button id="btnAudiPerActor" data-i18n-key="audiPerActor">관객수/배우 수</button>
        <button id="btnAudiPerFilmography" data-i18n-key="audiPerFilmo">관객수/출연작</button>
        <button id="btnAudiPerCareer" data-i18n-key="audiPerCareer">관객수/연기경력</button>
        <button id="btnAudiBonus" data-i18n-key="audiBonus">500만+ 가중치</button>
    </div>
    <div style="position: relative; height:300px; width:100%">
        <canvas id="audiChart"></canvas>
    </div>
  </div>
</div>

<script>
const TS = Date.now();
const PATHS_INDEX = [`docs/data/search_index.json?v=${TS}`, `data/search_index.json?v=${TS}`];
const PATHS_DETAILS = [`docs/data/people/`, `data/people/`]; 

function getParam(k){ return new URL(location.href).searchParams.get(k) || ""; }
const safeParseInt = (v) => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const n = parseInt(String(v).replace(/,/g, '').trim(), 10);
    return isNaN(n) ? 0 : n;
};
const fmtNum = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

let MOVIES_RAW = [], PEOPLE_DETAILS = {}, myChart = null;
let currentId = null, currentName = null;
const saveBtn = document.getElementById('saveBtn');

function isSaved(id) { const s = JSON.parse(localStorage.getItem('savedPeople')||'{}'); return !!s[id]; }
function renderSaveBtn() {
    if (!currentId) return;
    saveBtn.style.display = 'inline-block';
    saveBtn.textContent = isSaved(currentId) ? '⭐ 저장됨' : '☆ 배우 저장';
}
saveBtn.addEventListener('click', () => {
    const s = JSON.parse(localStorage.getItem('savedPeople')||'{}');
    if (s[currentId]) delete s[currentId];
    else s[currentId] = { name: currentName, personKey: currentId };
    localStorage.setItem('savedPeople', JSON.stringify(s));
    renderSaveBtn();
});

async function fetchIndex() {
    for (const p of PATHS_INDEX) {
        try { const r = await fetch(p); if(r.ok) return await r.json(); } catch(e){}
    }
    return [];
}

async function fetchPersonDetail(id) {
    if(!id || id.startsWith('name:')) return null;
    const fname = `${id}.json?v=${TS}`;
    for (const prefix of PATHS_DETAILS) {
        try { const r = await fetch(prefix + fname); if(r.ok) return await r.json(); } catch(e){}
    }
    return null;
}

async function loadData(){
    MOVIES_RAW = await fetchIndex() || [];
}

async function render(){
  currentId = getParam('id') || getParam('personKey');
  currentName = getParam('name') || "이름 없음";
  
  if (!currentId) { document.getElementById('msg').textContent = '잘못된 접근'; return; }
  
  document.getElementById('title').textContent = currentName;
  renderSaveBtn();

  const details = await fetchPersonDetail(currentId);
  if (details) {
      const info = (details.peopleInfoResult && details.peopleInfoResult.peopleInfo) 
                   ? details.peopleInfoResult.peopleInfo 
                   : details;
      if (info && info.sex) {
           const s = info.sex.trim();
           const badge = document.getElementById('sexBadge');
           if (s === "남자" || s === "남") { badge.textContent = "♂"; badge.style.color = "blue"; }
           else if (s === "여자" || s === "여") { badge.textContent = "♀"; badge.style.color = "red"; }
      }
  }

  const seen = new Set();
  const myMovies = [];

  MOVIES_RAW.forEach(m => {
      if (seen.has(m.movieCd)) return;
      
      let match = false;
      const actors = m.actors || [];
      const directors = m.directors || [];

      if (currentId.startsWith('name:')) {
          const targetName = currentId.replace('name:', '');
          const aMatch = actors.some(a => a.name === targetName && (!a.id)); 
          const dMatch = directors.some(d => d.name === targetName && (!d.id));
          match = aMatch || dMatch;
      } else {
          const aMatch = actors.some(a => a.id === currentId);
          const dMatch = directors.some(d => d.id === currentId);
          match = aMatch || dMatch;
      }

      if (match) {
          myMovies.push(m);
          seen.add(m.movieCd);
      }
  });

  myMovies.sort((a,b) => (b.openDt || '').localeCompare(a.openDt || ''));
  
  const out = document.getElementById('out');
  out.innerHTML = '';
  const filmsWithAudi = [];

  if (myMovies.length === 0) {
      document.getElementById('msg').textContent = "등록된 출연작이 없습니다.";
      return;
  }

  for (const f of myMovies) {
    const audiNum = safeParseInt(f.audiAcc);
    const audiStr = audiNum ? ` / <span class="audi">누적 ${fmtNum(audiNum)}명</span>` : '';
    
    let castStr = "";
    if (f.actors) {
        const d = f.actors.slice(0, 7).map(a => a.name === currentName ? `<b>${a.name}</b>` : a.name);
        castStr = ` · 배우: ${d.join(', ')}`;
    }
    
    const li = document.createElement('li');
    li.innerHTML = `<a href="detail.html?movieCd=${encodeURIComponent(f.movieCd)}">${f.movieNm}</a>
      <span class="note">(${f.openDt||'미상'}${audiStr}<span class="cast-list">${castStr}</span>)</span>`;
    out.appendChild(li);
    
    if (f.openDt && audiNum > 0) filmsWithAudi.push({ ...f, audiAcc: audiNum });
  }

  if (filmsWithAudi.length > 0) {
      document.getElementById('chart-container').style.display = 'block';
      
      const chartData = [...filmsWithAudi].sort((a,b) => (a.openDt||'').localeCompare(b.openDt||''));
      drawChart(chartData, 'totalAudi');
      
      const buttons = [
        { id: 'btnTotalAudi', type: 'totalAudi' },
        { id: 'btnAudiPerActor', type: 'audiPerActor' },
        { id: 'btnAudiPerFilmography', type: 'audiPerFilmography' },
        { id: 'btnAudiPerCareer', type: 'audiPerCareer' },
        { id: 'btnAudiBonus', type: 'audiBonus' }
      ];
      buttons.forEach(b => {
          const el = document.getElementById(b.id);
          if(el) {
              el.onclick = () => {
                  document.querySelectorAll('.chart-buttons button').forEach(x => x.classList.remove('active'));
                  el.classList.add('active');
                  drawChart(chartData, b.type);
              };
          }
      });
  }
}

function drawChart(films, type) {
    const ctx = document.getElementById('audiChart');
    if (!ctx) return;
    
    if (myChart) myChart.destroy();
    
    let rawData = films.map(f => f.audiAcc);
    
    if (type === 'audiPerActor') {
        rawData = films.map(f => Math.round(f.audiAcc / (f.actors && f.actors.length > 0 ? f.actors.length : 1)));
    }
    if (type === 'audiPerFilmography') { 
        const t = films.length; 
        rawData = films.map(f => Math.round(f.audiAcc / t)); 
    }
    if (type === 'audiPerCareer') {
        if (films.length > 0) {
            const firstYear = parseInt(films[0].openDt.slice(0,4));
            rawData = films.map(f => {
                const curYear = parseInt(f.openDt.slice(0,4));
                const yearDiff = Math.max(1, curYear - firstYear + 1);
                return Math.round(f.audiAcc / yearDiff);
            });
        }
    }
    if (type === 'audiBonus') {
        rawData = films.map(f => f.audiAcc > 5000000 ? f.audiAcc * 1.5 : f.audiAcc);
    }

    const dataPoints = rawData.map(v => Math.round(v / 1000));

    const labels = films.map(f => {
        const d = f.openDt.replace(/-/g, '');
        if (d.length >= 6) {
            return `${d.slice(0,4)}.${d.slice(4,6)}`;
        }
        return d;
    });

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '관객수 (단위: 천명)',
                data: dataPoints,
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderWidth: 2,
                fill: true,
                tension: 0.3
            }]
        },
        options: { 
            maintainAspectRatio: false,
            responsive: true,
            scales: {
                y: {
                    ticks: {
                        stepSize: 1000,
                        callback: function(value) {
                            return value.toLocaleString();
                        }
                    },
                    title: {
                        display: true,
                        text: '단위: 천명'
                    }
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        // [수정됨] 툴팁 제목을 날짜 대신 영화 제목으로 변경
                        title: function(tooltipItems) {
                            const index = tooltipItems[0].dataIndex;
                            return films[index].movieNm;
                        },
                        label: function(context) {
                            // 툴팁 내용은 기존대로 실제 전체 관객수 표시
                            return ` 관객수: ${fmtNum(context.raw * 1000)}명`;
                        }
                    }
                }
            }
        }
    });
}

(async function main(){ await loadData(); render(); })();
</script>
</body>
</html>
