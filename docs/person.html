<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인물 상세 정보 - MyMovieProject</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 py-4">
            <a href="index.html" class="font-bold text-xl text-blue-600 mr-6">MyMovieProject</a>
            <a href="people-search.html" class="text-sm font-medium text-gray-500 hover:text-gray-900">← 다시 검색하기</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- 인물 헤더 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 mb-8">
            <h1 id="personName" class="text-3xl font-bold mb-2">로딩 중...</h1>
            <p id="personCode" class="text-sm text-gray-400 mb-4"></p>
            <div class="flex gap-2 text-sm text-gray-600">
                <span id="roleBadge" class="bg-gray-100 px-3 py-1 rounded-full">영화인</span>
            </div>
        </div>

        <!-- 필모그래피 리스트 -->
        <h2 class="text-xl font-bold mb-4 px-2 border-l-4 border-blue-500">필모그래피 (참여 작품)</h2>
        <div id="movieList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <!-- 영화 목록이 여기에 표시됨 -->
        </div>
    </main>

    <script>
        // URL에서 파라미터 추출
        const params = new URLSearchParams(window.location.search);
        const targetId = params.get('id'); // 영화인 코드 (핵심)
        const targetName = params.get('name') || "이름 없음";

        document.getElementById('personName').textContent = targetName;
        if (targetId && !targetId.startsWith('unknown')) {
            document.getElementById('personCode').textContent = `KOFIC Code: ${targetId}`;
        }

        // 데이터 로드 및 필터링
        fetch('docs/data/search_index.json')
            .then(r => r.json())
            .then(movies => {
                // [핵심] ID가 일치하는 영화만 골라내기
                const myMovies = movies.filter(movie => {
                    // 배우로서 참여했는지 확인
                    const isActor = movie.actors && movie.actors.some(a => a.id === targetId);
                    // 감독으로서 참여했는지 확인
                    const isDirector = movie.directors && movie.directors.some(d => d.id === targetId);
                    
                    return isActor || isDirector;
                });

                // 최신순 정렬
                myMovies.sort((a, b) => (b.year || 0) - (a.year || 0));

                renderMovies(myMovies);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('movieList').innerHTML = "데이터를 불러오는 중 오류가 발생했습니다.";
            });

        function renderMovies(movies) {
            const container = document.getElementById('movieList');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<p class="text-gray-500 col-span-full">등록된 출연작이 없습니다. (데이터 수집 중일 수 있습니다)</p>';
                return;
            }

            movies.forEach(m => {
                // 배역 이름 찾기
                let role = "";
                const actorInfo = m.actors ? m.actors.find(a => a.id === targetId) : null;
                if (actorInfo && actorInfo.cast) role = `배역: ${actorInfo.cast}`;
                else if (m.directors && m.directors.some(d => d.id === targetId)) role = "감독";

                const html = `
                    <div class="bg-white border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg truncate" title="${m.title}">${m.title}</h3>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">${m.year || '미정'}</span>
                        </div>
                        <p class="text-sm text-gray-500 mb-1">${m.titleEn || ''}</p>
                        <p class="text-sm text-blue-600 font-medium">${role}</p>
                        <p class="text-xs text-gray-400 mt-2">${m.nation || ''}</p>
                    </div>
                `;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
