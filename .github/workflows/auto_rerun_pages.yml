name: Watchdog - Auto Re-run Pages Deployment

on:
  workflow_run:
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types:
      - completed

permissions:
  actions: write

jobs:
  auto-retry-if-failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub infrastructure to settle
        run: |
          echo "서버 병목 해소를 위해 45초 대기 후 재시도를 트리거합니다..."
          sleep 45

      - name: Automatically Trigger Re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚨 Pages 배포 실패 감지됨 (Run ID: ${{ github.event.workflow_run.id }})"
          echo "🔄 시스템이 자동으로 Re-run을 명령합니다..."
          
          # [수정됨] --repo ${{ github.repository }} 를 추가하여 길을 잃지 않도록 명시
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
          
          echo "✅ Re-run 명령 전송 완료. Actions 탭에서 재시작을 확인하세요."
