name: Fetch Opening Week Audience

on:
  schedule:
    # KST 기준 매일 새벽 5시에 실행 (UTC 20:00) -> 기존 작업과 시간 충돌 방지
    - cron: '0 20 * * *'
  workflow_dispatch: # 수동 실행을 위한 버튼 활성화

jobs:
  update-opening-week:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script (60% API limit)
        env:
          # Settings > Secrets and variables > Actions에 등록된 키 사용
          KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}
          KOFIC_API_KEY_7: ${{ secrets.KOFIC_API_KEY_7 }}
        run: python scripts/fetch_opening_week.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/opening_week.json
          
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: First Week Audience Data" && git push)
