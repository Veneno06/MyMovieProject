name: Rebuild local research data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild-local-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research validation dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Test local merger
        run: python -m unittest discover -s tests -p test_movie_records.py
      - name: Rebuild search index and coverage audit
        run: python scripts/reindex_search.py
      - name: Rebuild movie and people indexes
        run: python scripts/build_indices.py
      - name: Synchronize people audience
        run: python scripts/sync_people_stats.py
      - name: Rebuild summary from current indexes
        run: python scripts/build_db_summary.py
      - name: Validate repaired research snapshot
        run: python scripts/validate_research.py
      - name: Commit generated local data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild consistent local research indexes and summary'
            git push
          fi
