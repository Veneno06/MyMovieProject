name: Build recovery follow-up study

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rebuild-local-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed endpoints, ties and missing releases
        run: python -m unittest discover -s tests -p 'test_recovery_followup.py' -v
      - name: Build from existing data only
        env:
          PYTHON: python
        run: node scripts/build_recovery_followup.js
      - name: Save generated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/research/recovery_followup.json docs/data/research/recovery_followup.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Build fixed second-release recovery observations'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"; then
            echo '::warning::Results committed. Pages rebuild request was not accepted; check pages build and deployment, then rerun that deployment if required.'
          fi
