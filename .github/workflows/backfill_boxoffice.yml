name: Backfill BoxOffice History (API)

on:
  # 1. 수동 실행 (기존 기능)
  workflow_dispatch:
    inputs:
      days:
        description: '조회할 과거 일수 (예: 365 = 1년)'
        required: true
        default: '365'
      start_date:
        description: '시작 날짜 (YYYYMMDD, 비워두면 어제)'
        required: false
        default: ''
  
  # 2. 자동 실행 (추가된 기능)
  # 매일 한국 시간 오전 11시 (UTC 02:00)에 실행
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Run BoxOffice Backfill
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
          KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
          KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
          KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}
          KOFIC_API_KEY_7: ${{ secrets.KOFIC_API_KEY_7 }}
        run: |
          # [자동/수동 분기 처리]
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # 자동 실행일 경우: 최근 7일치만 가볍게 조회
            echo "Running scheduled update (last 7 days)..."
            python scripts/backfill_boxoffice.py --days 7
          else
            # 수동 실행일 경우: 입력된 값 사용
            START_DT="${{ inputs.start_date }}"
            DAYS="${{ inputs.days }}"
            
            if [ -z "$START_DT" ]; then
              python scripts/backfill_boxoffice.py --days "$DAYS"
            else
              python scripts/backfill_boxoffice.py --start-date "$START_DT" --days "$DAYS"
            fi
          fi

      # [추가된 단계] 영화 파일의 관객수를 배우 파일로 복사
      - name: Sync People Stats
        run: |
          python scripts/sync_people_stats.py

      - name: Rebuild search indexes
        run: |
          python scripts/reindex_search.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add docs/data/movies/
          git add docs/data/people/
          git add docs/data/search_index.json
          
          git commit -m "Auto update: BoxOffice & People Stats" || echo "No changes"
          
          git pull --rebase origin main
          git push
