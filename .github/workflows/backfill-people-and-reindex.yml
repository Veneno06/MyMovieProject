name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget (Default: 3000)'
        required: true
        default: '3000'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # 6개 키 모두 사용
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
      KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
      KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
      KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Backfill people codes
        continue-on-error: true
        run: |
          # 1. 영화 데이터에 배우 ID 채워넣기
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "200"

      - name: Build people details (Gender)
        continue-on-error: true
        run: |
          # 2. [순서 변경] 확보된 ID를 바탕으로 성별/세부정보 먼저 다운로드
          # 이 단계가 끝나야 reindex할 때 성별을 읽을 수 있음
          python scripts/build_people_details.py

      - name: Rebuild search indexes
        continue-on-error: true
        run: |
          # 3. 모든 데이터(영화 + 배우성별)가 준비된 후 인덱싱 시작
          python scripts/reindex_search.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 데이터 누락 방지를 위한 Force Add 유지
          git add --force docs/data/movies/
          git add docs/data/people/
          git add docs/data/search_index.json
          git add .
          
          git commit -m "Update movie data & indexes (Correct Order)" || echo "No changes"
          
          git pull --rebase origin main
          git push
