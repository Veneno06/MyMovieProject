name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget amount to process'
        required: true
        default: '5000'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Backfill people codes
        run: |
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "250"

      - name: Rebuild search indexes
        run: python scripts/reindex_search.py

      - name: Build people details (gender)
        run: python scripts/build_people_details.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update people data and indexes"
          git push
