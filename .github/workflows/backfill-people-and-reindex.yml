name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "이번 실행의 최대 API 호출 수 (권장 600)"
        required: false
        default: "600"
      rate_sleep_ms:
        description: "호출 간 대기(ms) (권장 250)"
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: backfill-people
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      # [수정] 여러 개의 API 키를 환경 변수로 전달
      - name: Backfill people fields (movieInfo)
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
          KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
          KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
        run: |
          set -eux
          # [수정] kofic_api.py를 먼저 실행할 필요 없이, backfill_people.py가 알아서 임포트함
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "${{ inputs.rate_sleep_ms }}"

      - name: Rebuild search indexes
        run: |
          set -eux
          python scripts/build_indices.py

      # [신규] '성별' 정보 수집 단계 추가
      - name: Build people details (gender, etc)
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
          KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
          KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
        run: |
          set -eux
          python scripts/build_people_details.py

      - name: Commit updated caches
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Backfill people, rebuild indexes, and fetch people details"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
