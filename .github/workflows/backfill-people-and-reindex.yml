name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget (Default: 5000)'
        required: true
        default: '5000'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
      KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
      KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
      KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Backfill people codes
        continue-on-error: true
        run: |
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "200"

      - name: Rebuild search indexes
        continue-on-error: true
        run: python scripts/reindex_search.py

      - name: Build people details (Gender)
        continue-on-error: true
        run: python scripts/build_people_details.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update data (Final Run)" || echo "No changes"
          
          # [핵심] 충돌 방지: 최신 코드 받아와서 합치고 저장
          git pull --rebase origin main
          git push
