name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget amount to process'
        required: true
        default: '5000'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # [수정됨] requirements.txt 파일이 없어도 에러가 나지 않도록 조건문을 추가했습니다.
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then
            echo "requirements.txt found. Installing dependencies..."
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. Installing default packages (requests)..."
            # 파일이 없을 경우 스크립트 실행에 필수적인 requests 패키지만 설치합니다.
            pip install requests
          fi

      # [이전 수정 유지] 숫자 계산 에러(bad substitution)를 방지하는 코드입니다.
      - name: Backfill people codes
        env:
          TOTAL_BUDGET: ${{ inputs.budget }}
        run: |
          set -eux
          
          # 쉘 환경변수를 사용하여 안전하게 계산
          BACKFILL_BUDGET=$(( TOTAL_BUDGET * 8 / 10 ))
          
          echo "입력된 예산: $TOTAL_BUDGET"
          echo "계산된 Backfill 예산(80%): $BACKFILL_BUDGET"

          # 파이썬 스크립트 실행
          python scripts/backfill_people.py \
            --budget "$BACKFILL_BUDGET" \
            --rate-sleep-ms "250"

      # 후속 단계 (스크립트가 없어도 워크플로우가 중단되지 않도록 예외 처리)
      - name: Rebuild search indexes
        run: python scripts/reindex_search.py 2>/dev/null || echo "Warning: scripts/reindex_search.py not found or failed"

      - name: Build people details (gender)
        run: python scripts/build_people_details.py 2>/dev/null || echo "Warning: scripts/build_people_details.py not found or failed"

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update people data and indexes" || echo "No changes to commit"
          git push
