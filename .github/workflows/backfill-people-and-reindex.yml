name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "이번 실행의 최대 API 호출 수 (총합)"
        required: false
        default: "5000"
      rate_sleep_ms:
        description: "호출 간 대기(ms)"
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: backfill-people
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      # [1단계] 영화인 코드 보강 (Backfill)
      - name: Backfill people codes
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
        run: |
          set -eux
          # budget의 80%를 backfill에 할당 (예: 4000회)
          BACKFILL_BUDGET=$((${inputs.budget} * 8 / 10))
          python scripts/backfill_people.py \
            --budget "$BACKFILL_BUDGET" \
            --rate-sleep-ms "${{ inputs.rate_sleep_ms }}"

      # [2단계] 인덱스 재빌드 (people.json 생성)
      - name: Rebuild search indexes
        run: |
          set -eux
          python scripts/build_indices.py

      # [3단계] 성별 정보 수집
      - name: Build people details (gender)
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
        run: |
          set -eux
          # 남은 예산을 사용 (예: 1000회)
          DETAIL_BUDGET=$((${inputs.budget} * 2 / 10))
          python scripts/build_people_details.py \
            --budget "$DETAIL_BUDGET" \
            --rate-sleep-ms "${{ inputs.rate_sleep_ms }}"

      - name: Commit updated data
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Data Update: Backfill people codes & gender info"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
