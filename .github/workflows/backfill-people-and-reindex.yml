name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget amount to process'
        required: true
        default: '5000'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Backfill people codes
        # [중요] 에러가 발생해도(API 한도 초과 등) 멈추지 않고 다음 단계로 진행하여
        # 수집된 데이터라도 저장하도록 설정했습니다.
        continue-on-error: true
        run: |
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "250"

      - name: Rebuild search indexes
        run: python scripts/reindex_search.py

      - name: Build people details (gender)
        run: python scripts/build_people_details.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          # 변경사항이 없으면 에러가 나지 않도록 처리
          git commit -m "Update people data and indexes" || echo "No changes to commit"
          git push
