name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget amount (Recommended: 2500)'
        required: true
        # [전략] 키 2개 = 총 6000회 가능
        # 한국 영화만 골라내므로 API 효율이 좋지만, 안전을 위해 절반 이하인 2500으로 설정
        default: '2500'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # 방금 등록한 새 키 2개를 사용합니다.
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Backfill people codes (Korean Movies Only)
        # 만약 API 한도가 차더라도 중단하지 않고 다음 단계(저장)로 넘어갑니다.
        continue-on-error: true
        run: |
          # 입력받은 budget만큼 한국 영화 배우 코드를 수집합니다.
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "250"

      - name: Rebuild search indexes
        # 수집된 데이터를 검색 엔진에 반영합니다.
        run: python scripts/reindex_search.py

      - name: Build people details (Gender)
        # 수집된 코드를 바탕으로 성별 정보를 추가합니다.
        # (이 단계도 API를 사용하므로, 남은 키 한도를 여기서 씁니다)
        continue-on-error: true
        run: python scripts/build_people_details.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update Korean people data (New Keys)" || echo "No changes to commit"
          git push
