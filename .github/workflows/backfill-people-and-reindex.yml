name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'API 한도 예산 (기본값: 3000)'
        required: true
        default: '3000'
      target_names:
        description: '수동으로 강제 업데이트할 이름 (쉼표 구분, 예: 나홍진,정호연)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
      KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
      KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
      KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
      KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}
      KOFIC_API_KEY_7: ${{ secrets.KOFIC_API_KEY_7 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      # 1단계: 영화 데이터에 배우/감독 ID 채워넣기 (수동 타겟 입력값 전달)
      - name: Backfill people codes
        run: |
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "100" \
            --target-names "${{ inputs.target_names }}"

      # 2단계: 확보된 ID를 바탕으로 성별/세부정보 다운로드
      - name: Build people details (Gender)
        run: |
          python scripts/build_people_details.py

      # 3단계: 검색 인덱스 재구축
      - name: Rebuild search indexes
        run: |
          python scripts/reindex_search.py

      # 4단계: 데이터 저장 (가장 중요)
      - name: Commit updated data
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 데이터 폴더 강제 추가
          git add --force docs/data/movies/
          git add docs/data/people/
          git add docs/data/search_index.json
          git add .
          
          git commit -m "Update movie data & indexes (Smart Rotation & Targeted)" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push
