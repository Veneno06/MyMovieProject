name: Backfill People & Reindex

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget amount to process (Max 6000 for 2 keys)'
        required: true
        default: '5500'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # [긴급 수정] 죽은 키는 제거하고, 새 키(4, 5번)를 메인 변수(Key 1, 2)에 강제로 할당합니다.
      # 이렇게 하면 스크립트는 처음부터 새 키를 사용하게 됩니다.
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY_4 }}
      KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_5 }}
      # 3번 변수는 비워두거나 제거하여 스크립트가 2개만 인식하도록 합니다.
      
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Backfill people codes
        # 만약 새 키도 문제가 생기더라도, 수집된 데이터는 건지기 위해 설정 유지
        continue-on-error: true
        run: |
          python scripts/backfill_people.py \
            --budget "${{ inputs.budget }}" \
            --rate-sleep-ms "250"

      - name: Rebuild search indexes
        run: python scripts/reindex_search.py

      - name: Build people details (gender)
        run: python scripts/build_people_details.py

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update people data and indexes (New Keys Forced)" || echo "No changes to commit"
          git push
