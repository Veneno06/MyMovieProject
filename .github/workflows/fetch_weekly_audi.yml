name: Fetch Weekly Audience (Manual)

on:
  workflow_dispatch:
    inputs:
      actor:
        description: '수집할 배우 이름 (예: 황정민)'
        required: true

permissions:
  contents: write

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
          KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
          KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
        run: python scripts/fetch_weekly_audi.py --actor "${{ inputs.actor }}"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add docs/data/movies/
          git commit -m "Add Week 1 audience data for ${{ inputs.actor }}" || echo "No changes to commit"
          git push
