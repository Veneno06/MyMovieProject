name: KOFIC Daily Fetch

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kofic-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch KOFIC Daily Box Office
        env:
          # [수정됨] 기존 키 대신 8번 키를 사용하여 일일 박스오피스를 가져옵니다.
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY_8 }}
        run: |
          TARGET_DT=$(TZ=Asia/Seoul date -d "yesterday" +%Y%m%d)
          TARGET_DT_FMT=$(TZ=Asia/Seoul date -d "yesterday" +%Y-%m-%d)
          DAILY_FILE="docs/data/${TARGET_DT}.json"
          
          echo "Fetching data for $TARGET_DT"
          # KOFIC_API_KEY_8을 사용하여 요청
          curl -s "http://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=${KOFIC_API_KEY}&targetDt=${TARGET_DT}" > "$DAILY_FILE"
          
          # 데이터 유효성 검사 (목록이 비었거나 에러면 중단)
          if ! jq -e '.boxOfficeResult.dailyBoxOfficeList[0]' "$DAILY_FILE" > /dev/null; then
            echo "Fetched data is invalid or empty. Skipping update."
            exit 0
          fi
          
          echo "{\"url\": \"data/${TARGET_DT}.json\", \"date\": \"${TARGET_DT_FMT}\"}" > docs/data/latest.json
          echo "Daily box office data for $TARGET_DT and latest.json saved."

      - name: Update movie details from new daily file
        env:
          # [수정됨] 파이썬 스크립트에도 8번 키를 전달합니다.
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY_8 }}
        run: |
          python scripts/update_data.py

      - name: Rebuild search indexes
        run: |
          python scripts/build_indices.py

      - name: Commit updated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eux
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "KOFIC: Daily data update (Key 8)"
          
          # [유지] 원격 변경사항을 먼저 당겨와서 충돌 방지
          git pull --rebase origin "$BRANCH"
          
          git push origin "HEAD:$BRANCH"
