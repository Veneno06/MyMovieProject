name: KOFIC Daily Fetch

on:
  schedule:
    # [수정] 한국 시간 기준 매일 오후 3시 30분에 실행 (UTC 06:30)
    # 데이터 집계가 확실히 끝났을 시간으로 변경하여 안정성 확보
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kofic-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch KOFIC Daily Box Office
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: |
          TARGET_DT=$(TZ=Asia/Seoul date -d "yesterday" +%Y%m%d)
          TARGET_DT_FMT=$(TZ=Asia/Seoul date -d "yesterday" +%Y-%m-%d)
          DAILY_FILE="docs/data/${TARGET_DT}.json"
          
          echo "Fetching data for $TARGET_DT"
          curl -s "http://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=${KOFIC_API_KEY}&targetDt=${TARGET_DT}" > "$DAILY_FILE"
          
          # [추가] 다운로드한 데이터가 유효한지 확인하는 방어 코드
          # JSON 파일 안에 boxOfficeResult.dailyBoxOfficeList[0] 필드가 존재하는지 확인
          if ! jq -e '.boxOfficeResult.dailyBoxOfficeList[0]' "$DAILY_FILE" > /dev/null; then
            echo "Fetched data is invalid or empty. Skipping update."
            exit 0
          fi
          
          # 유효한 데이터일 때만 latest.json 파일을 생성
          echo "{\"url\": \"data/${TARGET_DT}.json\", \"date\": \"${TARGET_DT_FMT}\"}" > docs/data/latest.json
          echo "Daily box office data for $TARGET_DT and latest.json saved."

      - name: Update movie details from new daily file
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: |
          python scripts/update_data.py

      - name: Rebuild search indexes
        run: |
          python scripts/build_indices.py

      - name: Commit updated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eux
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "KOFIC: Daily data update"
          git push origin "HEAD:$BRANCH"
