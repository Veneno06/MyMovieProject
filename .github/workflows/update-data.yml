name: KOFIC Daily Fetch

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kofic-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch KOFIC Daily Box Office
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY_8 }}
        run: |
          TARGET_DT=$(TZ=Asia/Seoul date -d "yesterday" +%Y%m%d)
          TARGET_DT_FMT=$(TZ=Asia/Seoul date -d "yesterday" +%Y-%m-%d)
          DAILY_FILE="docs/data/${TARGET_DT}.json"
          TEMP_FILE="${DAILY_FILE}.tmp"
          
          # HTTP 대신 안전한 HTTPS 엔드포인트 사용
          API_URL="https://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json"
          
          echo "Fetching data for $TARGET_DT"
          rm -f "$TEMP_FILE"
          
          # 강력한 재시도 및 타임아웃 방어 로직 적용
          if ! curl \
            --silent \
            --show-error \
            --fail \
            --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 10 \
            --retry-max-time 600 \
            --output "$TEMP_FILE" \
            "${API_URL}?key=${KOFIC_API_KEY}&targetDt=${TARGET_DT}"; then
            echo "::error::KOFIC API request failed after retries."
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # JSON 자체가 정상적인지 1차 확인
          if ! jq empty "$TEMP_FILE" > /dev/null 2>&1; then
            echo "::error::KOFIC response is not valid JSON."
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # 박스오피스 목록이 존재하는지 2차 확인
          if ! jq -e '.boxOfficeResult.dailyBoxOfficeList[0]' "$TEMP_FILE" > /dev/null; then
            echo "::error::KOFIC response contains no daily box office data."
            jq -c '.faultInfo // .failInfo // .' "$TEMP_FILE" 2>/dev/null || true
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # 모든 검증을 통과했을 때만 실제 파일로 덮어쓰기
          mv "$TEMP_FILE" "$DAILY_FILE"
          
          echo "{\"url\": \"data/${TARGET_DT}.json\", \"date\": \"${TARGET_DT_FMT}\"}" > docs/data/latest.json
          echo "Daily box office data for $TARGET_DT and latest.json saved safely."

      - name: Update movie details from new daily file
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY_8 }}
        run: |
          python scripts/update_data.py

      - name: Rebuild search indexes
        run: |
          python scripts/build_indices.py

      - name: Commit updated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eux
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "KOFIC: Daily data update (Key 8) with Retry Logic"
          
          git pull --rebase origin "$BRANCH"
          
          git push origin "HEAD:$BRANCH"
