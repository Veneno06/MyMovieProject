name: Fill Missing Audience (Partitioned)

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: '영화 제목 시작 글자 (예: 가, 나, A, 1... 비워두면 전체)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      # 입력받은 글자(패턴)로 시작하는 영화만 조회
      - name: Run Deep Scan (Partitioned)
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          KOFIC_API_KEY_2: ${{ secrets.KOFIC_API_KEY_2 }}
          KOFIC_API_KEY_3: ${{ secrets.KOFIC_API_KEY_3 }}
          KOFIC_API_KEY_4: ${{ secrets.KOFIC_API_KEY_4 }}
          KOFIC_API_KEY_5: ${{ secrets.KOFIC_API_KEY_5 }}
          KOFIC_API_KEY_6: ${{ secrets.KOFIC_API_KEY_6 }}
          KOFIC_API_KEY_7: ${{ secrets.KOFIC_API_KEY_7 }}
        run: python scripts/fill_missing_audi_gh.py --pattern "${{ inputs.pattern }}"

      # 동기화
      - name: Sync People Stats
        run: python scripts/sync_people_stats.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Fill missing audience (Pattern: ${{ inputs.pattern }})" || echo "No changes"
          git push
